<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E2B33">
<title>Controle de Produção</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#141416; --ink-2:#26272B; --paper:#F4F4F5; --card:#FFFFFF; --line:#DEDFE2;
  --text:#1B1C20; --mute:#6A6D75;
  --brand:#C4161C; --brand-on:#FFFFFF; --brand-soft:#FBE4E5; --accent:#E8383D;
  --logo-bg:transparent; --chip:#ECEDEF;
  --jade:#1F7A63; --jade-soft:#E0EFE9;
  --chili:#C23A2E; --chili-soft:#FAE5E2;
  --yuzu:#B98107; --yuzu-soft:#FAF0D4;
  --sky:#2F6690; --sky-soft:#E3EDF5;
  --r-lg:16px; --r:10px;
  --display:'Bricolage Grotesque', 'Figtree', system-ui, sans-serif;
  --body:'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
/* Temas por empresa: QF = Q Food (Todas e Cozinha de Produção), ML = Mercearia Liberdade, GG = Gogui */
body[data-tema="ML"]{
  --ink:#3A0C10; --ink-2:#521519; --paper:#FBF6F1; --line:#EEDFD3;
  --text:#2B1A17; --mute:#7A6259;
  --brand:#D8261F; --brand-on:#FFFFFF; --brand-soft:#FDE6DC; --accent:#F29A22;
  --logo-bg:#FFFFFF; --chip:#F6E8DC;
}
body[data-tema="GG"]{
  --ink:#110F0C; --ink-2:#231F19; --paper:#F7F4EE; --line:#E6DECF;
  --text:#1D1913; --mute:#756B5C;
  --brand:#8A6629; --brand-on:#FFFFFF; --brand-soft:#F3EAD7; --accent:#D4AF5F;
  --logo-bg:#110F0C; --chip:#EFE7D8;
}
body{transition:background-color .35s ease}
.top,.gauge,.login{transition:background-color .35s ease}
.brand-row{display:flex;align-items:center;gap:12px;min-width:0;min-height:46px}
.brand-logo{height:40px;width:auto;max-width:96px;object-fit:contain;border-radius:8px;background:var(--logo-bg);padding:3px 6px;flex:none}
body[data-tema="GG"] .brand-logo{height:44px;padding:0}
body[data-tema="QF"] .brand-logo{height:44px;max-width:120px;padding:0}
.login .brand-logo{height:72px;max-width:180px;margin:0 0 18px}
@media (max-width:640px){.brand-logo{height:32px;max-width:70px}.brand small{display:none}}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--body);background:var(--paper);color:var(--text);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Topo ---------- */
.top{background:var(--ink);color:#fff;position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top)}
.top-in{max-width:1180px;margin:0 auto;padding:14px 18px 0;display:flex;align-items:center;gap:14px}
.brand{font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:-.02em;line-height:1.05}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:12px;opacity:.7;letter-spacing:0;margin-top:3px}
.top .spacer{flex:1}
.menu-link{flex:none;display:inline-flex;align-items:center;gap:4px;color:#fff;text-decoration:none;font-weight:700;font-size:13.5px;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:6px 12px}
.menu-link:hover{background:rgba(255,255,255,.1)}
.login .menu-link{align-self:flex-start;margin:-28px 0 28px}
.who{display:flex;align-items:center;gap:10px;font-size:13px}
.who b{display:block;font-weight:600}
.who span{opacity:.7}
.who button{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:5px 12px;cursor:pointer;font-size:12.5px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;opacity:.85;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:#9aa6ad;display:inline-block}
.sync.ok i{background:#5fd3a9}.sync.err i{background:#ff8a7d}.sync.sync i{background:#ffd166;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
nav.tabs{max-width:1180px;margin:0 auto;padding:10px 10px 0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;color:rgba(255,255,255,.7);padding:10px 12px 12px;cursor:pointer;font-weight:600;white-space:nowrap;border-bottom:3px solid transparent;font-size:14.5px}
nav.tabs button.on{color:#fff;border-bottom-color:var(--accent)}
@media (max-width:640px){.who .who-txt{display:none}.sync .sync-txt{display:none}.brand{font-size:19px}}

main{max-width:1180px;margin:0 auto;padding:20px 18px 110px}
h2.view{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-.02em;margin:4px 0 4px}
p.lead{color:var(--mute);margin:0 0 18px;max-width:62ch}
h3.sec{font-family:var(--display);font-weight:700;font-size:18px;margin:26px 0 10px;display:flex;align-items:baseline;gap:8px}
h3.sec .count{font-family:var(--body);font-size:13px;color:var(--mute);font-weight:500}

/* ---------- Componentes ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:var(--r);padding:12px 18px;background:var(--brand);color:var(--brand-on);font-weight:700;cursor:pointer;font-size:15px;transition:background-color .35s ease}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.danger{background:transparent;color:var(--chili);border:1.5px solid #eec3be}
.btn.dark{background:var(--ink)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--jade-soft);color:var(--jade)}
.pill.warn{background:var(--yuzu-soft);color:var(--yuzu)}
.pill.bad{background:var(--chili-soft);color:var(--chili)}
.pill.mute{background:#ECEFEC;color:var(--mute)}
.pill.info{background:var(--sky-soft);color:var(--sky)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:#c4cbc6}
.dot.ok{background:var(--jade)}.dot.warn{background:var(--yuzu)}.dot.bad{background:var(--chili)}
.empty{color:var(--mute);padding:18px;text-align:center;border:1.5px dashed var(--line);border-radius:var(--r-lg);background:rgba(255,255,255,.5)}
.banner{background:var(--yuzu-soft);color:#6d4d05;border-radius:var(--r);padding:10px 14px;font-size:13.5px;margin-bottom:16px}

.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin:0 0 18px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span{font-size:13px;font-weight:600;color:var(--mute)}
.fld.req>span::after{content:" *";color:var(--chili)}
input[type=text],input[type=date],input[type=search],input[type=number],select,textarea{width:100%;border:1.5px solid var(--line);border-radius:var(--r);padding:10px 12px;background:#fff;min-height:44px}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--sky);outline:none}
.fld.sm select,.fld.sm input{min-height:38px;padding:7px 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:560px){.grid2,.grid3{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:12px}
.hint{font-size:12.5px;color:var(--mute)}
.err-msg{color:var(--chili);font-size:13px;font-weight:600}
.checks{display:flex;gap:8px;flex-wrap:wrap}
.checks label{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px;background:#fff}
.checks input{accent-color:var(--brand)}
.seg{display:inline-flex;background:#E4E8E3;border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:8px 14px;border-radius:9px;font-weight:600;cursor:pointer;color:var(--mute)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(30,43,51,.12)}

/* ---------- Visão geral ---------- */
.hero{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:14px}
@media (max-width:820px){.hero{grid-template-columns:1fr}}
.gauge{background:var(--ink);color:#fff;border-radius:22px;padding:18px 18px 16px;display:flex;flex-direction:column;align-items:center;text-align:center}
.gauge svg{width:100%;max-width:280px;height:auto;display:block}
.gauge .pct{font-family:var(--display);font-weight:800;font-size:64px;line-height:.9;letter-spacing:-.04em;margin-top:-54px}
.gauge .pct sup{font-size:26px;vertical-align:top;margin-left:2px}
.gauge .g-lbl{font-weight:600;margin-top:8px}
.gauge .g-sub{font-size:12.5px;opacity:.7;margin-top:2px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:560px){.tiles{grid-template-columns:1fr 1fr}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between;min-height:104px;cursor:default}
.tile[data-act]{cursor:pointer}
.tile b{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;letter-spacing:-.03em}
.tile span{font-size:13.5px;color:var(--mute);font-weight:500}
.tile.bad b{color:var(--chili)}.tile.warn b{color:var(--yuzu)}
.quick{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.quick .btn{flex:1;min-width:180px;padding:14px}

.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row-main{flex:1;min-width:0}
.row-main b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.row-main small,.row-num small{display:block;color:var(--mute);font-size:12.5px}
.row-num{text-align:right;white-space:nowrap}
.row-num b{font-weight:700}
.row .btn.sm{flex:none}
details.more>summary{cursor:pointer;font-weight:600;color:var(--sky);padding:8px 0;list-style:none}
details.more>summary::-webkit-details-marker{display:none}

/* ---------- Produção / Observações ---------- */
.fila{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.sol{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--chili);border-radius:var(--r-lg);padding:14px;display:flex;flex-direction:column;gap:8px}
.sol.prog{border-left-color:var(--sky)}
.sol .t{font-weight:700;font-size:16px}
.sol .m{font-size:13px;color:var(--mute)}
.sol .q{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.02em}
.rec{display:flex;gap:12px;padding:12px 14px;border-top:1px solid var(--line);align-items:flex-start}
.rec:first-child{border-top:0}
.rec .qty{font-family:var(--display);font-weight:800;font-size:22px;white-space:nowrap;min-width:92px;text-align:right}
.rec .obs{font-size:13.5px;margin-top:4px}
.rec a{color:var(--sky)}
.obs-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;display:flex;flex-direction:column;gap:6px}
.obs-card.crit{border-color:#e9b3ad}
.obs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--mute)}

/* ---------- Contagem ---------- */
.ct-head{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:12px}
.ct-row{display:grid;grid-template-columns:1fr 150px 108px;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.ct-row:first-child{border-top:0}
.ct-row.filled{background:#FAFCFA}
.ct-row .nm b{display:block;font-weight:600}
.ct-row .nm small{color:var(--mute);font-size:12.5px;display:block}
.ct-in{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:var(--r);background:#fff;overflow:hidden}
.ct-in:focus-within{border-color:var(--sky)}
.ct-in input{border:0;min-height:44px;text-align:right;font-weight:700;font-size:17px;padding:8px 6px 8px 10px;font-variant-numeric:tabular-nums}
.ct-in input:focus{outline:none}
.ct-in em{font-style:normal;color:var(--mute);padding:0 10px 0 2px;font-size:13px;white-space:nowrap}
.ct-st{text-align:right}
.ct-obs{grid-column:1/-1}
.ct-obs input{min-height:38px}
.ct-row.need-obs .ct-obs input{border-color:var(--chili)}
@media (max-width:560px){.ct-row{grid-template-columns:1fr 120px}.ct-st{grid-column:1/-1;text-align:left;margin-top:-4px}}
.savebar{position:fixed;left:0;right:0;bottom:0;background:rgba(243,245,241,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom));z-index:15}
.savebar .in{max-width:1180px;margin:0 auto;display:flex;gap:12px;align-items:center;justify-content:space-between}

/* ---------- Relatórios / Cadastros ---------- */
table.tb{width:100%;border-collapse:collapse;font-size:14px}
.tb-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg)}
table.tb th{text-align:left;font-size:12.5px;color:var(--mute);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.tb td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.tb tr:last-child td{border-bottom:0}
table.tb td.r,table.tb th.r{text-align:right}
table.tb tr.click{cursor:pointer}
table.tb tr.click:hover td{background:#F7F9F6}
.bar{height:8px;background:#E8ECE8;border-radius:99px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 7px;background:var(--chip);color:var(--ink-2)}

/* ---------- Login ---------- */
.login{min-height:100vh;background:var(--ink);color:#fff;display:flex;flex-direction:column;align-items:center;padding:48px 18px 40px}
.login h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,7vw,56px);letter-spacing:-.035em;line-height:.95;margin:0;text-align:center}
.login .sub{opacity:.72;margin:12px 0 30px;text-align:center}
.login .unis{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:34px}
.login .unis span{border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:5px 12px;font-size:13px}
.login .grp{width:100%;max-width:560px;margin-bottom:22px}
.login .grp h4{margin:0 0 10px;font-weight:600;font-size:14px;opacity:.75}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.names button{background:var(--ink-2);border:1px solid rgba(255,255,255,.12);color:#fff;border-radius:14px;padding:14px;text-align:left;cursor:pointer;font-weight:600;font-size:15.5px}
.names button:hover{background:#34495a}
.names button small{display:block;font-weight:400;opacity:.65;font-size:12px;margin-top:2px}

/* ---------- Modal / Toast ---------- */
.modal{position:fixed;inset:0;background:rgba(20,30,36,.55);display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal.open{display:flex}
.sheet{background:var(--paper);width:100%;max-width:640px;max-height:94vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:up .22s ease-out}
@media (min-width:700px){.modal{align-items:center}.sheet{border-radius:20px}}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.sheet header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.sheet header h3{margin:0;font-family:var(--display);font-size:20px}
.sheet header button{background:none;border:0;font-size:26px;line-height:1;cursor:pointer;color:var(--mute);padding:4px 8px}
.sheet .body{padding:16px 18px calc(20px + env(safe-area-inset-bottom));overflow-y:auto}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-weight:600;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:90vw;text-align:center}
.toast.bad{background:var(--chili)}
</style>
</head>
<body data-tema="QF"></body>

<div id="login" class="login hidden"></div>

<div id="app" class="hidden">
  <header class="top">
    <div class="top-in">
      <a class="menu-link" href="#" data-act="menu" aria-label="Voltar ao menu">&#8592; Menu</a>
      <div class="brand-row">
        <img class="brand-logo" id="brandLogo" src="https://rodsilveira-rs.github.io/qfood-dashboard/assets/qfood-logo.png" alt="Q Food Company" onerror="this.style.visibility='hidden'">
        <div class="brand">Controle de Produção<small id="brandSub">Mercearia Liberdade, Gogui e Cozinha de Produção</small></div>
      </div>
      <div class="spacer"></div>
      <span class="sync" id="sync"><i></i><span class="sync-txt">Somente neste aparelho</span></span>
      <div class="who"><div class="who-txt"><b id="whoName"></b><span id="whoRole"></span></div><button type="button" data-act="logout">Trocar</button></div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <main id="main"></main>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="sheet">
    <header><h3 id="mTitle"></h3><button type="button" data-act="close" aria-label="Fechar">×</button></header>
    <div class="body" id="mBody"></div>
  </div>
</div>

<script>
'use strict';
/* =========================================================
   CONFIGURAÇÃO
   GAS_URL: cole aqui a URL /exec da implantação do Code_Producao.gs.
   Vazio = modo local (dados só neste aparelho, útil para teste).
   ========================================================= */
const CFG = {
  GAS_URL: 'https://script.google.com/macros/s/AKfycbwBc-EXOlX-SpXNGfYc0g0JekacWor2ty7BHzQ3LJEzYTh6Pg7PALbe26TgjzJZ_-eY/exec',
  SESSION_KEY: 'cprod_session',
  CACHE_KEY: 'cprod_cache_v1',
  OUTBOX_KEY: 'cprod_outbox_v1',
  SESSION_HOURS: 12,
  OBS_OBRIGATORIA_REPOR: true,   // exige observação quando a contagem der "Repor"
  DIAS_SEM_CONTAGEM: 2,          // a partir de quantos dias o item entra em "sem contagem recente"
  REFRESH_MS: 120000,
  MENU_URL: 'https://rodsilveira-rs.github.io/qfood-dashboard/Index_Menu.html',
  // Logins do Index_Menu que entram só como equipe de produção (sem Relatórios e Cadastros)
  EMAILS_OPERADOR: ['producao@mercearialiberdade.com.br'],
  LIB_XLSX: 'https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js',
  LIB_JSPDF: 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
  LIB_AUTOTABLE: 'https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js'
};

const UN = {
  ML: { nome: 'Mercearia Liberdade', curto: 'Mercearia' },
  GG: { nome: 'Gogui Korean', curto: 'Gogui' },
  CP: { nome: 'Cozinha de Produção', curto: 'Cozinha' }
};
const UN_IDS = ['ML', 'GG', 'CP'];
/* Tema visual por empresa. "Todas" e Cozinha de Produção usam a identidade Q Food. */
const ASSETS_URL = 'https://rodsilveira-rs.github.io/qfood-dashboard/assets/';
const TEMAS = {
  QF: { logo: 'qfood-logo.png', alt: 'Q Food Company', cor: '#141416', sub: 'Mercearia Liberdade, Gogui e Cozinha de Produção' },
  ML: { logo: 'Logo_Mercearia_Liberdade.png', alt: 'Mercearia Liberdade', cor: '#3A0C10', sub: 'Mercearia Liberdade' },
  GG: { logo: 'gogui-logo.jpg', alt: 'Gogui Korean BBQ', cor: '#110F0C', sub: 'Gogui Korean' }
};
const temaDaUnidade = u => (u === 'ML' || u === 'GG') ? u : 'QF';
function aplicarTema(u) {
  const id = temaDaUnidade(u);

  if (document.body.dataset.tema !== id) document.body.dataset.tema = id;
  $$('.brand-logo').forEach(img => {
    const src = ASSETS_URL + t.logo;
    if (img.getAttribute('src') !== src) { img.style.visibility = ''; img.src = src; img.alt = t.alt; }
  });
  const sub = $('#brandSub');
  if (sub) sub.textContent = u === 'CP' ? 'Cozinha de Produção' : t.sub;
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', t.cor);
}

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = p => p + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => isoDate(new Date());
const nowISO = () => { const d = new Date(); return `${isoDate(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };
const fmtD = s => { if (!s) return '—'; const p = String(s).slice(0, 10).split('-'); return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : String(s); };
const fmtDH = s => s ? `${fmtD(s)} ${String(s).slice(11, 16)}`.trim() : '—';
const num = v => {
  if (v === '' || v === null || v === undefined) return NaN;
  if (typeof v === 'number') return v;
  let s = String(v).trim();
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  return s === '' ? NaN : Number(s);
};
const fmtN = v => { const n = num(v); return isNaN(n) ? '—' : n.toLocaleString('pt-BR', { maximumFractionDigits: 3 }); };
const addDays = (iso, n) => { const [y, m, d] = iso.split('-').map(Number); return isoDate(new Date(y, m - 1, d + n)); };
const daysBetween = (a, b) => Math.round((new Date(String(b).slice(0, 10) + 'T00:00') - new Date(String(a).slice(0, 10) + 'T00:00')) / 864e5);
const byNome = (a, b) => String(a.nome).localeCompare(String(b.nome), 'pt-BR');
const split = s => String(s || '').split(',').map(x => x.trim()).filter(Boolean);
const opts = (arr, sel) => arr.map(o => { const v = typeof o === 'object' ? o.v : o; const t = typeof o === 'object' ? o.t : o; return `<option value="${esc(v)}" ${String(v) === String(sel) ? 'selected' : ''}>${esc(t)}</option>`; }).join('');

function toast(msg, bad) {
  const t = document.createElement('div');
  t.className = 'toast' + (bad ? ' bad' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), bad ? 4200 : 2600);
}

let FOTO_BUSY = false, flushing = false;

function persist() {
  try {
    localStorage.setItem(CFG.CACHE_KEY, JSON.stringify(DB));
    localStorage.setItem(CFG.OUTBOX_KEY, JSON.stringify(OUTBOX));
  } catch (e) { console.warn('Falha ao salvar localmente', e); }
}
function restore() {
  try {
    const c = JSON.parse(localStorage.getItem(CFG.CACHE_KEY) || 'null');
    if (c) TABS.forEach(t => { DB[t] = Array.isArray(c[t]) ? c[t] : []; });
    OUTBOX = JSON.parse(localStorage.getItem(CFG.OUTBOX_KEY) || '[]');
  } catch (e) { OUTBOX = []; }
  if (!CFG.GAS_URL) {
    if (!DB.produtos.length) DB.produtos = SEED_PRODUTOS.map(p => ({ ...p }));
    if (!DB.pessoas.length) DB.pessoas = SEED_PESSOAS.map(p => ({ ...p }));
    persist();
  }
}
function upsertLocal(tab, row) {
  const arr = DB[tab];
  const i = arr.findIndex(r => r.id === row.id);
  if (i >= 0) arr[i] = { ...arr[i], ...row }; else arr.push({ ...row });
  return i >= 0 ? arr[i] : arr[arr.length - 1];
}
function save(tab, row, silent) {
  row.atualizado_em = nowISO();
  const merged = upsertLocal(tab, row);
  OUTBOX.push({ tab, row: { ...merged } });
  persist();
  if (!silent) render();
  flush();
  return merged;
}
function setSync(state, msg) { SYNC = { state, msg }; updSync(); }
function updSync() {
  const el = $('#sync'); if (!el) return;
  if (!CFG.GAS_URL) { el.className = 'sync'; $('.sync-txt', el).textContent = 'Somente neste aparelho'; return; }
  el.className = 'sync ' + SYNC.state;
  $('.sync-txt', el).textContent = SYNC.msg + (OUTBOX.length && SYNC.state !== 'sync' ? ` (${OUTBOX.length} pendente${OUTBOX.length > 1 ? 's' : ''})` : '');
}
async function api(body) {
  const res = await fetch(CFG.GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  return res.json();
}
async function flush() {
  if (!CFG.GAS_URL || flushing || !OUTBOX.length) { updSync(); return; }
  flushing = true;
  setSync('sync', 'Enviando…');
  const batch = OUTBOX.slice(0, 40);
  let ok = false;
  try {
    const r = await api({ action: 'upsert', items: batch });
    if (!r || !r.ok) throw new Error((r && r.error) || 'Falha no envio');
    OUTBOX.splice(0, batch.length);
    persist();
    ok = true;
    setSync('ok', 'Sincronizado ' + nowISO().slice(11, 16));
  } catch (e) {
    console.warn(e);
    setSync('err', 'Sem conexão');
  } finally { flushing = false; }
  if (ok && OUTBOX.length) flush();
}
const isTyping = () => { const a = document.activeElement; return a && ['INPUT', 'TEXTAREA', 'SELECT'].includes(a.tagName); };
async function load() {
  if (!CFG.GAS_URL) return;
  setSync('sync', 'Atualizando…');
  try {
    const res = await fetch(CFG.GAS_URL + '?action=load&t=' + Date.now());
    const j = await res.json();
    if (!j.ok) throw new Error(j.error || 'Falha na leitura');
    TABS.forEach(t => { DB[t] = Array.isArray(j.data[t]) ? j.data[t] : []; });
    OUTBOX.forEach(({ tab, row }) => upsertLocal(tab, row));
    persist();
    setSync('ok', 'Sincronizado ' + nowISO().slice(11, 16));
    if (!$('#modal').classList.contains('open') && !isTyping()) render();
    flush();
  } catch (e) {
    console.warn(e);
    setSync('err', 'Sem conexão, usando dados deste aparelho');
  }
}

const minOf = (p, u) => num(p['min_' + u]);
const margemOf = p => { const m = num(p.margem); return isNaN(m) ? 20 : m; };

function situacao(p, u, qtd) {
  const q = num(qtd);
  if (isNaN(q)) return null;
  const min = minOf(p, u);
  if (isNaN(min)) return 'semmin';
  if (q < min) return 'repor';
  if (q <= min * (1 + margemOf(p) / 100)) return 'atencao';
  return 'ok';
}
function ultimasContagens() {
  const m = {};
  DB.contagens.forEach(c => {
    if (c.status === 'cancelado') return;
    const k = c.unidade + '|' + c.produto_id;
    if (!m[k] || String(c.data_hora) > String(m[k].data_hora)) m[k] = c;
  });
  return m;
}
function estoqueAtual(units) {
  const last = ultimasContagens();
  const out = [];
  units.forEach(u => prodsDaUnidade(u).forEach(p => {
    const c = last[u + '|' + p.id];
    out.push({ p, u, c, sit: c ? situacao(p, u, c.qtd) : null, dias: c ? daysBetween(c.data_hora, today()) : null });
  }));
  return out;
}
const solAbertas = () => DB.solicitacoes.filter(s => s.status === 'Aberta' || s.status === 'Em produção');
const solAbertaDe = (u, pid) => solAbertas().find(s => s.unidade === u && s.produto_id === pid);
const solNum = s => s.numero || ('SP-' + String(s.id).slice(-5).toUpperCase());

function periodo() {
  const t = today();
  if (F.per === 'hoje') return [t, t];
  if (F.per === 'semana') return [addDays(t, -6), t];
  if (F.per === 'mes') return [t.slice(0, 8) + '01', t];
  const a = F.de || t, b = F.ate || t;
  return a <= b ? [a, b] : [b, a];
}
const inPer = (d, per) => { const x = String(d || '').slice(0, 10); return x >= per[0] && x <= per[1]; };
const unOk = u => F.un === 'todas' || F.un === u;
const podeEditar = r => isManager() || (r.criado_por === USER.nome && String(r.criado_em || '').slice(0, 10) === today());

function sugestao(p, u, saldo) {
  const min = minOf(p, u), s = num(saldo);
  if (isNaN(min)) return '';
  return Math.max(+(min - (isNaN(s) ? 0 : s)).toFixed(3), 0);
}
function criarSolicitacao(p, u, saldo, extra = {}) {
  if (solAbertaDe(u, p.id)) return null;
  const min = minOf(p, u);
  const d = new Date();
  const row = {
    id: uid('sp'),
    numero: `SP-${String(d.getFullYear()).slice(2)}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${Math.random().toString(36).slice(2, 5).toUpperCase()}`,
    data_hora: nowISO(), unidade: u, produto_id: p.id, produto_nome: p.nome,
    saldo: isNaN(num(saldo)) ? '' : num(saldo), minimo: isNaN(min) ? '' : min,
    qtd_sugerida: extra.qtd !== undefined ? extra.qtd : sugestao(p, u, saldo),
    medida: p.medida, prioridade: extra.prioridade || 'Normal', status: 'Aberta',
    solicitante: USER.nome, obs: extra.obs || '', producao_id: '', atendida_em: '', criado_em: nowISO()
  };
  return save('solicitacoes', row, extra.silent);
}

function gaugeSVG(pct) {
  const p = pct === null ? 0 : Math.max(0, Math.min(100, pct));
  const cor = pct === null ? '#5b6a73' : p < 60 ? '#ff7a6b' : p < 85 ? '#f2b632' : '#5fd3a9';
  const r = 100, cx = 120, cy = 120;
  const ang = Math.PI * (1 - p / 100);
  const x = cx + r * Math.cos(ang), y = cy - r * Math.sin(ang);
  const arc = p > 0 ? `<path d="M20 120 A100 100 0 0 1 ${x.toFixed(2)} ${y.toFixed(2)}" fill="none" stroke="${cor}" stroke-width="22" stroke-linecap="round"/>` : '';
  const ticks = [0, 25, 50, 75, 100].map(t => {
    const a = Math.PI * (1 - t / 100);
    return `<line x1="${cx + 118 * Math.cos(a)}" y1="${cy - 118 * Math.sin(a)}" x2="${cx + 126 * Math.cos(a)}" y2="${cy - 126 * Math.sin(a)}" stroke="rgba(255,255,255,.35)" stroke-width="2"/>`;
  }).join('');
  const needle = `<line x1="${cx}" y1="${cy}" x2="${(cx + 74 * Math.cos(ang)).toFixed(2)}" y2="${(cy - 74 * Math.sin(ang)).toFixed(2)}" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".55"/><circle cx="${cx}" cy="${cy}" r="6" fill="#fff" opacity=".55"/>`;
  return `<svg viewBox="0 0 240 132" aria-hidden="true"><path d="M20 120 A100 100 0 0 1 220 120" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="22" stroke-linecap="round"/>${arc}${ticks}${pct === null ? '' : needle}</svg>`;
}
function linhaEstoque(e) {
  const min = minOf(e.p, e.u);
  const sol = solAbertaDe(e.u, e.p.id);
  return `<div class="row">
    <span class="dot ${SIT[e.sit].c}"></span>
    <div class="row-main"><b>${esc(e.p.nome)}</b><small>${UN[e.u].curto}, contado em ${fmtDH(e.c.data_hora)}</small></div>
    <div class="row-num num"><b>${fmtN(e.c.qtd)} ${esc(e.p.medida)}</b><small>mínimo ${fmtN(min)}</small></div>
    ${sol ? `<span class="pill info">${esc(sol.status)}</span>` : `<button type="button" class="btn sm" data-act="solicitar" data-u="${e.u}" data-p="${esc(e.p.id)}">Solicitar</button>`}
  </div>`;
}
function vGeral() {
  const per = periodo();
  const us = myUnits().filter(unOk);
  const est = estoqueAtual(us);
  const prods = DB.producoes.filter(r => r.status !== 'cancelado' && us.includes(r.unidade) && inPer(r.data, per));
  const repor = est.filter(e => e.sit === 'repor');
  const aten = est.filter(e => e.sit === 'atencao');
  const semCont = est.filter(e => !e.c || e.dias >= CFG.DIAS_SEM_CONTAGEM);
  const semMin = est.filter(e => isNaN(minOf(e.p, e.u)));
  const contPer = DB.contagens.filter(c => c.status !== 'cancelado' && us.includes(c.unidade) && inPer(c.data_hora, per));
  const avaliados = est.filter(e => e.sit === 'ok' || e.sit === 'atencao' || e.sit === 'repor');

  </div>`;

function abrirProducao(r, solId) {
  const sol = solId ? DB.solicitacoes.find(s => s.id === solId) : null;
  openModal(r ? 'Editar produção' : 'Registrar produção', formProducao(r, sol), root => {
    const fm = $('#fProd', root), f = fm.elements;
    const selU = f.unidade, selP = f.produto_id, selM = f.medida, inV = f.validade, fData = f.data;
    let valTocada = !!(r && r.validade);
    inV.addEventListener('input', () => { valTocada = true; });
    const fillProds = keep => {
      const u = selU.value;
      let list = prodsDaUnidade(u);
      const cur = keep || selP.value;
      if (cur && !list.some(p => p.id === cur) && prodById(cur)) list = list.concat([prodById(cur)]);
      selP.innerHTML = `<option value="">${list.length ? 'Escolha o produto' : 'Nenhum produto cadastrado para esta unidade'}</option>` +
        list.map(p => `<option value="${esc(p.id)}" ${p.id === cur ? 'selected' : ''}>${esc(p.nome)}</option>`).join('');
    };
    const onProd = first => {
      const p = prodById(selP.value);
      if (!p) return;
      if (!(first && r)) selM.value = p.medida || 'un';
      $('#fldVal', root).classList.toggle('req', usaValidade(p));
      const dias = num(p.dias_validade);
      if (!valTocada && !isNaN(dias)) inV.value = addDays(fData.value || today(), dias);
    };
    fillProds(r ? r.produto_id : sol ? sol.produto_id : '');
    onProd(true);
    selU.addEventListener('change', () => { fillProds(); onProd(); });
    selP.addEventListener('change', () => onProd());
    fData.addEventListener('change', () => { if (!valTocada) onProd(); });
    bindFoto(root);
    const cancelBtn = $('[data-act="cancel-prod"]', root);
    if (cancelBtn) cancelBtn.addEventListener('click', () => {
      if (!confirm('Excluir este registro de produção?')) return;
      save('producoes', { id: r.id, status: 'cancelado' });
      closeModal(); toast('Registro excluído');
    });
    fm.addEventListener('submit', ev => {
      ev.preventDefault();
      const err = $('#fErr', root);
      if (FOTO_BUSY) { err.textContent = 'Aguarde o envio da foto terminar.'; return; }
      const p = prodById(selP.value);
      const q = num(f.qtd.value);
      if (!f.data.value) { err.textContent = 'Informe a data.'; return; }
      if (!p) { err.textContent = 'Escolha o produto.'; return; }
      if (isNaN(q) || q <= 0) { err.textContent = 'Informe a quantidade produzida.'; return; }
      if (usaValidade(p) && !f.validade.value) { err.textContent = 'Este produto exige validade.'; return; }
      localStorage.setItem('cprod_last_local', f.local.value);
      let solVinc = f.solicitacao_id.value;
      if (!r && !solVinc) {
        const aberta = solAbertaDe(selU.value, p.id);
        if (aberta && confirm(`Existe o pedido ${solNum(aberta)} aberto para ${p.nome}. Marcar como atendido com esta produção?`)) solVinc = aberta.id;
      }
      const row = {
        id: r ? r.id : uid('pr'), data: f.data.value, unidade: selU.value, local: f.local.value,
        produto_id: p.id, produto_nome: p.nome, qtd: q, medida: selM.value, lote: f.lote.value.trim(),
        validade: f.validade.value, responsavel: f.responsavel.value, ficha_usada: f.ficha_usada.value,
        obs: f.obs.value.trim(), evidencia: f.evidencia.value, solicitacao_id: solVinc, status: 'ativo'
      };
      if (!r) { row.criado_por = USER.nome; row.criado_em = nowISO(); }
      save('producoes', row, true);
      if (solVinc && !r) {
        save('solicitacoes', { id: solVinc, status: 'Atendida', producao_id: row.id, atendida_em: nowISO() }, true);
      }
      closeModal();
      render();
      toast(r ? 'Produção atualizada' : 'Produção salva');
    });
  });
}

function atualizaLinhaContagem(row) {

  $('.ct-st', row).innerHTML = sit ? `<span class="pill ${SIT[sit].c}">${SIT[sit].t}${need ? ` ${fmtN(sugestao(p, u, d.qtd))} ${esc(p.medida)}` : ''}</span>` : '';

function salvarContagem() {
  const u = CONT_UN, dr = draftOf(u);
  const itens = Object.entries(dr).filter(([, d]) => d.qtd !== '' && d.qtd !== undefined);
  let erro = null;
  $$('.ct-row').forEach(r => r.classList.remove('need-obs'));
  for (const [pid, d] of itens) {
    const p = prodById(pid);
    const q = num(d.qtd);
    const row = $(`.ct-row[data-pid="${CSS.escape(pid)}"]`);
    if (!p) continue;
    if (isNaN(q) || q < 0) { erro = `Quantidade inválida em ${p.nome}.`; if (row) row.classList.add('need-obs'); break; }
    if (CFG.OBS_OBRIGATORIA_REPOR && situacao(p, u, q) === 'repor' && !String(d.obs || '').trim()) {
      erro = `Escreva uma observação para ${p.nome}, que está abaixo do mínimo.`;
      if (row) { row.classList.add('need-obs'); $('.ct-obs', row).classList.remove('hidden'); }
      break;
    }
  }
  if (erro) { toast(erro, true); return; }
  const agora = nowISO();
  const repor = [];
  itens.forEach(([pid, d]) => {
    const p = prodById(pid); if (!p) return;
    const q = num(d.qtd);
    const sit = situacao(p, u, q);
    const min = minOf(p, u);
    save('contagens', {
      id: uid('ct'), data_hora: agora, unidade: u, produto_id: p.id, produto_nome: p.nome, qtd: q, medida: p.medida,
      minimo: isNaN(min) ? '' : min, situacao: sit ? SIT[sit].t : '', responsavel: USER.nome, obs: String(d.obs || '').trim(),
      status: 'ativo', criado_por: USER.nome, criado_em: agora
    }, true);
    if (sit === 'repor' && !solAbertaDe(u, p.id)) repor.push({ p, q });
  });
  CONT_DRAFT[u] = {};
  render();
  if (!repor.length) { toast(`Contagem salva: ${itens.length} ${itens.length === 1 ? 'item' : 'itens'}`); return; }
  openModal('Contagem salva', `
    <p>${itens.length} ${itens.length === 1 ? 'item salvo' : 'itens salvos'} em ${UN[u].nome}. Estes estão abaixo do mínimo e ainda não têm pedido de produção:</p>
    <div class="list" style="margin:12px 0">${repor.map(x => `<div class="row"><span class="dot bad"></span><div class="row-main"><b>${esc(x.p.nome)}</b><small>disponível ${fmtN(x.q)} ${esc(x.p.medida)}, mínimo ${fmtN(minOf(x.p, u))}</small></div><div class="row-num"><b class="num">${fmtN(sugestao(x.p, u, x.q))} ${esc(x.p.medida)}</b><small>a produzir</small></div></div>`).join('')}</div>
    <div class="actions"><button type="button" class="btn" style="flex:1" id="btnCriarSols">Criar ${repor.length} ${repor.length === 1 ? 'pedido' : 'pedidos'} de produção</button><button type="button" class="btn ghost" data-act="close">Agora não</button></div>
  `, root => {
    $('#btnCriarSols', root).addEventListener('click', () => {
      repor.forEach(x => criarSolicitacao(x.p, u, x.q, { silent: true }));
      closeModal(); render();
      toast(`${repor.length} ${repor.length === 1 ? 'pedido criado' : 'pedidos criados'}`);
    });
  });
}

function dadosRelatorio() {
  const per = periodo();
  const us = myUnits().filter(unOk);
  const prods = DB.producoes.filter(r => r.status !== 'cancelado' && us.includes(r.unidade) && inPer(r.data, per))
    .sort((a, b) => String(a.data + a.criado_em).localeCompare(String(b.data + b.criado_em)));
  const conts = DB.contagens.filter(c => c.status !== 'cancelado' && us.includes(c.unidade) && inPer(c.data_hora, per))
    .sort((a, b) => String(a.data_hora).localeCompare(String(b.data_hora)));
  const sols = DB.solicitacoes.filter(s => us.includes(s.unidade) && inPer(s.data_hora, per) && s.status !== 'Cancelada')
    .sort((a, b) => String(a.data_hora).localeCompare(String(b.data_hora)));
  const obs = DB.observacoes.filter(o => o.status !== 'cancelado' && us.includes(o.unidade) && inPer(o.data_hora, per))
    .sort((a, b) => String(a.data_hora).localeCompare(String(b.data_hora)));
  const atend = sols.filter(s => s.status === 'Atendida');
  const tempos = atend.map(s => (new Date(String(s.atendida_em).replace(' ', 'T')) - new Date(String(s.data_hora).replace(' ', 'T'))) / 36e5).filter(h => !isNaN(h) && h >= 0);
  const tMed = tempos.length ? tempos.reduce((a, b) => a + b, 0) / tempos.length : null;

  const porProd = {};
  prods.forEach(r => {
    const k = r.produto_nome + '|' + r.medida;
    porProd[k] = porProd[k] || { nome: r.produto_nome, medida: r.medida, total: 0, n: 0, unidades: new Set() };
    porProd[k].total += num(r.qtd) || 0; porProd[k].n++; porProd[k].unidades.add(r.unidade);
  });
  const pp = Object.values(porProd).sort((a, b) => b.n - a.n || b.total - a.total);
  const maxMed = {}; pp.forEach(x => { maxMed[x.medida] = Math.max(maxMed[x.medida] || 0, x.total); });

  const porResp = {};
  prods.forEach(r => {
    const k = r.responsavel || '—';
    porResp[k] = porResp[k] || { nome: k, n: 0, itens: new Set(), dias: new Set() };
    porResp[k].n++; porResp[k].itens.add(r.produto_nome); porResp[k].dias.add(r.data);
  });
  const pr = Object.values(porResp).sort((a, b) => b.n - a.n);

  const porRepo = {};
  sols.forEach(s => {
    const k = s.produto_nome + '|' + s.unidade;
    porRepo[k] = porRepo[k] || { nome: s.produto_nome, u: s.unidade, n: 0, at: 0, abertos: 0 };
    porRepo[k].n++;
    if (s.status === 'Atendida') porRepo[k].at++;
    if (s.status === 'Aberta' || s.status === 'Em produção') porRepo[k].abertos++;
  });
  const rp = Object.values(porRepo).sort((a, b) => b.n - a.n);

  const est = estoqueAtual(us).sort((a, b) => (b.dias === null ? 9999 : b.dias) - (a.dias === null ? 9999 : a.dias));
  const avaliados = est.filter(e => e.sit === 'ok' || e.sit === 'atencao' || e.sit === 'repor');
  const pct = avaliados.length ? Math.round(avaliados.filter(e => e.sit !== 'repor').length / avaliados.length * 100) : null;

  const tipos = {};
  obs.forEach(o => {
    tipos[o.tipo] = tipos[o.tipo] || { Baixo: 0, 'Médio': 0, Alto: 0, 'Crítico': 0, total: 0 };
    tipos[o.tipo][o.impacto] = (tipos[o.tipo][o.impacto] || 0) + 1;
    tipos[o.tipo].total++;
  });
  const tp = Object.entries(tipos).sort((a, b) => b[1].total - a[1].total);

  return { per, us, prods, conts, sols, obs, atend, tMed, pp, maxMed, pr, rp, est, avaliados, pct, tp,
    pctAtend: sols.length ? Math.round(atend.length / sols.length * 100) : null };
}

const LIBS = {};
function carregarScript(src) {
  if (!LIBS[src]) {
    LIBS[src] = new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = src; s.async = true;
      s.onload = () => res();
      s.onerror = () => { delete LIBS[src]; rej(new Error('Não foi possível carregar ' + src)); };
      document.head.appendChild(s);
    });
  }
  return LIBS[src];
}
const numOuVazio = v => { const n = num(v); return isNaN(n) ? '' : n; };
const nomeArquivo = (R, ext) => `Relatorio_Producao_${R.per[0]}_a_${R.per[1]}.${ext}`;
const situacaoTxt = e => e.sit ? SIT[e.sit].t : 'Sem contagem';
const necessidade = e => {
  const min = minOf(e.p, e.u);
  if (isNaN(min) || !e.c) return '';
  return Math.max(+(min - (num(e.c.qtd) || 0)).toFixed(3), 0);
};

/* ---------- Excel ---------- */
function xlSerial(iso) {
  if (!iso) return '';
  const s = String(iso);
  const [y, m, d] = s.slice(0, 10).split('-').map(Number);
  if (!y || !m || !d) return s;
  let v = (Date.UTC(y, m - 1, d) - Date.UTC(1899, 11, 30)) / 864e5;
  if (s.length > 10) {
    const [hh, mi, ss] = s.slice(11).split(':').map(Number);
    v += ((hh || 0) * 3600 + (mi || 0) * 60 + (ss || 0)) / 86400;
  }
  return v;
}
function xlAba(titulo, subtitulo, cols, linhas, totais) {
  const X = window.XLSX;
  const borda = { style: 'thin', color: { rgb: 'DCE1DA' } };
  const bordas = { top: borda, bottom: borda, left: borda, right: borda };
  const ws = {};
  const n = cols.length;
  const put = (r, c, cell) => { ws[X.utils.encode_cell({ r, c })] = cell; };
  put(0, 0, { v: titulo, t: 's', s: { font: { bold: true, sz: 15, color: { rgb: 'FFFFFF' } }, fill: { fgColor: { rgb: '1E2B33' } }, alignment: { vertical: 'center' } } });
  put(1, 0, { v: subtitulo, t: 's', s: { font: { sz: 10, color: { rgb: '66737C' } } } });
  for (let c = 1; c < n; c++) put(0, c, { v: '', t: 's', s: { fill: { fgColor: { rgb: '1E2B33' } } } });
  cols.forEach((col, c) => put(3, c, {
    v: col.h, t: 's',
    s: { font: { bold: true, color: { rgb: 'FFFFFF' } }, fill: { fgColor: { rgb: '1F7A63' } }, border: bordas,
      alignment: { horizontal: col.t === 'n' || col.t === 'i' ? 'right' : 'left', vertical: 'center', wrapText: true } }
  }));
  linhas.forEach((row, i) => {
    const r = 4 + i;
    const zebra = i % 2 ? { fgColor: { rgb: 'F3F5F1' } } : undefined;
    cols.forEach((col, c) => {
      let v = row[c];
      const s = { border: bordas, alignment: { vertical: 'top', wrapText: col.t === 's' && (col.w || 0) >= 30 } };

const PDF_COR = { ink: [30, 43, 51], jade: [31, 122, 99], jadeSoft: [224, 239, 233], chili: [194, 58, 46], yuzu: [185, 129, 7], mute: [102, 115, 124], line: [220, 225, 218], paper: [243, 245, 241] };
function pdfGauge(doc, cx, cy, r, pct) {
  const fundo = [218, 224, 219];
  const cor = pct === null ? PDF_COR.mute : pct < 60 ? PDF_COR.chili : pct < 85 ? PDF_COR.yuzu : PDF_COR.jade;
  const arco = (ini, fim, rgb) => {
    doc.setDrawColor(...rgb); doc.setLineWidth(4.2); doc.setLineCap('round');
    const passos = Math.max(2, Math.round((fim - ini) * 60));
    for (let i = 0; i < passos; i++) {
      const a1 = Math.PI * (1 - (ini + (fim - ini) * i / passos));
      const a2 = Math.PI * (1 - (ini + (fim - ini) * (i + 1) / passos));
      doc.line(cx + r * Math.cos(a1), cy - r * Math.sin(a1), cx + r * Math.cos(a2), cy - r * Math.sin(a2));
    }
  };
  arco(0, 1, fundo);
  if (pct) arco(0, pct / 100, cor);
  doc.setLineCap('butt');
  doc.setTextColor(...PDF_COR.ink);
  doc.setFont('helvetica', 'bold'); doc.setFontSize(24);
  doc.text(pct === null ? '—' : pct + '%', cx, cy - 1, { align: 'center' });
  doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(...PDF_COR.mute);
  doc.text('Itens acima do mínimo', cx, cy + 6, { align: 'center' });
}

async function exportar(tipo) {
  if (!isManager()) { toast('Relatórios disponíveis só para acompanhamento e coordenação.', true); return; }
  try {
    if (tipo === 'xlsx') await exportarExcel(); else await exportarPDF();
  } catch (e) {
    console.error(e);
    toast('Não foi possível gerar o arquivo. Verifique a internet e tente de novo.', true);
  }
}

    const list = DB.produtos.slice().sort((a, b) => (a.ativo === 'Não') - (b.ativo === 'Não') || byNome(a, b));
    body = `<div class="actions" style="margin-bottom:12px"><button type="button" class="btn" data-act="novo-produto">Novo produto</button></div>
    <div class="tb-wrap"><table class="tb"><thead><tr><th>Produto</th><th>Medida</th><th>Unidades</th><th class="r">Mín. Mercearia</th><th class="r">Mín. Gogui</th><th class="r">Mín. Cozinha</th><th class="r">Validade</th><th>Ativo</th></tr></thead><tbody>
    ${list.map(p => `<tr class="click" data-act="edit-prod-cad" data-id="${esc(p.id)}" style="${p.ativo === 'Não' ? 'opacity:.5' : ''}">
      <td><b>${esc(p.nome)}</b>${p.ficha ? '<br><small class="hint">com ficha técnica</small>' : ''}</td><td>${esc(p.medida)}</td>
      <td><div class="chips">${split(p.unidades).map(u => `<span class="chip">${UN[u] ? UN[u].curto : esc(u)}</span>`).join('')}</div></td>
      ${UN_IDS.map(u => `<td class="r num">${split(p.unidades).includes(u) ? fmtN(p['min_' + u]) : ''}</td>`).join('')}
      <td class="r">${p.validade === 'Não' ? 'Não controla' : (p.dias_validade ? p.dias_validade + ' dias' : 'Informar')}</td>
      <td>${p.ativo === 'Não' ? 'Não' : 'Sim'}</td></tr>`).join('')}
    </tbody></table></div>`;
  } else {
    const list = DB.pessoas.slice().sort((a, b) => (a.ativo === 'Não') - (b.ativo === 'Não') || byNome(a, b));
    body = `<div class="actions" style="margin-bottom:12px"><button type="button" class="btn" data-act="nova-pessoa">Nova pessoa</button></div>
    <div class="tb-wrap"><table class="tb"><thead><tr><th>Nome</th><th>Função</th><th>Papel</th><th>Unidades</th><th>Ativo</th></tr></thead><tbody>
    ${list.map(p => `<tr class="click" data-act="edit-pessoa" data-id="${esc(p.id)}" style="${p.ativo === 'Não' ? 'opacity:.5' : ''}">
      <td><b>${esc(p.nome)}</b></td><td>${esc(p.funcao)}</td><td>${esc(PAPEIS[p.papel] || p.papel)}</td>
      <td><div class="chips">${['tecnico', 'gestor', 'admin'].includes(p.papel) ? '<span class="chip">Todas</span>' : split(p.unidades).map(u => `<span class="chip">${UN[u] ? UN[u].curto : esc(u)}</span>`).join('')}</div></td>
      <td>${p.ativo === 'Não' ? 'Não' : 'Sim'}</td></tr>`).join('')}
    </tbody></table></div>`;
  }
  return `<h2 class="view">Cadastros</h2>
  <p class="lead">Produtos, mínimos por unidade e pessoas. Alterações valem na hora para toda a equipe.</p>
  <div class="seg" style="margin-bottom:16px">${tabs.map(([k, t]) => `<button type="button" class="${CAD_TAB === k ? 'on' : ''}" data-act="cad-tab" data-t="${k}">${t}</button>`).join('')}</div>
  ${body}`;
}
function unChecks(name, sel) {
  const s = split(sel);
  return `<div class="checks">${UN_IDS.map(u => `<label><input type="checkbox" name="${name}" value="${u}" ${s.includes(u) ? 'checked' : ''}> ${UN[u].nome}</label>`).join('')}</div>`;
}
function abrirProdutoCad(p) {
  const nomeOrig = p ? p.nome : '';
  openModal(p ? 'Editar produto' : 'Novo produto', `<form id="fPc" class="stack" novalidate>
    <label class="fld req"><span>Nome do produto</span><input type="text" name="nome" value="${p ? esc(p.nome) : ''}"></label>
    <div class="grid2">
      <label class="fld req"><span>Unidade de medida</span><select name="medida">${opts(MEDIDAS, p ? p.medida : 'un')}</select></label>
      <label class="fld"><span>Margem de atenção (%)</span><input type="text" inputmode="decimal" name="margem" value="${p ? esc(p.margem ?? '20') : '20'}"><span class="hint">Acima do mínimo até essa margem, o item fica em "Atenção".</span></label>
    </div>
    <div class="fld req"><span>Usado em</span>${unChecks('unidades', p ? p.unidades : (F.un !== 'todas' ? F.un : ''))}</div>
    <div class="grid3" id="mins">${UN_IDS.map(u => `<label class="fld" data-min="${u}"><span>Mínimo ${UN[u].curto}</span><input type="text" inputmode="decimal" name="min_${u}" value="${p ? esc(p['min_' + u] ?? '') : ''}" placeholder="Não definido"></label>`).join('')}</div>
    <div class="grid2">
      <label class="fld"><span>Controla validade?</span><select name="validade">${opts(['Sim', 'Não'], p ? p.validade : 'Sim')}</select></label>
      <label class="fld"><span>Dias de validade</span><input type="text" inputmode="numeric" name="dias_validade" value="${p ? esc(p.dias_validade ?? '') : ''}" placeholder="Ex.: 3"><span class="hint">Preenche a validade sozinho no registro.</span></label>
    </div>
    <label class="fld"><span>Ficha técnica</span><input type="text" name="ficha" value="${p ? esc(p.ficha || '') : ''}" placeholder="Link ou código da ficha, se existir"></label>
    <label class="fld"><span>Ativo</span><select name="ativo">${opts(['Sim', 'Não'], p ? (p.ativo === 'Não' ? 'Não' : 'Sim') : 'Sim')}</select></label>
    <div class="err-msg" id="pcErr"></div>
    <button type="submit" class="btn">${p ? 'Salvar produto' : 'Cadastrar produto'}</button>
  </form>`, root => {
    const fm = $('#fPc', root), f = fm.elements;
    const syncMins = () => {
      const sel = $$('input[name=unidades]:checked', fm).map(i => i.value);
      $$('[data-min]', fm).forEach(el => el.classList.toggle('hidden', !sel.includes(el.dataset.min)));
    };
    syncMins();
    $$('input[name=unidades]', fm).forEach(i => i.addEventListener('change', syncMins));
    fm.addEventListener('submit', ev => {
      ev.preventDefault();
      const err = $('#pcErr', root);
      const nome = f.nome.value.trim();
      const unis = $$('input[name=unidades]:checked', fm).map(i => i.value);
      if (!nome) { err.textContent = 'Informe o nome.'; return; }
      if (DB.produtos.some(x => x.nome.toLowerCase() === nome.toLowerCase() && (!p || x.id !== p.id))) { err.textContent = 'Já existe um produto com esse nome.'; return; }
      if (!unis.length) { err.textContent = 'Marque pelo menos uma unidade.'; return; }
      const row = { id: p ? p.id : uid('p'), nome, medida: f.medida.value, unidades: unis.join(','), margem: isNaN(num(f.margem.value)) ? '20' : String(num(f.margem.value)), validade: f.validade.value, dias_validade: isNaN(num(f.dias_validade.value)) ? '' : String(Math.round(num(f.dias_validade.value))), ficha: f.ficha.value.trim(), ativo: f.ativo.value };
      for (const u of UN_IDS) {
        const v = f['min_' + u].value.trim();
        if (v === '') { row['min_' + u] = ''; continue; }
        const n = num(v);
        if (isNaN(n) || n < 0) { err.textContent = `Mínimo inválido em ${UN[u].curto}.`; return; }
        row['min_' + u] = String(n);
      }
      save('produtos', row, true);
      closeModal(); render();
      toast(p ? (nomeOrig !== nome ? 'Produto renomeado' : 'Produto salvo') : 'Produto cadastrado');
    });
  });
}
function abrirPessoa(p) {
  openModal(p ? 'Editar pessoa' : 'Nova pessoa', `<form id="fPe" class="stack" novalidate>
    <label class="fld req"><span>Nome</span><input type="text" name="nome" value="${p ? esc(p.nome) : ''}"></label>
    <label class="fld"><span>Função</span><input type="text" name="funcao" value="${p ? esc(p.funcao || '') : ''}"></label>
    <label class="fld req"><span>Papel no sistema</span><select name="papel">${opts(Object.entries(PAPEIS).map(([v, t]) => ({ v, t })), p ? p.papel : 'alimentador')}</select>
      <span class="hint">Registro diário: produção, contagem e observações das unidades marcadas. Acompanhamento e Coordenação: todas as unidades, relatórios e cadastro de produtos. Só Coordenação e Administrador editam pessoas.</span></label>
    <div class="fld"><span>Unidades de acesso</span>${unChecks('unidades', p ? p.unidades : 'ML,GG,CP')}</div>
    <label class="fld"><span>Ativo</span><select name="ativo">${opts(['Sim', 'Não'], p ? (p.ativo === 'Não' ? 'Não' : 'Sim') : 'Sim')}</select></label>
    <div class="err-msg" id="peErr"></div>
    <button type="submit" class="btn">${p ? 'Salvar pessoa' : 'Cadastrar pessoa'}</button>
  </form>`, root => {
    const fm = $('#fPe', root), f = fm.elements;
    fm.addEventListener('submit', ev => {
      ev.preventDefault();
      const nome = f.nome.value.trim();
      const unis = $$('input[name=unidades]:checked', fm).map(i => i.value);
      if (!nome) { $('#peErr', root).textContent = 'Informe o nome.'; return; }
      if (p && p.id === USER.id && !['gestor', 'admin'].includes(f.papel.value)) { $('#peErr', root).textContent = 'Você não pode tirar a sua própria permissão de coordenação.'; return; }
      save('pessoas', { id: p ? p.id : uid('u'), nome, funcao: f.funcao.value.trim(), papel: f.papel.value, unidades: unis.join(','), ativo: f.ativo.value }, true);
      closeModal(); render(); toast('Pessoa salva');
    });
  });
}

/* =========================================================
   FOTO (envio para o Drive via Apps Script)
   ========================================================= */
async function compressImg(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const max = 1280, s = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.72);
  } finally { URL.revokeObjectURL(url); }
}
function bindFoto(root) {
  const inp = $('[data-foto]', root);
  if (!inp) return;
  inp.addEventListener('change', async () => {
    const file = inp.files[0];
    if (!file) return;
    const out = $('input[name=evidencia]', root), st = $('.foto-st', root);
    if (!CFG.GAS_URL) { st.textContent = 'A foto fica disponível quando a sincronização estiver ligada.'; return; }
    FOTO_BUSY = true;
    st.textContent = 'Enviando foto…';
    try {
      const data = await compressImg(file);
      const nome = `${today()}_${USER.nome.replace(/[^\w]+/g, '_')}_${Date.now()}.jpg`;
      const r = await api({ action: 'upload', name: nome, mime: 'image/jpeg', data: data.split(',')[1] });
      if (!r || !r.ok) throw new Error((r && r.error) || 'Falha');
      out.value = r.url;
      st.innerHTML = `Foto anexada. <a href="${esc(r.url)}" target="_blank" rel="noopener">Ver</a>`;
    } catch (e) {
      console.warn(e);
      st.textContent = 'Não foi possível enviar a foto. Verifique a internet e escolha a foto de novo.';
      inp.value = '';
    } finally { FOTO_BUSY = false; }
  });
}

/* =========================================================
   VOLTAR AO MENU
   ========================================================= */
function irParaMenu() {
  const pend = Object.values(CONT_DRAFT).some(d => Object.values(d).some(x => x.qtd !== '' && x.qtd !== undefined));
  if (pend && !confirm('Há uma contagem preenchida e não salva. Sair mesmo assim?')) return;
  CONT_DRAFT = {};
  window.location.href = CFG.MENU_URL;
}

/* =========================================================
   MODAL E EVENTOS
   ========================================================= */
function openModal(title, html, mount) {
  $('#mTitle').textContent = title;
  $('#mBody').innerHTML = html;
  $('#modal').classList.add('open');
  document.body.style.overflow = 'hidden';
  if (mount) mount($('#mBody'));
  const first = $('#mBody input:not([type=hidden]):not([readonly]), #mBody select');
  if (first && window.matchMedia('(min-width:700px)').matches) first.focus();
}
function closeModal() {
  $('#modal').classList.remove('open');
  $('#mBody').innerHTML = '';
  document.body.style.overflow = '';
}

const VIEWS = { geral: vGeral, producao: vProducao, contagem: vContagem, observacoes: vObservacoes, relatorios: vRelatorios, cadastros: vCadastros };
const AFTER = {
  producao() {
    const d = $('#prodDia');
    if (d) d.addEventListener('change', () => { PROD_DIA = d.value || today(); render(); });
  },
  contagem() {
    const b = $('#ctBusca');
    if (b) b.addEventListener('input', () => {
      CONT_Q = b.value;
      const pos = b.selectionStart;
      render();
      const nb = $('#ctBusca'); nb.focus(); nb.setSelectionRange(pos, pos);
    });
  }
};

document.addEventListener('click', ev => {
  const lg = ev.target.closest('[data-login]');
  if (lg) { login(lg.dataset.login); return; }
  const nv = ev.target.closest('[data-view]');
  if (nv) { VIEW = nv.dataset.view; render(); window.scrollTo(0, 0); return; }
  if (ev.target === $('#modal')) { closeModal(); return; }
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  switch (a) {
    case 'logout': logout(); break;
    case 'menu': ev.preventDefault(); irParaMenu(); break;
    case 'close': closeModal(); break;
    case 'goto': VIEW = el.dataset.v; render(); window.scrollTo(0, 0); break;
    case 'nova-prod': abrirProducao(null, el.dataset.sol); break;
    case 'edit-prod': abrirProducao(DB.producoes.find(r => r.id === id)); break;
    case 'nova-obs': abrirObs(null); break;
    case 'edit-obs': abrirObs(DB.observacoes.find(r => r.id === id)); break;
    case 'solicitar': abrirSolicitar(el.dataset.u, el.dataset.p); break;
    case 'sol-iniciar': save('solicitacoes', { id, status: 'Em produção' }); toast('Pedido em produção'); break;
    case 'sol-cancelar':
      if (confirm('Cancelar este pedido de produção?')) { save('solicitacoes', { id, status: 'Cancelada' }); toast('Pedido cancelado'); }
      break;
    case 'ct-un': CONT_UN = el.dataset.u; F.un = el.dataset.u; CONT_Q = ''; render(); break;
    case 'ct-limpar': CONT_DRAFT[CONT_UN] = {}; render(); break;
    case 'ct-salvar': salvarContagem(); break;
    case 'exp-xlsx': exportar('xlsx'); break;
    case 'exp-pdf': exportar('pdf'); break;
    case 'cad-tab': CAD_TAB = el.dataset.t; render(); break;
    case 'novo-produto': abrirProdutoCad(null); break;
    case 'edit-prod-cad': abrirProdutoCad(prodById(id)); break;
    case 'nova-pessoa': abrirPessoa(null); break;
    case 'edit-pessoa': abrirPessoa(DB.pessoas.find(p => p.id === id)); break;
  }
});
document.addEventListener('change', ev => {
  const f = ev.target.closest('[data-f]');
  if (!f) return;
  F[f.dataset.f] = f.value;
  if (f.dataset.f === 'un' && UN_IDS.includes(f.value)) CONT_UN = f.value;
  if (f.dataset.f === 'per' && f.value === 'custom') { F.de = F.de || addDays(today(), -6); F.ate = F.ate || today(); }
  render();
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (!t.dataset || !t.dataset.ct) return;
  const row = t.closest('.ct-row');
  const dr = draftOf(CONT_UN);
  const pid = row.dataset.pid;
  dr[pid] = dr[pid] || {};
  dr[pid][t.dataset.ct] = t.value;
  if (t.dataset.ct === 'qtd') atualizaLinhaContagem(row);
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && $('#modal').classList.contains('open')) closeModal();
  if (ev.key === 'Enter' && ev.target.dataset && ev.target.dataset.ct === 'qtd') {
    ev.preventDefault();
    const all = $$('input[data-ct="qtd"]');
    const nx = all[all.indexOf(ev.target) + 1];
    if (nx) nx.focus(); else ev.target.blur();
  }
});
window.addEventListener('beforeunload', ev => {
  const pend = Object.values(CONT_DRAFT).some(d => Object.values(d).some(x => x.qtd !== '' && x.qtd !== undefined));
  if (pend) { ev.preventDefault(); ev.returnValue = ''; }
});
window.addEventListener('online', () => { flush(); load(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });

/* =========================================================
   INÍCIO
   ========================================================= */
(function init() {
  restore();
  const s = getSession();
  if (s) USER = DB.pessoas.find(p => p.id === s.id) || null;
  if (USER) { VIEW = USER.papel === 'alimentador' ? 'producao' : 'geral'; render(); } else renderLogin();
  if (CFG.GAS_URL) {
    load().then(() => {
      if (!USER && s) { USER = DB.pessoas.find(p => p.id === s.id) || null; }
      if (!USER) renderLogin();
    });
    setInterval(() => { if (!document.hidden) load(); }, CFG.REFRESH_MS);
  }
})();
</script>
