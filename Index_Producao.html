  imprimirHTML(relatorioDespHTML(R), `Relatorio_Desperdicio_Aproveitamento_${R.per[0]}_a_${R.per[1]}`);
}
async function exportar(tipo) {
  if (!isManager()) { toast('Relatórios disponíveis só para acompanhamento e coordenação.', true); return; }
  try {
    if (tipo === 'xlsx') await exportarExcel();
    else if (tipo === 'desp') await exportarDespPDF();
    else await exportarPDF();
  } catch (e) {
    console.error(e);
    toast('Não foi possível gerar o arquivo. Verifique a internet e tente de novo.', true);
  }
}

/* =========================================================
   FOTOS: guarda no aparelho e envia quando houver internet
   ========================================================= */
const FOTO_DB = 'cprod_fotos';
let FOTO_FLUSH = false;
function idb() {
  return new Promise((res, rej) => {
    const req = indexedDB.open(FOTO_DB, 1);
    req.onupgradeneeded = () => { if (!req.result.objectStoreNames.contains('fotos')) req.result.createObjectStore('fotos', { keyPath: 'id' }); };
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}
function idbOp(modo, fn) {
  return idb().then(db => new Promise((res, rej) => {
    const tx = db.transaction('fotos', modo);
    const st = tx.objectStore('fotos');
    const r = fn(st);
    tx.oncomplete = () => res(r && r.result !== undefined ? r.result : r);
    tx.onerror = () => rej(tx.error);
  }));
}
const fotoGuardar = f => idbOp('readwrite', st => st.put(f));
const fotoLer = id => idbOp('readonly', st => st.get(id));
const fotoApagar = id => idbOp('readwrite', st => st.delete(id));
const fotoTodas = () => idbOp('readonly', st => st.getAll());

const fotoPendente = v => String(v || '').startsWith('pendente:');
function fotoHTML(v, classe) {
  if (!v) return '';
  if (fotoPendente(v)) return '<span class="pill warn">Foto guardada, aguardando internet</span>';
  return `<a href="${esc(v)}" target="_blank" rel="noopener"${classe ? ` class="${classe}"` : ''}>Ver foto</a>`;
}
const TABS_COM_FOTO = ['producoes', 'observacoes', 'desperdicios', 'fc'];
const fotosNaFila = () => TABS_COM_FOTO.reduce((n, t) => n + DB[t].filter(r => r.status !== 'cancelado' && fotoPendente(r.evidencia)).length, 0);

async function compressImg(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const max = 1280, s = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.72);
  } finally { URL.revokeObjectURL(url); }
}
async function enviarFoto(foto) {
  const r = await api({ action: 'upload', name: foto.nome, mime: 'image/jpeg', data: foto.data.split(',')[1] });
  if (!r || !r.ok) throw new Error((r && r.error) || 'Falha no envio da foto');
  return r.url;
}
function fotoField(r) {
  const v = r ? (r.evidencia || '') : '';
  return `<div class="fld"><span>Foto</span>
    <input type="file" accept="image/*" capture="environment" data-foto>
    <input type="hidden" name="evidencia" value="${esc(v)}">
    <span class="hint foto-st">${v ? fotoHTML(v) : 'A foto fica guardada no aparelho e sobe sozinha quando houver internet.'}</span>
  </div>`;
}
function bindFoto(root) {
  const inp = $('[data-foto]', root);
  if (!inp) return;
  inp.addEventListener('change', async () => {
    const file = inp.files[0];
    if (!file) return;
    const out = $('input[name=evidencia]', root), st = $('.foto-st', root);
    FOTO_BUSY = true;
    st.textContent = 'Preparando a foto…';
    try {
      const data = await compressImg(file);
      const id = uid('ft');
      const nome = `${today()}_${USER.nome.replace(/[^\w]+/g, '_')}_${Date.now()}.jpg`;
      await fotoGuardar({ id, data, nome, criado_em: nowISO() });
      out.value = 'pendente:' + id;
      st.textContent = 'Foto guardada no aparelho.';
      if (CFG.GAS_URL && navigator.onLine) {
        st.textContent = 'Enviando foto…';
        try {
          const url = await enviarFoto({ data, nome });
          await fotoApagar(id);
          out.value = url;
          st.innerHTML = `Foto anexada. <a href="${esc(url)}" target="_blank" rel="noopener">Ver</a>`;
        } catch (e) {
          console.warn(e);
          st.textContent = 'Sem internet agora. A foto fica guardada e sobe sozinha depois.';
        }
      }
    } catch (e) {
      console.warn(e);
      st.textContent = 'Não foi possível ler a foto. Tente tirar de novo.';
      inp.value = '';
    } finally { FOTO_BUSY = false; }
  });
}
async function flushFotos() {
  if (!CFG.GAS_URL || FOTO_FLUSH || !navigator.onLine) return;
  const pendentes = [];
  TABS_COM_FOTO.forEach(t => DB[t].forEach(r => { if (r.status !== 'cancelado' && fotoPendente(r.evidencia)) pendentes.push({ tab: t, row: r }); }));
  if (!pendentes.length) { limparFotosOrfas(); return; }
  FOTO_FLUSH = true;
  let enviadas = 0;
  try {
    for (const { tab, row } of pendentes.slice(0, 5)) {
      const id = String(row.evidencia).slice(9);
      const foto = await fotoLer(id);
      if (!foto) { save(tab, { id: row.id, evidencia: '' }, true); continue; }
      const url = await enviarFoto(foto);
      save(tab, { id: row.id, evidencia: url }, true);
      await fotoApagar(id);
      enviadas++;
    }
  } catch (e) {
    console.warn('Envio de foto adiado', e);
  } finally { FOTO_FLUSH = false; }
  if (enviadas) {
    persist();
    if (!$('#modal').classList.contains('open') && !isTyping()) render();
    if (fotosNaFila()) setTimeout(flushFotos, 2000);
  }
}
async function limparFotosOrfas() {
  try {
    const usadas = new Set();
    TABS_COM_FOTO.forEach(t => DB[t].forEach(r => { if (fotoPendente(r.evidencia)) usadas.add(String(r.evidencia).slice(9)); }));
    const todas = await fotoTodas();
    const limite = Date.now() - 48 * 3600e3;
    for (const f of todas) {
      if (usadas.has(f.id)) continue;
      if (new Date(String(f.criado_em).replace(' ', 'T')).getTime() < limite) await fotoApagar(f.id);
    }
  } catch (e) { /* silencioso */ }
}
function iniciarFotos() {
  flushFotos();
  setInterval(() => { if (!document.hidden) flushFotos(); }, 60000);
  window.addEventListener('online', () => setTimeout(flushFotos, 1500));
}

/* =========================================================
   ATUALIZAÇÃO AUTOMÁTICA
   Consulta o próprio arquivo no GitHub Pages de tempos em tempos.
   Se a assinatura mudou, avisa e recarrega quando for seguro.
   ========================================================= */
let VERSAO_ASSINATURA = null, NOVA_VERSAO = false, ULTIMO_TOQUE = Date.now(), CHECANDO = false;
const hashTexto = t => {
  let h = 5381;
  for (let i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) | 0;
  return String(h);
};
function trabalhoEmAndamento() {
  if ($('#modal').classList.contains('open')) return true;
  if (isTyping()) return true;
  if (OUTBOX.length) return true;
  return Object.values(CONT_DRAFT).some(d => Object.values(d).some(x => x.qtd !== '' && x.qtd !== undefined));
}
function recarregar() {
  const url = location.pathname + '?v=' + Date.now() + location.hash;
  location.replace(url);
}
function avisarNovaVersao() {
  if ($('#avisoVersao')) return;
  const el = document.createElement('div');
  el.id = 'avisoVersao';
  el.className = 'aviso-versao';
  el.innerHTML = '<span>Nova versão disponível</span><button type="button" data-act="atualizar">Atualizar agora</button>';
  document.body.appendChild(el);
}
async function checarVersao() {
  if (CHECANDO) return;
  CHECANDO = true;
  try {
    const url = location.pathname + '?checagem=' + Date.now();
    let assinatura = null;
    try {
      const h = await fetch(url, { method: 'HEAD', cache: 'no-store' });
      if (h.ok) assinatura = h.headers.get('etag') || h.headers.get('last-modified');
    } catch (e) { /* alguns servidores não respondem HEAD */ }
    if (!assinatura) {
      const r = await fetch(url, { cache: 'no-store' });
      if (!r.ok) return;
      const t = await r.text();
      assinatura = t.length + ':' + hashTexto(t);
    }
    if (!VERSAO_ASSINATURA) { VERSAO_ASSINATURA = assinatura; return; }
    if (assinatura !== VERSAO_ASSINATURA) {
      NOVA_VERSAO = true;
      avisarNovaVersao();
      if (!trabalhoEmAndamento() && Date.now() - ULTIMO_TOQUE > CFG.OCIOSO_MS) recarregar();
    }
  } catch (e) {
    console.warn('Checagem de versão falhou', e);
  } finally { CHECANDO = false; }
}
function iniciarChecagemVersao() {
  checarVersao();
  setInterval(() => { if (!document.hidden) checarVersao(); }, CFG.VERSAO_MS);
  setInterval(() => {
    if (NOVA_VERSAO && !document.hidden && !trabalhoEmAndamento() && Date.now() - ULTIMO_TOQUE > CFG.OCIOSO_MS) recarregar();
  }, 20000);
  ['pointerdown', 'keydown', 'touchstart'].forEach(ev => document.addEventListener(ev, () => { ULTIMO_TOQUE = Date.now(); }, { passive: true }));
}

const AFTER = {
  producao() {
    const d = $('#prodDia');
    if (d) d.addEventListener('change', () => { PROD_DIA = d.value || today(); render(); });
  },
  contagem() {
    const b = $('#ctBusca');
    if (b) b.addEventListener('input', () => {
      CONT_Q = b.value;
      const pos = b.selectionStart;
      render();
      const nb = $('#ctBusca'); nb.focus(); nb.setSelectionRange(pos, pos);
    });
  }
};

document.addEventListener('click', ev => {
  const wz = ev.target.closest('[data-wz]');
  if (wz) { wzAcao(wz.dataset.wz, wz.dataset.v); return; }
  const ctp = ev.target.closest('[data-ctp]');
  if (ctp) { ctpAcao(ctp.dataset.ctp); return; }
  const lg = ev.target.closest('[data-login]');
  if (lg) { login(lg.dataset.login); return; }
  const nv = ev.target.closest('[data-view]');
  if (nv) { closeModal(); VIEW = nv.dataset.view; render(); window.scrollTo(0, 0); return; }
  if (ev.target === $('#modal')) { closeModal(); return; }
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  switch (a) {
    case 'logout': logout(); break;
    case 'menu': ev.preventDefault(); closeModal(); irParaMenu(); break;
    case 'mais': abrirMais(); break;
    case 'sincronizar': toast('Sincronizando…'); flush(); flushFotos(); load(); break;
    case 'ct-modo': CT_MODO = el.dataset.v; CT_IDX = 0; render(); break;
    case 'atualizar': recarregar(); break;
    case 'close': closeModal(); break;
    case 'goto': VIEW = el.dataset.v; render(); window.scrollTo(0, 0); break;
    case 'nova-prod': abrirProducao(null, el.dataset.sol); break;
    case 'edit-prod': abrirProducao(DB.producoes.find(r => r.id === id)); break;
    case 'novo-fc': abrirFC(null); break;
    case 'edit-fc': abrirFC(DB.fc.find(r => r.id === id)); break;
    case 'novo-desp': abrirDesperdicio(null, el.dataset.t); break;
    case 'edit-desp': abrirDesperdicio(DB.desperdicios.find(d => d.id === id)); break;
    case 'nova-obs': abrirObs(null); break;
    case 'edit-obs': abrirObs(DB.observacoes.find(r => r.id === id)); break;
    case 'solicitar': abrirSolicitar(el.dataset.u, el.dataset.p); break;
    case 'sol-iniciar': save('solicitacoes', { id, status: 'Em produção' }); toast('Pedido em produção'); break;
    case 'sol-cancelar':
      if (confirm('Cancelar este pedido de produção?')) { save('solicitacoes', { id, status: 'Cancelada' }); toast('Pedido cancelado'); }
      break;
    case 'ct-un': CONT_UN = el.dataset.u; F.un = el.dataset.u; CONT_Q = ''; render(); break;
    case 'ct-limpar': CONT_DRAFT[CONT_UN] = {}; render(); break;
    case 'ct-salvar': salvarContagem(); break;
    case 'exp-xlsx': exportar('xlsx'); break;
    case 'exp-pdf': exportar('pdf'); break;
    case 'exp-desp': exportar('desp'); break;
    case 'cad-tab': CAD_TAB = el.dataset.t; render(); break;
    case 'novo-produto': abrirProdutoCad(null); break;
    case 'edit-prod-cad': abrirProdutoCad(prodById(id)); break;
    case 'nova-pessoa': abrirPessoa(null); break;
    case 'edit-pessoa': abrirPessoa(DB.pessoas.find(p => p.id === id)); break;
  }
});
document.addEventListener('change', ev => {
  const f = ev.target.closest('[data-f]');
  if (!f) return;
  F[f.dataset.f] = f.value;
  if (f.dataset.f === 'un' && UN_IDS.includes(f.value)) CONT_UN = f.value;
  if (f.dataset.f === 'per' && f.value === 'custom') { F.de = F.de || addDays(today(), -6); F.ate = F.ate || today(); }
  render();
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (!t.dataset || !t.dataset.ct) return;
  const cardPasso = t.closest('.card[data-pid]');
  if (cardPasso) {
    const dr = draftOf(CONT_UN);
    const pid = cardPasso.dataset.pid;
    dr[pid] = dr[pid] || {};
    dr[pid][t.dataset.ct] = t.value;
    if (t.dataset.ct === 'qtd') ctpAtualiza();
    return;
  }
  const row = t.closest('.ct-row');
  const dr = draftOf(CONT_UN);
  const pid = row.dataset.pid;
  dr[pid] = dr[pid] || {};
  dr[pid][t.dataset.ct] = t.value;
  if (t.dataset.ct === 'qtd') atualizaLinhaContagem(row);
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && $('#modal').classList.contains('open')) closeModal();
  if (ev.key === 'Enter' && ev.target.dataset && ev.target.dataset.ct === 'qtd') {
    ev.preventDefault();
    const all = $$('input[data-ct="qtd"]');
    const nx = all[all.indexOf(ev.target) + 1];
    if (nx) nx.focus(); else ev.target.blur();
  }
});
window.addEventListener('beforeunload', ev => {
  const pend = Object.values(CONT_DRAFT).some(d => Object.values(d).some(x => x.qtd !== '' && x.qtd !== undefined));
  if (pend) { ev.preventDefault(); ev.returnValue = ''; }
});
window.addEventListener('online', () => { flush(); load(); updSync(); });
window.addEventListener('offline', () => updSync());
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  ULTIMO_TOQUE = Date.now();
  load();
  flushFotos();
  checarVersao();
});

/* =========================================================
   INÍCIO
   ========================================================= */
(function init() {
  restore();
  const s = getSession();
  if (s) USER = DB.pessoas.find(p => p.id === s.id) || null;
  if (USER) { VIEW = USER.papel === 'alimentador' ? 'inicio' : 'geral'; render(); } else renderLogin();
  if (CFG.GAS_URL) {
    load().then(() => {
      if (!USER && s) { USER = DB.pessoas.find(p => p.id === s.id) || null; }
      if (!USER) renderLogin();
    });
    setInterval(() => { if (!document.hidden) load(); }, CFG.REFRESH_MS);
  }
  iniciarChecagemVersao();
  iniciarFotos();
  registrarServiceWorker();
})();
</script>
</body>
</html>
