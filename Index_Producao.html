<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E2B33">
<title>Controle de Produção</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#141416; --ink-2:#26272B; --paper:#F4F4F5; --card:#FFFFFF; --line:#DEDFE2;
  --text:#1B1C20; --mute:#6A6D75;
  --brand:#C4161C; --brand-on:#FFFFFF; --brand-soft:#FBE4E5; --accent:#E8383D;
  --logo-bg:transparent; --chip:#ECEDEF;
  --jade:#1F7A63; --jade-soft:#E0EFE9;
  --chili:#C23A2E; --chili-soft:#FAE5E2;
  --yuzu:#B98107; --yuzu-soft:#FAF0D4;
  --sky:#2F6690; --sky-soft:#E3EDF5;
  --r-lg:16px; --r:10px;
  --display:'Bricolage Grotesque', 'Figtree', system-ui, sans-serif;
  --body:'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
/* Temas por empresa: QF = Q Food (Todas e Cozinha de Produção), ML = Mercearia Liberdade, GG = Gogui */
body[data-tema="ML"]{
  --ink:#3A0C10; --ink-2:#521519; --paper:#FBF6F1; --line:#EEDFD3;
  --text:#2B1A17; --mute:#7A6259;
  --brand:#D8261F; --brand-on:#FFFFFF; --brand-soft:#FDE6DC; --accent:#F29A22;
  --logo-bg:#FFFFFF; --chip:#F6E8DC;
}
body[data-tema="GG"]{
  --ink:#110F0C; --ink-2:#231F19; --paper:#F7F4EE; --line:#E6DECF;
  --text:#1D1913; --mute:#756B5C;
  --brand:#8A6629; --brand-on:#FFFFFF; --brand-soft:#F3EAD7; --accent:#D4AF5F;
  --logo-bg:#110F0C; --chip:#EFE7D8;
}
body{transition:background-color .35s ease}
.top,.gauge,.login{transition:background-color .35s ease}
.brand-row{display:flex;align-items:center;gap:12px;min-width:0;min-height:46px}
.brand-logo{height:40px;width:auto;max-width:96px;object-fit:contain;border-radius:8px;background:var(--logo-bg);padding:3px 6px;flex:none}
body[data-tema="GG"] .brand-logo{height:44px;padding:0}
body[data-tema="QF"] .brand-logo{height:44px;max-width:120px;padding:0}
.top-logo.brand-logo{height:32px;max-width:104px;padding:2px 4px}
.login .brand-logo{height:72px;max-width:180px;margin:0 0 18px}
@media (max-width:640px){.brand-logo{height:32px;max-width:70px}.brand small{display:none}}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--body);background:var(--paper);color:var(--text);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Topo ---------- */
.top{background:var(--ink);color:#fff;position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top)}
.top-in{max-width:1180px;margin:0 auto;padding:14px 18px 0;display:flex;align-items:center;gap:14px}
.brand{font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:-.02em;line-height:1.05}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:12px;opacity:.7;letter-spacing:0;margin-top:3px}
.top .spacer{flex:1}
.menu-link{flex:none;display:inline-flex;align-items:center;gap:4px;color:#fff;text-decoration:none;font-weight:700;font-size:13.5px;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:6px 12px}
.menu-link:hover{background:rgba(255,255,255,.1)}
.login .menu-link{align-self:flex-start;margin:-28px 0 28px}
.who{display:flex;align-items:center;gap:10px;font-size:13px}
.who b{display:block;font-weight:600}
.who span{opacity:.7}
.who button{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:5px 12px;cursor:pointer;font-size:12.5px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;opacity:.85;white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:#9aa6ad;display:inline-block}
.sync.ok i{background:#5fd3a9}.sync.err i{background:#ff8a7d}.sync.sync i{background:#ffd166;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
nav.tabs{display:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;color:rgba(255,255,255,.7);padding:10px 12px 12px;cursor:pointer;font-weight:600;white-space:nowrap;border-bottom:3px solid transparent;font-size:14.5px}
nav.tabs button.on{color:#fff;border-bottom-color:var(--accent)}
@media (max-width:1023px){.who .who-txt{display:none}.brand{font-size:16px;white-space:nowrap}.brand small{display:none}.top-in{padding:10px 14px}.menu-link{display:none}}
@media (max-width:520px){.sync .sync-txt{display:none}}

main{max-width:1180px;margin:0 auto;padding:20px 18px 110px}
h2.view{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-.02em;margin:4px 0 4px}
p.lead{color:var(--mute);margin:0 0 18px;max-width:62ch}
h3.sec{font-family:var(--display);font-weight:700;font-size:18px;margin:26px 0 10px;display:flex;align-items:baseline;gap:8px}
h3.sec .count{font-family:var(--body);font-size:13px;color:var(--mute);font-weight:500}

/* ---------- Componentes ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:var(--r);padding:12px 18px;background:var(--brand);color:var(--brand-on);font-weight:700;cursor:pointer;font-size:15px;transition:background-color .35s ease}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.danger{background:transparent;color:var(--chili);border:1.5px solid #eec3be}
.btn.dark{background:var(--ink)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--jade-soft);color:var(--jade)}
.pill.warn{background:var(--yuzu-soft);color:var(--yuzu)}
.pill.bad{background:var(--chili-soft);color:var(--chili)}
.pill.mute{background:#ECEFEC;color:var(--mute)}
.pill.info{background:var(--sky-soft);color:var(--sky)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:#c4cbc6}
.dot.ok{background:var(--jade)}.dot.warn{background:var(--yuzu)}.dot.bad{background:var(--chili)}
.empty{color:var(--mute);padding:18px;text-align:center;border:1.5px dashed var(--line);border-radius:var(--r-lg);background:rgba(255,255,255,.5)}
.banner{background:var(--yuzu-soft);color:#6d4d05;border-radius:var(--r);padding:10px 14px;font-size:13.5px;margin-bottom:16px}

.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin:0 0 18px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span{font-size:13px;font-weight:600;color:var(--mute)}
.fld.req>span::after{content:" *";color:var(--chili)}
input[type=text],input[type=date],input[type=search],input[type=number],select,textarea{width:100%;border:1.5px solid var(--line);border-radius:var(--r);padding:10px 12px;background:#fff;min-height:44px}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--sky);outline:none}
.fld.sm select,.fld.sm input{min-height:38px;padding:7px 10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:560px){.grid2,.grid3{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:12px}
.hint{font-size:12.5px;color:var(--mute)}
.err-msg{color:var(--chili);font-size:13px;font-weight:600}
.checks{display:flex;gap:8px;flex-wrap:wrap}
.checks label{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:14px;background:#fff}
.checks input{accent-color:var(--brand)}
.seg{display:inline-flex;background:#E4E8E3;border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:8px 14px;border-radius:9px;font-weight:600;cursor:pointer;color:var(--mute)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(30,43,51,.12)}

/* ---------- Visão geral ---------- */
.hero{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:14px;align-items:start}
@media (max-width:820px){.hero{grid-template-columns:1fr}}
.gauge{background:var(--ink);color:#fff;border-radius:22px;padding:18px 18px 16px;display:flex;flex-direction:column;align-items:center;text-align:center}
.gauge svg{width:100%;max-width:280px;height:auto;display:block}
.gauge .pct{font-family:var(--display);font-weight:800;font-size:64px;line-height:.9;letter-spacing:-.04em;margin-top:-54px}
.gauge .pct sup{font-size:26px;vertical-align:top;margin-left:2px}
.gauge .g-lbl{font-weight:600;margin-top:8px}
.gauge .g-sub{font-size:12.5px;opacity:.7;margin-top:2px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:560px){.tiles{grid-template-columns:1fr 1fr}}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between;min-height:104px;cursor:default}
.tile[data-act]{cursor:pointer}
.tile b{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;letter-spacing:-.03em}
.tile span{font-size:13.5px;color:var(--mute);font-weight:500}
.tile.bad b{color:var(--chili)}.tile.warn b{color:var(--yuzu)}
.quick{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.tipos{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 0 18px}
.tipo-btn{background:var(--card);border:1.5px solid var(--line);border-left:5px solid var(--brand);border-radius:var(--r-lg);padding:14px;text-align:left;cursor:pointer;font-weight:700;font-size:15px;line-height:1.2}
.tipo-btn:hover{border-color:var(--brand)}
.tipo-btn small{display:block;font-weight:500;font-size:12px;color:var(--mute);margin-top:4px}
.fc-painel{display:flex;gap:14px;flex-wrap:wrap;align-items:center;background:var(--brand-soft);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px 14px}
.fc-painel .fc-n b{font-family:var(--display);font-weight:800;font-size:22px;line-height:1;display:block}
.fc-painel .fc-n span{font-size:12px;color:var(--mute)}
.fc-painel .fc-st{margin-left:auto;text-align:right;display:flex;flex-direction:column;gap:3px;align-items:flex-end}
.fc-painel .fc-st small{font-size:11.5px;color:var(--mute)}
.fc-painel .fc-alerta{color:var(--chili);font-weight:700}
.fc-vazio{color:var(--mute);font-size:13px}
.quick .btn{flex:1;min-width:180px;padding:14px}

.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row-main{flex:1;min-width:0}
.row-main b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.row-main small,.row-num small{display:block;color:var(--mute);font-size:12.5px}
.row-num{text-align:right;white-space:nowrap}
.row-num b{font-weight:700}
.row .btn.sm{flex:none}
details.more>summary{cursor:pointer;font-weight:600;color:var(--sky);padding:8px 0;list-style:none}
details.more>summary::-webkit-details-marker{display:none}

/* ---------- Produção / Observações ---------- */
.fila{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.sol{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--chili);border-radius:var(--r-lg);padding:14px;display:flex;flex-direction:column;gap:8px}
.sol.prog{border-left-color:var(--sky)}
.sol .t{font-weight:700;font-size:16px}
.sol .m{font-size:13px;color:var(--mute)}
.sol .q{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.02em}
.rec{display:flex;gap:12px;padding:12px 14px;border-top:1px solid var(--line);align-items:flex-start}
.rec:first-child{border-top:0}
.rec .qty{font-family:var(--display);font-weight:800;font-size:22px;white-space:nowrap;min-width:92px;text-align:right}
.rec .obs{font-size:13.5px;margin-top:4px}
.rec a{color:var(--sky)}
.obs-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px;display:flex;flex-direction:column;gap:6px}
.obs-card.crit{border-color:#e9b3ad}
.obs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--mute)}

/* ---------- Contagem ---------- */
.ct-head{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:12px}
.ct-row{display:grid;grid-template-columns:1fr 150px 108px;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.ct-row:first-child{border-top:0}
.ct-row.filled{background:#FAFCFA}
.ct-row .nm b{display:block;font-weight:600}
.ct-row .nm small{color:var(--mute);font-size:12.5px;display:block}
.ct-in{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:var(--r);background:#fff;overflow:hidden}
.ct-in:focus-within{border-color:var(--sky)}
.ct-in input{border:0;min-height:44px;text-align:right;font-weight:700;font-size:17px;padding:8px 6px 8px 10px;font-variant-numeric:tabular-nums}
.ct-in input:focus{outline:none}
.ct-in em{font-style:normal;color:var(--mute);padding:0 10px 0 2px;font-size:13px;white-space:nowrap}
.ct-st{text-align:right}
.ct-obs{grid-column:1/-1}
.ct-obs input{min-height:38px}
.ct-row.need-obs .ct-obs input{border-color:var(--chili)}
@media (max-width:560px){.ct-row{grid-template-columns:1fr 120px}.ct-st{grid-column:1/-1;text-align:left;margin-top:-4px}}
.savebar{position:fixed;left:0;right:0;bottom:0;background:rgba(243,245,241,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom));z-index:15}
.savebar .in{max-width:1180px;margin:0 auto;display:flex;gap:12px;align-items:center;justify-content:space-between}

/* ---------- Relatórios / Cadastros ---------- */
table.tb{width:100%;border-collapse:collapse;font-size:14px}
.tb-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg)}
table.tb th{text-align:left;font-size:12.5px;color:var(--mute);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.tb td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.tb tr:last-child td{border-bottom:0}
table.tb td.r,table.tb th.r{text-align:right}
table.tb tr.click{cursor:pointer}
table.tb tr.click:hover td{background:#F7F9F6}
.bar{height:8px;background:#E8ECE8;border-radius:99px;overflow:hidden;min-width:80px}
.bar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 7px;background:var(--chip);color:var(--ink-2)}

/* ---------- Casca: sidebar no desktop, barra inferior no celular ---------- */
.app-shell{min-height:100vh}
.side{display:none}
.side-logo{display:flex;align-items:center;gap:10px;padding:16px 16px 12px}
.side-logo img{height:40px;max-width:120px;object-fit:contain;background:var(--logo-bg);border-radius:8px;padding:2px 4px}
.side-logo b{font-family:var(--display);font-weight:800;font-size:15px;line-height:1.1;color:#fff}
.side-logo small{display:block;font-weight:500;font-size:11.5px;opacity:.7;margin-top:2px}
.side-grupo{margin-top:16px;padding:0 16px}
.side-grupo h4{margin:0 0 6px;font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.4)}
.side-item{display:flex;align-items:center;gap:11px;width:100%;background:none;border:0;color:rgba(255,255,255,.75);padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14.5px;text-align:left;line-height:1.2}
.side-item:hover{background:rgba(255,255,255,.07);color:#fff}
.side-item.on{background:var(--brand);color:var(--brand-on)}
.side-item svg{flex:none;opacity:.9}
.side-item .badge{margin-left:auto;background:var(--chili);color:#fff;border-radius:99px;font-size:11px;font-weight:700;padding:1px 7px}
.side-item.on .badge{background:rgba(0,0,0,.25)}
.side-pe{margin-top:auto;padding:14px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.75);font-size:13px}
.side-pe b{display:block;color:#fff;font-size:14px}
.side-pe .acoes{display:flex;gap:8px;margin-top:10px}
.side-pe button,.side-pe a{flex:1;border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;border-radius:8px;padding:7px 8px;font-size:12.5px;font-weight:600;cursor:pointer;text-align:center;text-decoration:none}
.side-pe button:hover,.side-pe a:hover{background:rgba(255,255,255,.1)}

.bottom{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.bottom button{flex:1;background:none;border:0;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--mute);font-size:11px;font-weight:600;cursor:pointer;position:relative;min-height:56px}
.bottom button.on{color:var(--brand)}
.bottom button .pt{position:absolute;top:4px;right:50%;margin-right:-24px;min-width:18px;height:18px;border-radius:99px;background:var(--chili);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center;padding:0 5px}
@media (min-width:1024px){
  .app-shell{display:grid;grid-template-columns:250px 1fr;align-items:stretch}
  .side{display:flex;flex-direction:column;background:var(--ink);position:sticky;top:0;height:100vh;overflow-y:auto}
  .bottom{display:none}
  main{padding-bottom:40px;max-width:1120px}
  .top{position:sticky}
  .top .brand-row,.top .menu-link{display:none}
  .top-in{padding:14px 22px}
}
@media (max-width:1023px){
  main{padding-bottom:96px}
  .seg{display:flex;width:100%}
  .seg button{flex:1;padding:9px 6px;font-size:13.5px;white-space:nowrap}
  .ct-head{gap:8px}
  .ct-head input[type=search]{max-width:none;width:100%}
  p.lead.enxuto{display:none}
}

/* ---------- Início do operador ---------- */
.ola{margin:6px 0 4px;font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.02em}
.ola-sub{color:var(--mute);margin:0 0 18px}
.acao-grande{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:100%;
  background:var(--brand);color:var(--brand-on);border:0;border-radius:20px;padding:26px 18px;cursor:pointer;
  font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:-.01em;min-height:132px;
  box-shadow:0 10px 26px rgba(0,0,0,.14)}
.acao-grande small{font-family:var(--body);font-weight:500;font-size:13.5px;opacity:.85;letter-spacing:0}
.acao-grande svg{margin-bottom:2px;opacity:.95}
.acoes-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.acao{display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:16px 14px;cursor:pointer;text-align:left;font-weight:700;font-size:16px;min-height:104px;color:var(--text)}
.acao:hover{border-color:var(--brand)}
.acao svg{color:var(--brand);margin-bottom:6px}

/* ---------- Cabeçalho claro (padrão do mockup) ---------- */

.sino .n{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;border-radius:99px;background:var(--chili);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.top-logo{height:34px;max-width:112px;object-fit:contain;background:var(--logo-bg);border-radius:8px;padding:2px 4px}

/* ---------- Painéis no padrão do mockup ---------- */
.painel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.painel>header{display:flex;align-items:center;gap:9px;margin:-2px 0 14px}
.painel>header h3{margin:0;font-family:var(--display);font-weight:700;font-size:16.5px;letter-spacing:-.01em;flex:1}
.painel>header .ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);flex:none}
.painel>header .ic.alerta{background:var(--chili-soft);color:var(--chili)}
.painel>header .ic.ok{background:var(--jade-soft);color:var(--jade)}
.painel>header a,.painel>header button.link{background:none;border:0;color:var(--mute);font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.painel>header .cont{background:var(--chili);color:#fff;border-radius:99px;font-size:11.5px;font-weight:700;padding:1px 8px}
.linhas{display:flex;flex-direction:column}
.linha-item{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:11px 4px;cursor:pointer;text-align:left;color:var(--text)}
.linha-item:first-child{border-top:0;padding-top:2px}
.linha-item:hover{background:var(--paper)}
.linha-item b{display:block;font-weight:600;font-size:14.5px}
.linha-item small{display:block;font-size:12.5px;font-weight:600}
.linha-item small.bad{color:var(--chili)}
.linha-item small.warn{color:var(--yuzu)}
.linha-item small.mute{color:var(--mute)}
.linha-item .seta{margin-left:auto;color:var(--mute)}
.obs-linha{border-left:3px solid var(--chili);padding:4px 0 4px 12px;margin-bottom:14px}
.obs-linha.alto{border-left-color:var(--yuzu)}
.obs-linha b{display:block;font-size:14px}
.obs-linha p{margin:2px 0 0;font-size:13px;color:var(--text)}
.obs-linha time{display:block;color:var(--mute);font-size:11.5px;margin-top:4px}

/* donut da saúde do estoque */
.donut-wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut{position:relative;width:168px;height:168px;flex:none}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut .centro{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.donut .centro b{font-family:var(--display);font-weight:800;font-size:34px;letter-spacing:-.03em;line-height:1}
.donut .centro span{font-size:12px;color:var(--mute)}
.legenda{display:flex;flex-direction:column;gap:12px}
.legenda div{display:flex;align-items:flex-start;gap:9px;font-size:13.5px}
.legenda i{width:10px;height:10px;border-radius:50%;margin-top:4px;flex:none}
.legenda b{display:block;font-size:14px}
.legenda small{color:var(--mute)}

/* fila de produção */
.fila{display:grid;grid-template-columns:repeat(auto-fill,minmax(262px,1fr));gap:12px}
.sol{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:9px}
.sol .badge-prio{display:inline-flex;align-items:center;gap:5px;border-radius:8px;padding:3px 9px;font-size:11px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;align-self:flex-start}
.sol .badge-prio.urg{background:var(--chili);color:#fff}

.sol .m{display:flex;align-items:center;gap:5px;color:var(--mute);font-size:12.5px}
.sol .btn{min-height:44px}

/* ---------- Início do operador (mockup) ---------- */
.ola{margin:14px 0 2px;font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.02em}
.acao-grande{background:var(--brand);color:var(--brand-on);border:0;border-radius:18px;padding:22px 18px;width:100%;
  display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;
  font-family:var(--display);font-weight:800;font-size:20px;min-height:120px;box-shadow:0 8px 22px rgba(0,0,0,.13)}
.acoes-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.acao{display:flex;flex-direction:column;align-items:flex-start;gap:0;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:14px;cursor:pointer;text-align:left;font-weight:700;font-size:15px;color:var(--text);min-height:104px}
.acao .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;margin-bottom:10px}
.acao .ic.v{background:var(--jade-soft);color:var(--jade)}

@media (max-width:1023px){

  .pill-un select{font-size:13.5px}

}
@media (min-width:1024px){ .top-logo{display:none} }

/* ---------- Login ---------- */
.login{min-height:100vh;background:var(--ink);color:#fff;display:flex;flex-direction:column;align-items:center;padding:48px 18px 40px}
.login h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,7vw,56px);letter-spacing:-.035em;line-height:.95;margin:0;text-align:center}
.login .sub{opacity:.72;margin:12px 0 30px;text-align:center}
.login .unis{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:34px}
.login .unis span{border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:5px 12px;font-size:13px}
.login .grp{width:100%;max-width:560px;margin-bottom:22px}
.login .grp h4{margin:0 0 10px;font-weight:600;font-size:14px;opacity:.75}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.names button{background:var(--ink-2);border:1px solid rgba(255,255,255,.12);color:#fff;border-radius:14px;padding:14px;text-align:left;cursor:pointer;font-weight:600;font-size:15.5px}

.names button small{display:block;font-weight:400;opacity:.65;font-size:12px;margin-top:2px}

/* ---------- Modal / Toast ---------- */
.modal{position:fixed;inset:0;background:rgba(20,30,36,.55);display:none;align-items:flex-end;justify-content:center;z-index:50}

.toast.bad{background:var(--chili)}

<script>
'use strict';
/* =========================================================
   CONFIGURAÇÃO
   GAS_URL: cole aqui a URL /exec da implantação do Code_Producao.gs.
   Vazio = modo local (dados só neste aparelho, útil para teste).
   ========================================================= */
const CFG = {
  GAS_URL: 'https://script.google.com/macros/s/AKfycbwBc-EXOlX-SpXNGfYc0g0JekacWor2ty7BHzQ3LJEzYTh6Pg7PALbe26TgjzJZ_-eY/exec',
  SESSION_KEY: 'cprod_session',
  CACHE_KEY: 'cprod_cache_v1',
  OUTBOX_KEY: 'cprod_outbox_v1',
  SESSION_HOURS: 12,
  OBS_OBRIGATORIA_REPOR: true,   // exige observação quando a contagem der "Repor"
  DIAS_SEM_CONTAGEM: 2,          // a partir de quantos dias o item entra em "sem contagem recente"
  REFRESH_MS: 120000,
  MENU_URL: 'https://rodsilveira-rs.github.io/qfood-dashboard/Index_Menu.html',
  // Logins do Index_Menu que entram só como equipe de produção (sem Relatórios e Cadastros)
  EMAILS_OPERADOR: ['producao@mercearialiberdade.com.br'],
  LIB_XLSX: 'https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js',
  LIB_XLSX_NOTA: 'Excel via xlsx-js-style; PDF é gerado pelo próprio navegador (imprimir para PDF)',
  VERSAO_MS: 300000,   // de quanto em quanto tempo procura uma versão nova do arquivo
  OCIOSO_MS: 60000     // tempo sem toque na tela para recarregar sozinho
};

const UN = {
  ML: { nome: 'Mercearia Liberdade', curto: 'Mercearia' },
  GG: { nome: 'Gogui Korean', curto: 'Gogui' },
  CP: { nome: 'Cozinha de Produção', curto: 'Cozinha' }
};
const UN_IDS = ['ML', 'GG', 'CP'];
/* Tema visual por empresa. "Todas" e Cozinha de Produção usam a identidade Q Food. */
const ASSETS_URL = 'https://rodsilveira-rs.github.io/qfood-dashboard/assets/';
const TEMAS = {
  QF: { logo: 'qfood-logo.png', alt: 'Q Food Company', cor: '#141416', sub: 'Mercearia Liberdade, Gogui e Cozinha de Produção' },
  ML: { logo: 'Logo_Mercearia_Liberdade.png', alt: 'Mercearia Liberdade', cor: '#3A0C10', sub: 'Mercearia Liberdade' },
  GG: { logo: 'gogui-logo.jpg', alt: 'Gogui Korean BBQ', cor: '#110F0C', sub: 'Gogui Korean' }
};
const temaDaUnidade = u => (u === 'ML' || u === 'GG') ? u : 'QF';
function aplicarTema(u) {
  const id = temaDaUnidade(u);
  const t = TEMAS[id];

function persist() {

function restore() {

    if (c) TABS.forEach(t => { DB[t] = Array.isArray(c[t]) ? c[t] : []; });
    OUTBOX = JSON.parse(localStorage.getItem(CFG.OUTBOX_KEY) || '[]');

    if (!DB.pessoas.length) DB.pessoas = SEED_PESSOAS.map(p => ({ ...p }));

}
function upsertLocal(tab, row) {
  const arr = DB[tab];
  const i = arr.findIndex(r => r.id === row.id);
  if (i >= 0) arr[i] = { ...arr[i], ...row }; else arr.push({ ...row });
  return i >= 0 ? arr[i] : arr[arr.length - 1];
}
function save(tab, row, silent) {
  row.atualizado_em = nowISO();
  const merged = upsertLocal(tab, row);
  OUTBOX.push({ tab, row: { ...merged } });
  persist();
  if (!silent) render();
  flush();
  return merged;
}
function setSync(state, msg) { SYNC = { state, msg }; updSync(); }
function updSync() {
  const el = $('#sync'); if (!el) return;
  if (!CFG.GAS_URL) { el.className = 'sync'; $('.sync-txt', el).textContent = 'Somente neste aparelho'; return; }
  const fotos = fotosNaFila();
  const fila = [];
  if (OUTBOX.length) fila.push(`${OUTBOX.length} registro${OUTBOX.length > 1 ? 's' : ''}`);
  if (fotos) fila.push(`${fotos} foto${fotos > 1 ? 's' : ''}`);
  const offline = !navigator.onLine;
  el.className = 'sync ' + (offline ? 'err' : SYNC.state);
  $('.sync-txt', el).textContent = (offline ? 'Sem internet' : SYNC.msg) + (fila.length ? ` (${fila.join(' e ')} na fila)` : '');
}
async function api(body) {
  const res = await fetch(CFG.GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  return res.json();
}
async function flush() {
  if (!CFG.GAS_URL || flushing || !OUTBOX.length) { updSync(); return; }
  flushing = true;
  setSync('sync', 'Enviando…');
  const batch = OUTBOX.slice(0, 40);
  let ok = false;
  try {
    const r = await api({ action: 'upsert', items: batch });
    if (!r || !r.ok) throw new Error((r && r.error) || 'Falha no envio');
    OUTBOX.splice(0, batch.length);
    persist();
    ok = true;
    setSync('ok', 'Sincronizado ' + nowISO().slice(11, 16));
  } catch (e) {
    console.warn(e);
    setSync('err', 'Sem conexão');
  } finally { flushing = false; }
  if (ok && OUTBOX.length) flush();
  if (ok) flushFotos();
}

async function load() {

function gaugeSVG(pct) {
  const p = pct === null ? 0 : Math.max(0, Math.min(100, pct));
  const cor = pct === null ? '#5b6a73' : p < 60 ? '#ff7a6b' : p < 85 ? '#f2b632' : '#5fd3a9';
  const r = 100, cx = 120, cy = 120;
  const ang = Math.PI * (1 - p / 100);
  const x = cx + r * Math.cos(ang), y = cy - r * Math.sin(ang);
  const arc = p > 0 ? `<path d="M20 120 A100 100 0 0 1 ${x.toFixed(2)} ${y.toFixed(2)}" fill="none" stroke="${cor}" stroke-width="22" stroke-linecap="round"/>` : '';
  const ticks = [0, 25, 50, 75, 100].map(t => {
    const a = Math.PI * (1 - t / 100);
    return `<line x1="${cx + 118 * Math.cos(a)}" y1="${cy - 118 * Math.sin(a)}" x2="${cx + 126 * Math.cos(a)}" y2="${cy - 126 * Math.sin(a)}" stroke="rgba(255,255,255,.35)" stroke-width="2"/>`;
  }).join('');
  const needle = `<line x1="${cx}" y1="${cy}" x2="${(cx + 74 * Math.cos(ang)).toFixed(2)}" y2="${(cy - 74 * Math.sin(ang)).toFixed(2)}" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".55"/><circle cx="${cx}" cy="${cy}" r="6" fill="#fff" opacity=".55"/>`;
  return `<svg viewBox="0 0 240 132" aria-hidden="true"><path d="M20 120 A100 100 0 0 1 220 120" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="22" stroke-linecap="round"/>${arc}${ticks}${pct === null ? '' : needle}</svg>`;
}
function linhaEstoque(e) {

function donutSVG(ok, aten, baixo) {
  const total = ok + aten + baixo;
  const r = 66, c = 2 * Math.PI * r;
  const seg = (v, cor, offset) => total ? `<circle cx="84" cy="84" r="${r}" fill="none" stroke="${cor}" stroke-width="18" stroke-linecap="butt"
      stroke-dasharray="${(v / total * c).toFixed(1)} ${c.toFixed(1)}" stroke-dashoffset="${(-offset / total * c).toFixed(1)}"/>` : '';
  const pct = total ? Math.round(ok / total * 100) : null;
  return `<div class="donut"><svg viewBox="0 0 168 168">
      <circle cx="84" cy="84" r="${r}" fill="none" stroke="var(--chip)" stroke-width="18"/>
      ${seg(ok, '#1F9E6E', 0)}${seg(aten, '#E0A020', ok)}${seg(baixo, '#C23A2E', ok + aten)}
    </svg><div class="centro"><b class="num">${pct === null ? '—' : pct + '%'}</b><span>estoque saudável</span></div></div>`;
}

function abrirProducao(r, solId) {
  const sol = solId ? DB.solicitacoes.find(s => s.id === solId) : null;
  if (!r && noCelular()) { abrirProducaoWizard(sol); return; }
  openModal(r ? 'Editar produção' : 'Registrar produção', formProducao(r, sol), root => {
    const fm = $('#fProd', root), f = fm.elements;
    const selU = f.unidade, selP = f.produto_id, selM = f.medida, inV = f.validade, fData = f.data;
    let valTocada = !!(r && r.validade);
    inV.addEventListener('input', () => { valTocada = true; });
    const fillProds = keep => {
      const u = selU.value;
      let list = prodsDaUnidade(u);
      const cur = keep || selP.value;
      if (cur && !list.some(p => p.id === cur) && prodById(cur)) list = list.concat([prodById(cur)]);
      selP.innerHTML = `<option value="">${list.length ? 'Escolha o produto' : 'Nenhum produto cadastrado para esta unidade'}</option>` +
        list.map(p => `<option value="${esc(p.id)}" ${p.id === cur ? 'selected' : ''}>${esc(p.nome)}</option>`).join('');
    };
    const onProd = first => {
      const p = prodById(selP.value);
      if (!p) return;
      if (!(first && r)) selM.value = p.medida || 'un';
      $('#fldVal', root).classList.toggle('req', usaValidade(p));
      const dias = num(p.dias_validade);
      if (!valTocada && !isNaN(dias)) inV.value = addDays(fData.value || today(), dias);
    };
    fillProds(r ? r.produto_id : sol ? sol.produto_id : '');
    onProd(true);
    selU.addEventListener('change', () => { fillProds(); onProd(); });
    selP.addEventListener('change', () => onProd());
    fData.addEventListener('change', () => { if (!valTocada) onProd(); });
    bindFoto(root);
    const cancelBtn = $('[data-act="cancel-prod"]', root);
    if (cancelBtn) cancelBtn.addEventListener('click', () => {
      if (!confirm('Excluir este registro de produção?')) return;
      save('producoes', { id: r.id, status: 'cancelado' });
      closeModal(); toast('Registro excluído');
    });
    fm.addEventListener('submit', ev => {
      ev.preventDefault();
      const err = $('#fErr', root);
      if (FOTO_BUSY) { err.textContent = 'Aguarde o envio da foto terminar.'; return; }
      const p = prodById(selP.value);
      const q = num(f.qtd.value);
      if (!f.data.value) { err.textContent = 'Informe a data.'; return; }
      if (!p) { err.textContent = 'Escolha o produto.'; return; }
      if (isNaN(q) || q <= 0) { err.textContent = 'Informe a quantidade produzida.'; return; }
      if (usaValidade(p) && !f.validade.value) { err.textContent = 'Este produto exige validade.'; return; }
      localStorage.setItem('cprod_last_local', f.local.value);
      let solVinc = f.solicitacao_id.value;
      if (!r && !solVinc) {
        const aberta = solAbertaDe(selU.value, p.id);
        if (aberta && confirm(`Existe o pedido ${solNum(aberta)} aberto para ${p.nome}. Marcar como atendido com esta produção?`)) solVinc = aberta.id;
      }
      const row = {
        id: r ? r.id : uid('pr'), data: f.data.value, unidade: selU.value, local: f.local.value,
        produto_id: p.id, produto_nome: p.nome, qtd: q, medida: selM.value, lote: f.lote.value.trim(),
        validade: f.validade.value, responsavel: f.responsavel.value, ficha_usada: f.ficha_usada.value,
        obs: f.obs.value.trim(), evidencia: f.evidencia.value, solicitacao_id: solVinc, status: 'ativo'
      };
      if (!r) { row.criado_por = USER.nome; row.criado_em = nowISO(); }
      save('producoes', row, true);
      if (solVinc && !r) {
        save('solicitacoes', { id: solVinc, status: 'Atendida', producao_id: row.id, atendida_em: nowISO() }, true);
      }
      closeModal();
      render();
      toast(r ? 'Produção atualizada' : 'Produção salva');
    });
  });
}

function atualizaLinhaContagem(row) {
  const u = CONT_UN, pid = row.dataset.pid, p = prodById(pid);

  $('.ct-st', row).innerHTML = sit ? `<span class="pill ${SIT[sit].c}">${SIT[sit].t}${need ? ` ${fmtN(sugestao(p, u, d.qtd))} ${esc(p.medida)}` : ''}</span>` : '';

function salvarContagem() {
  const u = CONT_UN, dr = draftOf(u);
  const itens = Object.entries(dr).filter(([, d]) => d.qtd !== '' && d.qtd !== undefined);
  let erro = null;
  $$('.ct-row').forEach(r => r.classList.remove('need-obs'));
  for (const [pid, d] of itens) {
    const p = prodById(pid);
    const q = num(d.qtd);
    const row = $(`.ct-row[data-pid="${CSS.escape(pid)}"]`);
    if (!p) continue;
    if (isNaN(q) || q < 0) { erro = `Quantidade inválida em ${p.nome}.`; if (row) row.classList.add('need-obs'); break; }
    if (CFG.OBS_OBRIGATORIA_REPOR && situacao(p, u, q) === 'repor' && !String(d.obs || '').trim()) {
      erro = `Escreva uma observação para ${p.nome}, que está abaixo do mínimo.`;
      if (row) { row.classList.add('need-obs'); $('.ct-obs', row).classList.remove('hidden'); }
      break;
    }
  }
  if (erro) { toast(erro, true); return; }
  const agora = nowISO();
  const repor = [];
  itens.forEach(([pid, d]) => {
    const p = prodById(pid); if (!p) return;
    const q = num(d.qtd);
    const sit = situacao(p, u, q);
    const min = minOf(p, u);
    save('contagens', {
      id: uid('ct'), data_hora: agora, unidade: u, produto_id: p.id, produto_nome: p.nome, qtd: q, medida: p.medida,
      minimo: isNaN(min) ? '' : min, situacao: sit ? SIT[sit].t : '', responsavel: USER.nome, obs: String(d.obs || '').trim(),
      status: 'ativo', criado_por: USER.nome, criado_em: agora
    }, true);
    if (sit === 'repor' && !solAbertaDe(u, p.id)) repor.push({ p, q });
  });
  CONT_DRAFT[u] = {};
  render();
  if (!repor.length) { toast(`Contagem salva: ${itens.length} ${itens.length === 1 ? 'item' : 'itens'}`); return; }
  openModal('Contagem salva', `
    <p>${itens.length} ${itens.length === 1 ? 'item salvo' : 'itens salvos'} em ${UN[u].nome}. Estes estão abaixo do mínimo e ainda não têm pedido de produção:</p>

    <div class="actions"><button type="button" class="btn" style="flex:1" id="btnCriarSols">Criar ${repor.length} ${repor.length === 1 ? 'pedido' : 'pedidos'} de produção</button><button type="button" class="btn ghost" data-act="close">Agora não</button></div>
  `, root => {
    $('#btnCriarSols', root).addEventListener('click', () => {
      repor.forEach(x => criarSolicitacao(x.p, u, x.q, { silent: true }));
      closeModal(); render();
      toast(`${repor.length} ${repor.length === 1 ? 'pedido criado' : 'pedidos criados'}`);
    });
  });
}

  const q = num(qtd);
  if (isNaN(q)) return NaN;

  if (m === 'kg') return q;
  if (m === 'g') return q / 1000;
  const pm = p ? num(p.peso_medio) : NaN;
  return isNaN(pm) ? NaN : q * pm;
};
const despDoPeriodo = (us, per) => DB.desperdicios.filter(d => d.status !== 'cancelado' && us.includes(d.unidade) && inPer(d.data_hora, per));

  return Object.values(m).sort((a, b) => b.kg - a.kg);

/* =========================================================
   FATOR DE CORREÇÃO (FC)
   Pré-preparo: peso bruto -> peso líquido, aparas aproveitáveis e perda real.
   ========================================================= */
const DESTINOS_APARAS = ['Caldo ou fundo', 'Bolinho ou recheio', 'Molho', 'Outra preparação', 'Alimentação da equipe', 'Descartado'];
const FC_TOLERANCIA = 5;     // diferença máxima aceita entre bruto e a soma das partes, em %
const FC_MARGEM = 5;         // quanto o FC realizado pode passar do padrão antes de virar desvio

function fcCalc(r) {
  const bruto = num(r.bruto), liquido = num(r.liquido);
  const aparas = isNaN(num(r.aparas)) ? 0 : num(r.aparas);
  const perda = isNaN(num(r.perda)) ? 0 : num(r.perda);
  const descartouAparas = r.destino_aparas === 'Descartado';
  const perdaTotal = perda + (descartouAparas ? aparas : 0);
  const fcReal = (bruto > 0 && liquido > 0) ? +(bruto / liquido).toFixed(3) : null;
  const padrao = num(r.fc_padrao);
  let status = 'sem';
  if (fcReal !== null && !isNaN(padrao) && padrao > 0) {
    if (fcReal <= padrao) status = 'ok';
    else if (fcReal <= padrao * (1 + FC_MARGEM / 100)) status = 'atencao';
    else status = 'acima';
  }
  return {
    bruto, liquido, aparas, perda, perdaTotal, fcReal, padrao: isNaN(padrao) ? null : padrao, status,
    aproveit: bruto > 0 ? +(liquido / bruto * 100).toFixed(1) : null,
    aparasPct: bruto > 0 ? +(aparas / bruto * 100).toFixed(1) : null,
    perdaPct: bruto > 0 ? +(perdaTotal / bruto * 100).toFixed(1) : null,
    desvio: (fcReal !== null && !isNaN(padrao) && padrao > 0) ? +((fcReal / padrao - 1) * 100).toFixed(1) : null,
    diferenca: +(bruto - (liquido + aparas + perda)).toFixed(3)
  };
}
const FC_SIT = { ok: { t: 'Dentro do padrão', c: 'ok' }, atencao: { t: 'No limite', c: 'warn' }, acima: { t: 'Acima do padrão', c: 'bad' }, sem: { t: 'Sem padrão', c: 'mute' } };
const fcDoPeriodo = (us, per) => DB.fc.filter(r => r.status !== 'cancelado' && us.includes(r.unidade) && inPer(r.data_hora, per));
function fcAgrupa(lista, campo) {
  const m = {};
  lista.forEach(r => {
    const k = r[campo] || '—';
    const c = fcCalc(r);
    m[k] = m[k] || { nome: k, n: 0, bruto: 0, liquido: 0, aparas: 0, perda: 0, acima: 0, padroes: [] };
    m[k].n++; m[k].bruto += c.bruto || 0; m[k].liquido += c.liquido || 0;
    m[k].aparas += c.aparas || 0; m[k].perda += c.perdaTotal || 0;
    if (c.status === 'acima') m[k].acima++;
    if (c.padrao) m[k].padroes.push(c.padrao);
  });
  return Object.values(m).map(x => ({
    ...x,
    fcMedio: x.liquido > 0 ? +(x.bruto / x.liquido).toFixed(3) : null,
    padrao: x.padroes.length ? +(x.padroes.reduce((a, b) => a + b, 0) / x.padroes.length).toFixed(3) : null,
    aproveit: x.bruto > 0 ? +(x.liquido / x.bruto * 100).toFixed(1) : null,
    perdaPct: x.bruto > 0 ? +(x.perda / x.bruto * 100).toFixed(1) : null
  })).sort((a, b) => b.bruto - a.bruto);
}

function abrirFC(r) {

  openModal(r ? 'Editar fator de correção' : 'Registrar fator de correção', `<form id="fFC" class="stack" novalidate>
    <div class="grid2">

    </div>
    <div class="grid2">
      <label class="fld"><span>Aparas e subprodutos (kg)</span><input type="text" inputmode="decimal" name="aparas" value="${r ? fmtN(r.aparas).replace(/\./g, '').replace('—', '') : ''}" placeholder="0"></label>
      <label class="fld"><span>Perda real, descarte (kg)</span><input type="text" inputmode="decimal" name="perda" value="${r ? fmtN(r.perda).replace(/\./g, '').replace('—', '') : ''}" placeholder="0"></label>
    </div>
    <label class="fld"><span>Destino das aparas</span><select name="destino_aparas"><option value="">Não houve aparas</option>${opts(DESTINOS_APARAS, r ? r.destino_aparas : '')}</select>
      <span class="hint">Marcando "Descartado", o peso das aparas entra como perda real.</span></label>
    <div id="fcPainel" class="fc-painel"></div>
    <label class="fld"><span>Observação</span><textarea name="obs" placeholder="Ex.: peixe veio com muita nadadeira, limpeza rendeu menos">${r ? esc(r.obs || '') : ''}</textarea></label>
    ${fotoField(r)}
    <label class="fld"><span>Precisa de treinamento ou acompanhamento?</span><select name="treinamento">${opts(['Não', 'Sim'], r ? r.treinamento : 'Não')}</select>
      <span class="hint">O sistema já sugere "Sim" quando o FC passa do padrão. Ajuste se for caso do insumo, e não da técnica.</span></label>
    <div class="err-msg" id="fcErr"></div>
    <div class="actions">
      <button type="submit" class="btn" style="flex:1">${r ? 'Salvar alterações' : 'Registrar'}</button>
      ${r ? '<button type="button" class="btn danger" id="fcDel">Excluir</button>' : ''}
    </div>
  </form>`, root => {
    const fm = $('#fFC', root), f = fm.elements;
    let trocouTreino = !!r;
    f.treinamento.addEventListener('change', () => { trocouTreino = true; });

    const fill = () => {
      const list = prodsDaUnidade(f.unidade.value);
      const cur = r ? r.produto_id : f.produto_id.value;
      f.produto_id.innerHTML = '<option value="">Escolha o produto</option>' + list.map(p => `<option value="${esc(p.id)}" ${p.id === cur ? 'selected' : ''}>${esc(p.nome)}</option>`).join('');
    };
    const padraoDo = () => {
      const p = prodById(f.produto_id.value);
      const v = p ? num(p.fc_padrao) : NaN;
      return isNaN(v) ? null : v;
    };
    const atualizar = () => {
      const padrao = padraoDo();
      $('#fcPadraoHint', root).textContent = padrao ? `FC padrão deste produto: ${fmtN(padrao)}` : 'Este produto ainda não tem FC padrão no cadastro.';
      const c = fcCalc({ bruto: f.bruto.value, liquido: f.liquido.value, aparas: f.aparas.value, perda: f.perda.value, destino_aparas: f.destino_aparas.value, fc_padrao: padrao });
      const painel = $('#fcPainel', root);
      if (c.fcReal === null) { painel.innerHTML = '<div class="fc-vazio">Informe o peso bruto e o peso limpo para calcular.</div>'; return; }
      const difAlta = Math.abs(c.diferenca) > (c.bruto * FC_TOLERANCIA / 100);
      painel.innerHTML = `
        <div class="fc-n"><b>${fmtN(c.fcReal)}</b><span>FC realizado</span></div>
        <div class="fc-n"><b>${fmtN(c.aproveit)}%</b><span>Aproveitamento</span></div>
        <div class="fc-n"><b>${fmtN(c.perdaPct)}%</b><span>Perda real</span></div>
        <div class="fc-st"><span class="pill ${FC_SIT[c.status].c}">${FC_SIT[c.status].t}</span>
          ${c.desvio !== null ? `<small>${c.desvio > 0 ? '+' : ''}${fmtN(c.desvio)}% sobre o padrão ${fmtN(c.padrao)}</small>` : ''}
          ${c.diferenca ? `<small class="${difAlta ? 'fc-alerta' : ''}">Bruto menos as partes: ${fmtN(c.diferenca)} kg</small>` : ''}</div>`;
      if (!trocouTreino) f.treinamento.value = c.status === 'acima' ? 'Sim' : 'Não';
    };
    fill(); atualizar();
    f.unidade.addEventListener('change', () => { fill(); atualizar(); });
    ['produto_id', 'bruto', 'liquido', 'aparas', 'perda', 'destino_aparas'].forEach(n => {
      f[n].addEventListener('input', atualizar);
      f[n].addEventListener('change', atualizar);
    });
    bindFoto(root);
    const del = $('#fcDel', root);
    if (del) del.addEventListener('click', () => {
      if (!confirm('Excluir este registro de fator de correção?')) return;
      save('fc', { id: r.id, status: 'cancelado' });
      closeModal(); toast('Registro excluído');
    });
    fm.addEventListener('submit', ev => {
      ev.preventDefault();
      const err = $('#fcErr', root);
      if (FOTO_BUSY) { err.textContent = 'Aguarde o envio da foto terminar.'; return; }
      const p = prodById(f.produto_id.value);
      if (!p) { err.textContent = 'Escolha o produto.'; return; }
      const bruto = num(f.bruto.value), liquido = num(f.liquido.value);
      const aparas = f.aparas.value.trim() === '' ? 0 : num(f.aparas.value);
      const perda = f.perda.value.trim() === '' ? 0 : num(f.perda.value);
      if (isNaN(bruto) || bruto <= 0) { err.textContent = 'Informe o peso bruto.'; return; }
      if (isNaN(liquido) || liquido <= 0) { err.textContent = 'Informe o peso limpo.'; return; }
      if (liquido > bruto) { err.textContent = 'O peso limpo não pode ser maior que o bruto. Confira a balança.'; return; }
      if (isNaN(aparas) || aparas < 0 || isNaN(perda) || perda < 0) { err.textContent = 'Aparas e perda precisam ser números válidos.'; return; }
      if (aparas > 0 && !f.destino_aparas.value) { err.textContent = 'Informe o destino das aparas.'; return; }
      const dif = bruto - (liquido + aparas + perda);
      if (Math.abs(dif) > bruto * FC_TOLERANCIA / 100) {
        err.textContent = `As partes não fecham com o bruto: sobra ${fmtN(+dif.toFixed(3))} kg. Confira as pesagens antes de salvar.`;
        return;
      }
      const padrao = padraoDo();
      const c = fcCalc({ bruto, liquido, aparas, perda, destino_aparas: f.destino_aparas.value, fc_padrao: padrao });
      const row = {
        id: r ? r.id : uid('fc'), unidade: f.unidade.value, produto_id: p.id, produto_nome: p.nome,
        responsavel: f.responsavel.value, bruto, liquido, aparas, perda,
        destino_aparas: f.destino_aparas.value, fc_padrao: padrao === null ? '' : padrao,
        fc_real: c.fcReal, aproveitamento: c.aproveit, perda_pct: c.perdaPct, situacao: FC_SIT[c.status].t,
        obs: f.obs.value.trim(), evidencia: f.evidencia.value, treinamento: f.treinamento.value, status: 'ativo'
      };
      if (!r) {
        const hora = f.data.value === today() ? nowISO().slice(11) : '12:00:00';
        row.data_hora = `${f.data.value} ${hora}`;
        row.criado_por = USER.nome; row.criado_em = nowISO();
      } else if (String(r.data_hora).slice(0, 10) !== f.data.value) {
        row.data_hora = `${f.data.value} ${String(r.data_hora).slice(11) || '12:00:00'}`;
      }
      save('fc', row, true);
      closeModal(); render();
      toast(c.status === 'acima' ? `FC ${fmtN(c.fcReal)} acima do padrão ${fmtN(c.padrao)}` : `FC ${fmtN(c.fcReal)} registrado`);
    });
  });
}

const ROTULO_SIT = { repor: 'Estoque baixo', atencao: 'Quase no mínimo', ok: 'Estoque ok', semmin: 'Sem mínimo definido' };
function fraseEstoque(p, u, qtd) {
  const sit = situacao(p, u, qtd);
  if (!sit) return { sit: null, cls: 'mute', titulo: '', texto: '' };
  const q = num(qtd), min = minOf(p, u), med = p.medida;
  if (sit === 'semmin') return { sit, cls: 'mute', titulo: ROTULO_SIT[sit], texto: `Temos ${fmtN(q)} ${med}. Este produto ainda não tem mínimo definido.` };
  if (sit === 'repor') return { sit, cls: 'bad', titulo: ROTULO_SIT[sit], texto: `Temos ${fmtN(q)} ${med}. Precisamos manter pelo menos ${fmtN(min)} ${med}. Produzir mais ${fmtN(sugestao(p, u, q))} ${med}.` };
  if (sit === 'atencao') return { sit, cls: 'warn', titulo: ROTULO_SIT[sit], texto: `Temos ${fmtN(q)} ${med}, quase no mínimo de ${fmtN(min)} ${med}. Vale programar produção.` };
  return { sit, cls: 'ok', titulo: ROTULO_SIT[sit], texto: `Temos ${fmtN(q)} ${med}, acima do mínimo de ${fmtN(min)} ${med}.` };
}

      const dias = num(p.dias_validade);
      if (!isNaN(dias)) WZ.validade = addDays(today(), dias);
    }
    corpo = `${itemTopo}<h3 class="wz-titulo">Conferir e salvar</h3>
      <p class="wz-sub">${fmtN(WZ.qtd)} ${esc(p ? p.medida : '')} para ${UN[WZ.unidade] ? UN[WZ.unidade].nome : ''}.</p>
      <label class="fld ${precisaVal ? 'req' : ''}"><span>Validade</span><input type="date" id="wzVal" value="${esc(WZ.validade)}"></label>
      <label class="fld"><span>Observação</span><textarea id="wzObs" placeholder="Opcional">${esc(WZ.obs)}</textarea></label>
      <div class="fld"><span>Foto</span>
        <input type="file" accept="image/*" capture="environment" data-foto>
        <input type="hidden" name="evidencia" value="${esc(WZ.evidencia)}">
        <span class="hint foto-st">Opcional. A foto sobe sozinha quando houver internet.</span></div>`;
  }

  const podeSeguir = nome === 'qtd' ? true : nome === 'produto' ? false : true;
  root.innerHTML = cab + corpo + `<div class="wz-acoes">
    ${WZ.passo > 0 ? '<button type="button" class="btn ghost" data-wz="voltar">Voltar</button>' : ''}
    ${podeSeguir ? `<button type="button" class="btn prim" data-wz="${nome === 'final' ? 'salvar' : 'seguir'}">${nome === 'final' ? 'Confirmar produção' : 'Continuar'}</button>` : ''}
  </div><div class="err-msg" id="wzErr"></div>`;

  const b = $('#wzBusca', root);
  if (b) b.addEventListener('input', () => { WZ.busca = b.value; const pos = b.selectionStart; desenhaWz(); const nb = $('#wzBusca'); nb.focus(); nb.setSelectionRange(pos, pos); });
  const q = $('#wzQtd', root);
  if (q) { q.focus(); q.addEventListener('input', () => { WZ.qtd = num(q.value); }); }
  if (nome === 'final') bindFoto(root);
}
function wzAcao(a, v) {
  if (!WZ) return;
  const passo = () => WZ.passos[WZ.passo];
  if (a === 'produto') { WZ.produto = prodById(v); WZ.qtd = null; WZ.passo++; desenhaWz(); return; }
  if (a === 'destino') { WZ.unidade = v; desenhaWz(); return; }
  if (a === 'local') { WZ.local = v; desenhaWz(); return; }
  if (a === 'voltar') { WZ.passo = Math.max(0, WZ.passo - 1); desenhaWz(); return; }
  if (a === 'menos' || a === 'mais') {
    const inc = num($('#wzPasso').value) || 1;
    const atual = num($('#wzQtd').value);
    const novo = Math.max(0, +(((isNaN(atual) ? 0 : atual) + (a === 'mais' ? inc : -inc)).toFixed(3)));
    WZ.qtd = novo;
    $('#wzQtd').value = fmtN(novo).replace(/\./g, '');
    return;
  }
  if (a === 'seguir') {
    if (passo() === 'qtd') {
      const val = num($('#wzQtd').value);
      if (isNaN(val) || val <= 0) { $('#wzErr').textContent = 'Informe a quantidade produzida.'; return; }
      WZ.qtd = val;
    }
    WZ.passo++; desenhaWz(); return;
  }
  if (a === 'salvar') {
    const p = WZ.produto;
    const val = $('#wzVal').value;
    if (FOTO_BUSY) { $('#wzErr').textContent = 'Aguarde o envio da foto terminar.'; return; }
    if (usaValidade(p) && !val) { $('#wzErr').textContent = 'Este produto precisa de validade.'; return; }
    WZ.validade = val;
    WZ.obs = $('#wzObs').value.trim();
    WZ.evidencia = $('#wz input[name=evidencia]').value;
    localStorage.setItem('cprod_last_local', WZ.local);
    let solVinc = WZ.sol ? WZ.sol.id : '';
    if (!solVinc) {
      const aberta = solAbertaDe(WZ.unidade, p.id);
      if (aberta && confirm(`Existe o pedido ${solNum(aberta)} aberto para ${p.nome}. Marcar como atendido?`)) solVinc = aberta.id;
    }
    const row = {
      id: uid('pr'), data: today(), unidade: WZ.unidade, local: WZ.local, produto_id: p.id, produto_nome: p.nome,
      qtd: WZ.qtd, medida: p.medida, lote: '', validade: WZ.validade, responsavel: USER.nome, ficha_usada: 'Sim',
      obs: WZ.obs, evidencia: WZ.evidencia, solicitacao_id: solVinc, status: 'ativo', criado_por: USER.nome, criado_em: nowISO()
    };
    save('producoes', row, true);
    if (solVinc) save('solicitacoes', { id: solVinc, status: 'Atendida', producao_id: row.id, atendida_em: nowISO() }, true);
    const resumo = `${fmtN(WZ.qtd)} ${p.medida} de ${p.nome} para ${UN[WZ.unidade].nome}`;
    wzFechar(); render();
    openModal('Produção registrada', `<div class="stack" style="text-align:center">
      <div style="font-family:var(--display);font-weight:800;font-size:22px;line-height:1.2">${esc(resumo)}</div>
      <p class="hint" style="margin:0">Registrado por ${esc(USER.nome)} às ${nowISO().slice(11, 16)}.</p>
      <button type="button" class="btn" data-act="close" style="min-height:54px">Pronto</button>
      <button type="button" class="btn ghost" data-act="nova-prod">Registrar outra</button>
    </div>`);
  }
}

    </div>

    <div class="contador">
      <button type="button" data-ctp="menos">−</button>
      <div class="campo-num"><input type="text" inputmode="decimal" id="ctpQtd" data-ct="qtd" value="${esc(d.qtd ?? '')}" placeholder="0"><span class="und">${esc(p.medida)}</span></div>
      <button type="button" data-ctp="mais">+</button>
    </div>
    <div id="ctpFrase">${f.sit ? `<div class="sit-frase ${f.cls}"><b>${f.titulo}</b>${f.texto}</div>` : ''}</div>
    <div id="ctpObs" class="${f.sit === 'repor' || d.obs ? '' : 'hidden'}" style="margin-top:12px">
      <label class="fld ${CFG.OBS_OBRIGATORIA_REPOR ? 'req' : ''}"><span>O que aconteceu?</span>
        <input type="text" data-ct="obs" value="${esc(d.obs || '')}" placeholder="Ex.: saída alta no almoço"></label>
    </div>
  </div>
  <div class="wz-acoes">
    ${CT_IDX > 0 ? '<button type="button" class="btn ghost" data-ctp="anterior">Voltar</button>' : ''}
    <button type="button" class="btn prim" data-ctp="proximo">${CT_IDX + 1 >= total ? 'Revisar e salvar' : 'Próximo item'}</button>
  </div>
  <div class="wz-acoes" style="margin-top:10px">
    <button type="button" class="btn ghost" style="flex:1" data-ctp="pular">Não vou contar este</button>
    ${feitos ? `<button type="button" class="btn dark" data-act="ct-salvar">Salvar agora (${feitos})</button>` : ''}
  </div>`;
}
function ctpAtualiza() {
  const u = CONT_UN;
  const row = $('.card[data-pid]');
  if (!row) return;
  const p = prodById(row.dataset.pid);
  const d = draftOf(u)[p.id] || {};
  const f = fraseEstoque(p, u, d.qtd);
  $('#ctpFrase').innerHTML = f.sit ? `<div class="sit-frase ${f.cls}"><b>${f.titulo}</b>${f.texto}</div>` : '';
  if (f.sit === 'repor') $('#ctpObs').classList.remove('hidden');
}
function ctpAcao(a) {
  const u = CONT_UN;
  const prods = prodsDaUnidade(u).filter(p => !CONT_Q || semAcento(p.nome).toLowerCase().includes(semAcento(CONT_Q).toLowerCase()));
  const p = prods[CT_IDX];
  if (!p) return;
  const dr = draftOf(u);
  if (a === 'menos' || a === 'mais') {
    const inc = ['un', 'bandeja', 'pote', 'porção'].includes(p.medida) ? 1 : 0.5;
    const atual = num($('#ctpQtd').value);
    const novo = Math.max(0, +(((isNaN(atual) ? 0 : atual) + (a === 'mais' ? inc : -inc)).toFixed(3)));
    dr[p.id] = dr[p.id] || {};
    dr[p.id].qtd = fmtN(novo).replace(/\./g, '');
    $('#ctpQtd').value = dr[p.id].qtd;
    ctpAtualiza();
    return;
  }
  if (a === 'pular') { delete dr[p.id]; CT_IDX = Math.min(prods.length - 1, CT_IDX + 1); render(); return; }
  if (a === 'anterior') { CT_IDX = Math.max(0, CT_IDX - 1); render(); return; }
  if (a === 'proximo') {
    const d = dr[p.id] || {};
    if (d.qtd !== '' && d.qtd !== undefined) {
      const sit = situacao(p, u, d.qtd);
      if (CFG.OBS_OBRIGATORIA_REPOR && sit === 'repor' && !String(d.obs || '').trim()) {
        $('#ctpObs').classList.remove('hidden');
        toast('Escreva o que aconteceu com este item.', true);
        return;
      }
    }
    if (CT_IDX + 1 >= prods.length) { salvarContagem(); CT_IDX = 0; return; }
    CT_IDX++; render();
    window.scrollTo(0, 0);
  }
}

/* =========================================================
   RELATÓRIOS
   ========================================================= */
function dadosRelatorio() {
  const per = periodo();
  const us = myUnits().filter(unOk);
  const prods = DB.producoes.filter(r => r.status !== 'cancelado' && us.includes(r.unidade) && inPer(r.data, per))
    .sort((a, b) => String(a.data + a.criado_em).localeCompare(String(b.data + b.criado_em)));
  const conts = DB.contagens.filter(c => c.status !== 'cancelado' && us.includes(c.unidade) && inPer(c.data_hora, per))
    .sort((a, b) => String(a.data_hora).localeCompare(String(b.data_hora)));
  const sols = DB.solicitacoes.filter(s => us.includes(s.unidade) && inPer(s.data_hora, per) && s.status !== 'Cancelada')
    .sort((a, b) => String(a.data_hora).localeCompare(String(b.data_hora)));
  const obs = DB.observacoes.filter(o => o.status !== 'cancelado' && us.includes(o.unidade) && inPer(o.data_hora, per))
    .sort((a, b) => String(a.data_hora).localeCompare(String(b.data_hora)));
  const atend = sols.filter(s => s.status === 'Atendida');
  const tempos = atend.map(s => (new Date(String(s.atendida_em).replace(' ', 'T')) - new Date(String(s.data_hora).replace(' ', 'T'))) / 36e5).filter(h => !isNaN(h) && h >= 0);
  const tMed = tempos.length ? tempos.reduce((a, b) => a + b, 0) / tempos.length : null;

  const porProd = {};
  prods.forEach(r => {
    const k = r.produto_nome + '|' + r.medida;
    porProd[k] = porProd[k] || { nome: r.produto_nome, medida: r.medida, total: 0, n: 0, unidades: new Set() };
    porProd[k].total += num(r.qtd) || 0; porProd[k].n++; porProd[k].unidades.add(r.unidade);
  });
  const pp = Object.values(porProd).sort((a, b) => b.n - a.n || b.total - a.total);
  const maxMed = {}; pp.forEach(x => { maxMed[x.medida] = Math.max(maxMed[x.medida] || 0, x.total); });

  const porResp = {};
  prods.forEach(r => {
    const k = r.responsavel || '—';
    porResp[k] = porResp[k] || { nome: k, n: 0, itens: new Set(), dias: new Set() };
    porResp[k].n++; porResp[k].itens.add(r.produto_nome); porResp[k].dias.add(r.data);
  });
  const pr = Object.values(porResp).sort((a, b) => b.n - a.n);

  const porRepo = {};
  sols.forEach(s => {
    const k = s.produto_nome + '|' + s.unidade;
    porRepo[k] = porRepo[k] || { nome: s.produto_nome, u: s.unidade, n: 0, at: 0, abertos: 0 };
    porRepo[k].n++;
    if (s.status === 'Atendida') porRepo[k].at++;
    if (s.status === 'Aberta' || s.status === 'Em produção') porRepo[k].abertos++;
  });
  const rp = Object.values(porRepo).sort((a, b) => b.n - a.n);

  const est = estoqueAtual(us).sort((a, b) => (b.dias === null ? 9999 : b.dias) - (a.dias === null ? 9999 : a.dias));
  const avaliados = est.filter(e => e.sit === 'ok' || e.sit === 'atencao' || e.sit === 'repor');
  const pct = avaliados.length ? Math.round(avaliados.filter(e => e.sit !== 'repor').length / avaliados.length * 100) : null;

  const desp = despDoPeriodo(us, per).sort((a, b) => String(a.data_hora).localeCompare(String(b.data_hora)));
  const dKg = somaKg(desp);
  const dProd = agrupaDesp(desp, 'produto_nome');
  const dCausa = agrupaDesp(desp, 'causa');
  const dTipo = agrupaDesp(desp, 'tipo');
  const prodKg = {};
  let prodKgTotal = 0;
  prods.forEach(r => {
    const k = kgDe(prodById(r.produto_id), r.qtd, r.medida);
    if (isNaN(k)) return;
    prodKg[r.produto_nome] = (prodKg[r.produto_nome] || 0) + k;
    prodKgTotal += k;
  });
  const pctDesp = prodKgTotal > 0 ? +(dKg / prodKgTotal * 100).toFixed(1) : null;

  const fc = fcDoPeriodo(us, per).sort((a, b) => String(a.data_hora).localeCompare(String(b.data_hora)));
  const fcCalcs = fc.map(r => ({ r, c: fcCalc(r) }));
  const fcBruto = fcCalcs.reduce((a, x) => a + (x.c.bruto || 0), 0);
  const fcLiquido = fcCalcs.reduce((a, x) => a + (x.c.liquido || 0), 0);
  const fcAparas = fcCalcs.reduce((a, x) => a + (x.r.destino_aparas === 'Descartado' ? 0 : x.c.aparas || 0), 0);
  const fcPerda = fcCalcs.reduce((a, x) => a + (x.c.perdaTotal || 0), 0);
  const fcAcima = fcCalcs.filter(x => x.c.status === 'acima').length;
  const fcMedio = fcLiquido > 0 ? +(fcBruto / fcLiquido).toFixed(3) : null;
  const fcAproveit = fcBruto > 0 ? +(fcLiquido / fcBruto * 100).toFixed(1) : null;
  const fcProduto = fcAgrupa(fc, 'produto_nome');
  const fcPessoa = fcAgrupa(fc, 'responsavel');

  const tipos = {};
  obs.forEach(o => {
    tipos[o.tipo] = tipos[o.tipo] || { Baixo: 0, 'Médio': 0, Alto: 0, 'Crítico': 0, total: 0 };
    tipos[o.tipo][o.impacto] = (tipos[o.tipo][o.impacto] || 0) + 1;
    tipos[o.tipo].total++;
  });
  const tp = Object.entries(tipos).sort((a, b) => b[1].total - a[1].total);

  return { per, us, prods, conts, sols, obs, atend, tMed, pp, maxMed, pr, rp, est, avaliados, pct, tp,
    desp, dKg, dProd, dCausa, dTipo, prodKg, prodKgTotal, pctDesp,
    fc, fcCalcs, fcBruto, fcLiquido, fcAparas, fcPerda, fcAcima, fcMedio, fcAproveit, fcProduto, fcPessoa,
    pctAtend: sols.length ? Math.round(atend.length / sols.length * 100) : null };
}

const nomeUnidades = us => us.length === UN_IDS.length ? 'Todas as unidades' : us.map(u => UN[u].nome).join(', ');

const LIBS = {};
function carregarScript(src) {
  if (!LIBS[src]) {
    LIBS[src] = new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = src; s.async = true;
      s.onload = () => res();
      s.onerror = () => { delete LIBS[src]; rej(new Error('Não foi possível carregar ' + src)); };
      document.head.appendChild(s);
    });
  }
  return LIBS[src];
}
const numOuVazio = v => { const n = num(v); return isNaN(n) ? '' : n; };
const nomeArquivo = (R, ext) => `Relatorio_Producao_${R.per[0]}_a_${R.per[1]}.${ext}`;
const situacaoTxt = e => e.sit ? SIT[e.sit].t : 'Sem contagem';
const necessidade = e => {
  const min = minOf(e.p, e.u);
  if (isNaN(min) || !e.c) return '';
  return Math.max(+(min - (num(e.c.qtd) || 0)).toFixed(3), 0);
};

/* ---------- Excel ---------- */
function xlSerial(iso) {
  if (!iso) return '';
  const s = String(iso);
  const [y, m, d] = s.slice(0, 10).split('-').map(Number);
  if (!y || !m || !d) return s;
  let v = (Date.UTC(y, m - 1, d) - Date.UTC(1899, 11, 30)) / 864e5;
  if (s.length > 10) {
    const [hh, mi, ss] = s.slice(11).split(':').map(Number);
    v += ((hh || 0) * 3600 + (mi || 0) * 60 + (ss || 0)) / 86400;
  }
  return v;
}
function xlAba(titulo, subtitulo, cols, linhas, totais) {
  const X = window.XLSX;
  const borda = { style: 'thin', color: { rgb: 'DCE1DA' } };
  const bordas = { top: borda, bottom: borda, left: borda, right: borda };
  const ws = {};
  const n = cols.length;
  const put = (r, c, cell) => { ws[X.utils.encode_cell({ r, c })] = cell; };
  put(0, 0, { v: titulo, t: 's', s: { font: { bold: true, sz: 15, color: { rgb: 'FFFFFF' } }, fill: { fgColor: { rgb: '1E2B33' } }, alignment: { vertical: 'center' } } });
  put(1, 0, { v: subtitulo, t: 's', s: { font: { sz: 10, color: { rgb: '66737C' } } } });
  for (let c = 1; c < n; c++) put(0, c, { v: '', t: 's', s: { fill: { fgColor: { rgb: '1E2B33' } } } });
  cols.forEach((col, c) => put(3, c, {
    v: col.h, t: 's',
    s: { font: { bold: true, color: { rgb: 'FFFFFF' } }, fill: { fgColor: { rgb: '1F7A63' } }, border: bordas,
      alignment: { horizontal: col.t === 'n' || col.t === 'i' ? 'right' : 'left', vertical: 'center', wrapText: true } }
  }));
  linhas.forEach((row, i) => {
    const r = 4 + i;
    const zebra = i % 2 ? { fgColor: { rgb: 'F3F5F1' } } : undefined;
    cols.forEach((col, c) => {
      let v = row[c];
      const s = { border: bordas, alignment: { vertical: 'top', wrapText: col.t === 's' && (col.w || 0) >= 30 } };
      if (zebra) s.fill = zebra;
      if (col.cor) { const rgb = col.cor(v); if (rgb) s.font = { bold: true, color: { rgb } }; }
      let cell;
      if (v === '' || v === null || v === undefined) cell = { v: '', t: 's', s };
      else if (col.t === 'n') cell = { v: Number(v), t: 'n', z: '#,##0.###', s };
      else if (col.t === 'i') cell = { v: Number(v), t: 'n', z: '0', s };
      else if (col.t === 'p') cell = { v: Number(v) / 100, t: 'n', z: '0%', s };
      else if (col.t === 'd' || col.t === 'dt') {
        const ser = xlSerial(v);
        cell = typeof ser === 'number' ? { v: ser, t: 'n', z: col.t === 'd' ? 'dd/mm/yyyy' : 'dd/mm/yyyy hh:mm', s } : { v: String(v), t: 's', s };
      } else cell = { v: String(v), t: 's', s };
      put(r, c, cell);
    });
  });
  let last = 3 + linhas.length;
  if (totais && linhas.length) {
    last++;
    cols.forEach((col, c) => {
      const s = { font: { bold: true }, fill: { fgColor: { rgb: 'E0EFE9' } }, border: bordas };
      const t = totais[c];
      if (t === 'SOMA') {
        const L = X.utils.encode_col(c);
        put(last, c, { t: 'n', f: `SUBTOTAL(9,${L}5:${L}${last})`, z: col.t === 'i' ? '0' : '#,##0.###', s });
      } else put(last, c, { v: t || '', t: 's', s });
    });
  }
  ws['!ref'] = X.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: Math.max(last, 3), c: n - 1 } });
  ws['!merges'] = [{ s: { r: 0, c: 0 }, e: { r: 0, c: n - 1 } }, { s: { r: 1, c: 0 }, e: { r: 1, c: n - 1 } }];
  ws['!cols'] = cols.map(c => ({ wch: c.w || 14 }));
  ws['!rows'] = [{ hpt: 26 }, { hpt: 16 }, { hpt: 6 }, { hpt: 22 }];
  if (linhas.length) ws['!autofilter'] = { ref: X.utils.encode_range({ s: { r: 3, c: 0 }, e: { r: 3 + linhas.length, c: n - 1 } }) };
  return ws;
}

/* ---------- PDF: relatório em HTML enviado para impressão ---------- */
const PDF_TEMA = {
  QF: { dark: '#141416', brand: '#C4161C', soft: '#F8F8F9', zebra: '#FAFAFB', line: '#E3E3E6', text: '#1B1C20', mute: '#6A6D75', logoBg: '#141416', logoPad: '0' },
  ML: { dark: '#3A0C10', brand: '#D8261F', soft: '#FBF6F1', zebra: '#FCFAF8', line: '#E7DED5', text: '#241A17', mute: '#7A6259', logoBg: '#FFFFFF', logoPad: '5px 8px' },
  GG: { dark: '#110F0C', brand: '#8A6629', soft: '#F7F4EE', zebra: '#FBF9F4', line: '#E6DECF', text: '#1D1913', mute: '#756B5C', logoBg: '#110F0C', logoPad: '0' }
};
const pdfPill = sit => {
  const c = { repor: ['#FBE4E1', '#B0281D'], atencao: ['#FBF0D6', '#9A6A05'], ok: ['#E2F1EA', '#1A6E52'], sem: ['#ECEDEF', '#6A6D75'] }[sit] || ['#ECEDEF', '#6A6D75'];
  const t = { repor: 'Repor', atencao: 'Atenção', ok: 'OK', sem: 'Sem contagem' }[sit] || sit;
  return `<span class="pill" style="background:${c[0]};color:${c[1]}">${esc(t)}</span>`;
};
const pdfPillImpacto = i => pdfPill(i === 'Crítico' ? 'repor' : i === 'Alto' ? 'atencao' : 'sem').replace(/>[^<]*<\/span>/, `>${esc(i)}</span>`);
function pdfGaugeSVG(pct) {
  const p = pct === null ? 0 : Math.max(0, Math.min(100, pct));
  const cor = pct === null ? 'rgba(255,255,255,.35)' : p < 60 ? '#E4574A' : p < 85 ? '#E9B23C' : '#3EC49A';
  const ang = Math.PI * (1 - p / 100);
  const x = 60 + 50 * Math.cos(ang), y = 60 - 50 * Math.sin(ang);
  return `<svg viewBox="0 0 120 74" style="width:148px">
    <path d="M10 60 A50 50 0 0 1 110 60" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="16" stroke-linecap="round"/>
    ${p > 0 ? `<path d="M10 60 A50 50 0 0 1 ${x.toFixed(2)} ${y.toFixed(2)}" fill="none" stroke="${cor}" stroke-width="16" stroke-linecap="round"/>` : ''}
  </svg>`;
}
function relatorioHTML(R) {
  const temaId = temaDaUnidade(F.un !== 'todas' ? F.un : (R.us.length === 1 ? R.us[0] : 'todas'));
  const T = PDF_TEMA[temaId], L = TEMAS[temaId];
  const un = u => UN[u] ? UN[u].curto : (u || '');
  const unl = u => UN[u] ? UN[u].nome : (u || '');
  const kpis = [
    [R.prods.length, 'Registros de produção'], [R.conts.length, 'Itens contados'], [R.sols.length, 'Pedidos de produção'],
    [R.pctAtend === null ? '—' : R.pctAtend + '%', 'Pedidos atendidos'], [fmtHoras(R.tMed), 'Tempo médio até atender'],
    [R.obs.length, 'Observações'], [fmtN(+R.dKg.toFixed(3)) + ' kg', 'Descartados no período'],
    [R.pctDesp === null ? '—' : fmtN(R.pctDesp) + '%', 'Descarte sobre a produção']
  ].map(k => `<div class="kpi"><b>${esc(String(k[0]))}</b><span>${k[1]}</span></div>`).join('');

  const criticos = R.est.filter(e => e.sit === 'repor').concat(R.est.filter(e => e.sit === 'atencao'));
  const cards = criticos.slice(0, 8).map(e => {
    const need = necessidade(e);
    return `<div class="alerta ${e.sit}">
      <div class="a-top"><b>${esc(e.p.nome)}</b>${pdfPill(e.sit)}</div>
      <div class="a-mid"><span class="big">${fmtN(e.c.qtd)} ${esc(e.p.medida)}</span><span class="mute">disponível, mínimo ${fmtN(minOf(e.p, e.u))}</span></div>
      <div class="a-bot">${need === '' || need === 0 ? 'Perto do mínimo' : `Produzir ${fmtN(need)} ${esc(e.p.medida)}`} · ${esc(un(e.u))} · contado ${fmtDH(e.c.data_hora)}</div>
    </div>`;
  }).join('');
  const maxUn = {};
  R.pp.forEach(x => { maxUn[x.medida] = Math.max(maxUn[x.medida] || 0, x.total); });
  const prod = R.pp.slice(0, 12).map(x => `<tr><td>${esc(x.nome)}</td>
    <td class="r"><b>${fmtN(x.total)}</b> ${esc(x.medida)}</td><td class="r">${x.n}</td>
    <td style="width:24%"><div class="bar"><i style="width:${maxUn[x.medida] ? Math.round(x.total / maxUn[x.medida] * 100) : 0}%"></i></div></td></tr>`).join('');
  const maxResp = R.pr.length ? R.pr[0].n : 1;
  const resp = R.pr.map(x => `<tr><td>${esc(x.nome)}</td><td class="r">${x.n}</td><td class="r">${x.itens.size}</td><td class="r">${x.dias.size}</td>
    <td style="width:22%"><div class="bar"><i class="alt" style="width:${Math.round(x.n / maxResp * 100)}%"></i></div></td></tr>`).join('');
  const multi = R.us.length > 1;
  const colUn = t => multi ? `<td>${esc(t)}</td>` : '';
  const thUn = multi ? '<th>Unidade</th>' : '';
  const repo = R.rp.slice(0, 10).map(x => `<tr><td>${esc(x.nome)}</td>${colUn(un(x.u))}<td class="r">${x.n}</td><td class="r">${x.at}</td><td class="r">${x.abertos}</td></tr>`).join('');
  const tipos = R.tp.map(([t, v]) => `<tr><td>${esc(t)}</td><td class="r">${v.Baixo || ''}</td><td class="r">${v['Médio'] || ''}</td><td class="r">${v.Alto || ''}</td><td class="r"><b>${v['Crítico'] || ''}</b></td><td class="r"><b>${v.total}</b></td></tr>`).join('');
  const ordemSit = { repor: 0, atencao: 1, semmin: 2, ok: 3 };
  const sit = R.est.slice().sort((a, b) => (ordemSit[a.sit] ?? 4) - (ordemSit[b.sit] ?? 4) || (b.dias === null ? 999 : b.dias) - (a.dias === null ? 999 : a.dias))
    .map(e => `<tr><td>${esc(e.p.nome)}</td>${colUn(un(e.u))}
    <td class="r">${e.c ? fmtN(e.c.qtd) + ' ' + esc(e.p.medida) : '—'}</td><td class="r">${fmtN(minOf(e.p, e.u))}</td>
    <td class="r">${pdfPill(e.sit || 'sem')}</td><td class="r">${e.c ? e.dias : 'nunca'}</td></tr>`).join('');
  const dprod = R.dProd.slice(0, 8).map(x => {
    const pk = R.prodKg[x.nome];
    const idx = pk ? +(x.kg / pk * 100).toFixed(1) : null;
    return `<tr><td>${esc(x.nome)}</td><td class="r"><b>${fmtN(+x.kg.toFixed(3))}</b> kg</td><td class="r">${x.n}</td>
      <td class="r">${pk ? fmtN(+pk.toFixed(1)) + ' kg' : '—'}</td><td class="r">${idx === null ? '—' : fmtN(idx) + '%'}</td></tr>`;
  }).join('');
  const dcausa = R.dCausa.map(x => `<tr><td>${esc(x.nome)}</td><td class="r">${fmtN(+x.kg.toFixed(3))} kg</td><td class="r">${R.dKg ? Math.round(x.kg / R.dKg * 100) : 0}%</td></tr>`).join('');
  const ordemImp = { 'Crítico': 0, Alto: 1, 'Médio': 2, Baixo: 3 };
  const obs = R.obs.slice().sort((a, b) => (ordemImp[a.impacto] ?? 9) - (ordemImp[b.impacto] ?? 9) || String(b.data_hora).localeCompare(String(a.data_hora)))
    .map(o => `<div class="obs"><div class="obs-h">${pdfPillImpacto(o.impacto)}<b>${esc(o.tipo)}</b>${o.produto_nome ? `<span class="mute">${esc(o.produto_nome)}</span>` : ''}<span class="mute dir">${esc(un(o.unidade))} · ${fmtDH(o.data_hora)} · ${esc(o.responsavel)}</span></div><div>${esc(o.descricao)}</div></div>`).join('');
  const vazio = t => `<div class="vazio">${t}</div>`;

  return `<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8">
<title>Relatório de Produção ${fmtD(R.per[0])} a ${fmtD(R.per[1])}</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>

<div class="head">

/* ---------- PDF do desperdício ---------- */
function pdfGaugeDesp(pct) {
  const p = pct === null ? 0 : Math.max(0, Math.min(100, pct));
  const cor = pct === null ? 'rgba(255,255,255,.35)' : p < 5 ? '#3EC49A' : p < 10 ? '#E9B23C' : '#E4574A';
  const esc100 = Math.min(p, 100) / (p > 20 ? 100 : 20) * 100;
  const ang = Math.PI * (1 - esc100 / 100);
  const x = 60 + 50 * Math.cos(ang), y = 60 - 50 * Math.sin(ang);
  return `<svg viewBox="0 0 120 74" style="width:148px">
    <path d="M10 60 A50 50 0 0 1 110 60" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="16" stroke-linecap="round"/>
    ${esc100 > 0 ? `<path d="M10 60 A50 50 0 0 1 ${x.toFixed(2)} ${y.toFixed(2)}" fill="none" stroke="${cor}" stroke-width="16" stroke-linecap="round"/>` : ''}
  </svg>`;
}
function relatorioDespHTML(R) {
  const temaId = temaDaUnidade(F.un !== 'todas' ? F.un : (R.us.length === 1 ? R.us[0] : 'todas'));
  const T = PDF_TEMA[temaId], L = TEMAS[temaId];
  const un = u => UN[u] ? UN[u].curto : (u || '');
  const dias = Math.max(1, daysBetween(R.per[0], R.per[1]) + 1);
  const comFoto = R.desp.filter(d => d.evidencia).length;
  const porDia = {};
  R.desp.forEach(d => { const k = String(d.data_hora).slice(0, 10); porDia[k] = (porDia[k] || 0) + (num(d.kg) || 0); });
  const listaDias = Object.entries(porDia).sort((a, b) => a[0].localeCompare(b[0]));
  const maxDia = listaDias.length ? Math.max(...listaDias.map(d => d[1])) : 1;
  const causaTop = R.dCausa[0];
  const porResp = agrupaDesp(R.desp, 'responsavel');
  const porUn = agrupaDesp(R.desp, 'unidade');
  const causaDoProduto = nome => {
    const c = agrupaDesp(R.desp.filter(d => (d.produto_nome || 'Sem produto informado') === nome), 'causa')[0];
    return c ? c.nome : '—';
  };
  const kpis = [
    [`${fmtN(+R.dKg.toFixed(3))} kg`, 'Descartado no período'],
    [R.pctDesp === null ? '—' : `${fmtN(R.pctDesp)}%`, 'Sobre a produção do período'],

    [R.desp.length, 'Registros de descarte'],
    [causaTop ? causaTop.nome : '—', 'Principal causa'],
    [`${comFoto} de ${R.desp.length}`, 'Registros com foto'],
    [R.fcMedio === null ? '—' : fmtN(R.fcMedio), 'FC médio do pré-preparo'],
    [R.fcAproveit === null ? '—' : `${fmtN(R.fcAproveit)}%`, 'Aproveitamento limpo'],

  ].map(k => `<div class="kpi"><b>${esc(String(k[0]))}</b><span>${k[1]}</span></div>`).join('');

  const fcProdTab = R.fcProduto.map(x => {
    const dv = (x.padrao && x.fcMedio) ? +((x.fcMedio / x.padrao - 1) * 100).toFixed(1) : null;

      <div class="a-mid"><span class="big">${fmtN(+x.kg.toFixed(3))} kg</span><span class="mute">em ${x.n} ${x.n === 1 ? 'registro' : 'registros'}${pk ? `, produzidos ${fmtN(+pk.toFixed(1))} kg` : ''}</span></div>
      <div class="a-bot">Causa mais frequente: ${esc(causaDoProduto(x.nome))}</div>
    </div>`;
  }).join('');

  const tProd = R.dProd.map(x => {
    const pk = R.prodKg[x.nome];
    const idx = pk ? +(x.kg / pk * 100).toFixed(1) : null;
    return `<tr><td>${esc(x.nome)}</td><td class="r"><b>${fmtN(+x.kg.toFixed(3))}</b> kg</td><td class="r">${x.n}</td>
      <td class="r">${pk ? fmtN(+pk.toFixed(1)) + ' kg' : '—'}</td>
      <td class="r">${idx === null ? '—' : `<span class="pill" style="background:${idx >= 10 ? '#FBE4E1' : idx >= 5 ? '#FBF0D6' : '#E2F1EA'};color:${idx >= 10 ? '#B0281D' : idx >= 5 ? '#9A6A05' : '#1A6E52'}">${fmtN(idx)}%</span>`}</td>
      <td>${esc(causaDoProduto(x.nome))}</td></tr>`;
  }).join('');
  const linhaSimples = arr => arr.map(x => `<tr><td>${esc(x.nome)}</td><td class="r">${fmtN(+x.kg.toFixed(3))} kg</td><td class="r">${x.n}</td><td class="r">${R.dKg ? Math.round(x.kg / R.dKg * 100) : 0}%</td>
    <td style="width:22%"><div class="bar"><i style="width:${R.dKg ? Math.round(x.kg / R.dKg * 100) : 0}%"></i></div></td></tr>`).join('');
  const tDia = listaDias.map(([d, kg]) => `<tr><td>${fmtD(d)}</td><td class="r">${fmtN(+kg.toFixed(3))} kg</td>
    <td style="width:60%"><div class="bar"><i style="width:${Math.round(kg / maxDia * 100)}%"></i></div></td></tr>`).join('');
  const tResp = porResp.map(x => `<tr><td>${esc(x.nome)}</td><td class="r">${fmtN(+x.kg.toFixed(3))} kg</td><td class="r">${x.n}</td></tr>`).join('');
  const tUn = porUn.map(x => `<tr><td>${esc(UN[x.nome] ? UN[x.nome].nome : x.nome)}</td><td class="r">${fmtN(+x.kg.toFixed(3))} kg</td><td class="r">${x.n}</td><td class="r">${R.dKg ? Math.round(x.kg / R.dKg * 100) : 0}%</td></tr>`).join('');
  const detalhe = R.desp.slice().reverse().map(d => `<tr><td>${fmtDH(d.data_hora)}</td><td>${esc(un(d.unidade))}</td><td>${esc(d.tipo)}</td>

  const vazio = t => `<div class="vazio">${t}</div>`;

function imprimirHTML(html, nome) {
  const janela = window.open('', '_blank');
  if (janela && janela.document) {
    janela.document.open();
    janela.document.write(html);
    janela.document.close();
    janela.document.title = nome;
    const disparar = () => { try { janela.focus(); janela.print(); } catch (e) { console.warn(e); } };
    if (janela.document.readyState === 'complete') setTimeout(disparar, 700);
    else janela.addEventListener('load', () => setTimeout(disparar, 700));
    return;
  }
  const antigo = $('#quadroImpressao');
  if (antigo) antigo.remove();
  const f = document.createElement('iframe');
  f.id = 'quadroImpressao';
  f.setAttribute('title', nome);
  f.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;opacity:0';
  document.body.appendChild(f);
  f.srcdoc = html;
  f.addEventListener('load', () => setTimeout(() => {
    try { f.contentWindow.focus(); f.contentWindow.print(); }
    catch (e) { console.warn(e); toast('Não foi possível abrir a impressão. Libere as janelas pop-up deste site.', true); }
  }, 700));
}
async function exportarDespPDF() {
  const R = dadosRelatorio();
