/* =========================================================
   NOVA DEMANDA EM ETAPAS
   1 O que aconteceu  2 Classificação  3 Direcionamento  e o resumo
   ========================================================= */
const PASSOS = [
  { t: 'O que aconteceu', s: 'Descreva o problema como ele é visto na operação.' },
  { t: 'Classificação', s: 'Isso define a fila, o farol e quem recebe por padrão.' },
  { t: 'Direcionamento', s: 'Para quem vai a bola e até quando.' },
  { t: 'Confira antes de registrar', s: 'Depois de registrar, o responsável precisa confirmar o recebimento.' }
];
function abrirNovaDemanda(origem) {
  if (!ehGestor()) { toast('Seu acesso não permite registrar demandas.', true); return; }
  const nomes = nomesResponsaveis();
  const cats = catAtivas();
  const o = origem ? origem.r : null;
  const produtos = DB.produtos.filter(p => p.ativo !== 'Não').sort(byNome);
  const prioIni = o && o.impacto === 'Crítico' ? 'Emergencial' : o && o.impacto === 'Alto' ? 'Alta' : 'Normal';
  const titIni = o ? String(o.descricao || [o.tipo, o.produto_nome].filter(Boolean).join(', ')).slice(0, 90) : '';
  const APOIO = new Set();
  let passo = 0;

  const html = `
    <div class="passos" aria-hidden="true">${PASSOS.slice(0, 3).map((_, i) => `<i data-p="${i}"></i>`).join('')}</div>
    <div class="passo-t" id="ndT"></div><div class="passo-s" id="ndS"></div>
    ${o ? `<div class="banner">Vindo ${origem.tipo === 'desperdicio' ? 'de um descarte' : 'de uma observação'} da produção, registrado por ${esc(o.responsavel || '—')} em ${fmtDH(o.data_hora)}.</div>` : ''}
    <form id="fDem" novalidate>
      <div class="stack" data-passo="0">
        <label class="fld req"><span>Título curto</span><input type="text" name="titulo" maxlength="90" value="${esc(titIni)}" placeholder="Ex.: Câmara fria sem resfriamento"></label>
        ${campoTexto('problema', 'Problema identificado', true, 'Em palavras simples: o que está acontecendo.', o ? o.descricao : '')}
        ${o && o.evidencia ? `<div class="fld"><span>Foto do registro de origem</span><div class="thumbs">${fotoHTML(o.evidencia)}</div><input type="hidden" name="evidencia" value="${esc(o.evidencia)}"></div>` : campoFoto()}
        <div class="grid2">
          <label class="fld req"><span>Unidade</span><select name="unidade">${opts(UN_IDS.map(u => ({ v: u, t: UN[u].nome })), o ? o.unidade : (F.un !== 'todas' ? F.un : 'ML'))}</select></label>
          <label class="fld"><span>Setor</span><select name="setor"><option value="">Não se aplica</option>${opts(SETORES, o ? o.setor : '')}</select></label>
        </div>
      </div>
      <div class="stack" data-passo="1" hidden>
        <label class="fld req"><span>Categoria</span><select name="categoria"><option value="">Escolha</option>${opts(cats.map(c => c.nome), '')}</select></label>
        <label class="fld"><span>Produto relacionado</span>
          <input type="text" name="produto" list="ndProdutos" autocomplete="off" placeholder="Escolha da lista ou escreva" value="${esc(o ? o.produto_nome || '' : '')}">
          <datalist id="ndProdutos">${produtos.map(p => `<option value="${esc(p.nome)}"></option>`).join('')}</datalist>
          <span class="hint">Opcional. Pode escrever um item que ainda não está no cadastro.</span></label>
        <div class="grid2">
          <label class="fld req"><span>Prioridade</span><select name="prioridade">${opts(PRIO_IDS, prioIni)}</select>
            <span class="hint">Quando precisa ser resolvido.</span></label>
          <label class="fld"><span>Impacto</span><select name="impacto">${opts(IMPACTOS, o && o.impacto ? o.impacto : 'Médio')}</select>
            <span class="hint">Quão grave é o problema.</span></label>
        </div>
      </div>
      <div class="stack" data-passo="2" hidden>
        <div class="grid2">
          <label class="fld req"><span>Responsável</span><select name="responsavel"><option value="">Escolha</option>${opts(nomes, '')}</select>
            <span class="hint" id="ndSug"></span></label>
          <label class="fld req"><span>Prazo</span><input type="date" name="prazo">
            <span class="hint" id="ndPz"></span></label>
        </div>
        <div class="fld"><span>Pessoas de apoio</span>
          <div class="chips" id="ndChips"></div>
          <div class="pessoas">
            <input type="search" id="ndBuscaP" placeholder="Buscar pessoa" aria-label="Buscar pessoa de apoio">
            <div class="pessoas-l" id="ndLista"></div>
          </div>
        </div>
        ${campoTexto('acao', 'Ação proposta', false, 'Opcional. Se já sabe o caminho, deixe registrado.')}
        <label class="fld"><span>Precisa de investimento, compra ou obra?</span><select name="inv">${opts(['Não', 'Sim'], 'Não')}</select></label>
        <label class="fld" id="ndDecisor" hidden><span>Quem decide</span><input type="text" name="decisor" placeholder="Ex.: Adilson"></label>
      </div>
      <div data-passo="3" hidden><div id="ndResumo"></div></div>
      <div class="err-msg" id="ndErr" style="margin-top:12px"></div>
    </form>`;

  openModal('Nova demanda', html, (body, foot) => {
    const f = $('#fDem', body).elements, err = $('#ndErr', body);
    bindFoto(body);

    /* Responsável sugerido pela categoria, conforme o cadastro. */
    const sugerir = () => {
      const c = cats.find(x => x.nome === f.categoria.value);
      const alvo = c && c.responsavel_padrao && nomes.includes(c.responsavel_padrao) ? c.responsavel_padrao : '';
      if (alvo && !f.responsavel.dataset.mexeu) f.responsavel.value = alvo;
      $('#ndSug', body).textContent = alvo ? `Sugerido pela categoria ${c.nome}.` : '';
    };
    f.categoria.addEventListener('change', sugerir);
    f.responsavel.addEventListener('change', () => { f.responsavel.dataset.mexeu = '1'; desenhaApoio(); });

    /* Prazo sugerido pela prioridade, até a pessoa escolher outro. */
    const sugerirPrazo = () => {
      if (f.prazo.dataset.mexeu) return;
      const dias = (PRIO[f.prioridade.value] || PRIO.Normal).dias;
      f.prazo.value = addDays(today(), dias);
      $('#ndPz', body).textContent = `Sugerido para prioridade ${f.prioridade.value}: ${plural(dias, 'dia')}.`;
    };
    f.prioridade.addEventListener('change', sugerirPrazo);
    f.prazo.addEventListener('change', () => { f.prazo.dataset.mexeu = '1'; $('#ndPz', body).textContent = ''; });
    sugerirPrazo();

    f.inv.addEventListener('change', () => { $('#ndDecisor', body).hidden = f.inv.value !== 'Sim'; });

    /* Pessoas de apoio: busca, caixas de seleção e etiquetas removíveis. */
    const desenhaApoio = () => {
      const q = normal($('#ndBuscaP', body).value);
      APOIO.delete(f.responsavel.value);
      const disponiveis = nomes.filter(n => n !== f.responsavel.value && (!q || normal(n).includes(q)));
      $('#ndLista', body).innerHTML = disponiveis.length
        ? disponiveis.map(n => `<label><input type="checkbox" value="${esc(n)}" ${APOIO.has(n) ? 'checked' : ''}>${esc(n)}</label>`).join('')
        : '<label style="color:var(--mute)">Ninguém com esse nome.</label>';
      $('#ndChips', body).innerHTML = Array.from(APOIO).map(n => `<button type="button" class="chipx" data-tira="${esc(n)}" aria-label="Remover ${esc(n)}">${esc(n)}${ic('x')}</button>`).join('');
    };
    $('#ndBuscaP', body).addEventListener('input', desenhaApoio);
    $('#ndLista', body).addEventListener('change', ev => {
      const cb = ev.target; if (cb.type !== 'checkbox') return;
      if (cb.checked) APOIO.add(cb.value); else APOIO.delete(cb.value);
      desenhaApoio();
    });
    $('#ndChips', body).addEventListener('click', ev => {
      const b = ev.target.closest('[data-tira]'); if (!b) return;
      APOIO.delete(b.dataset.tira); desenhaApoio();
    });
    desenhaApoio();

    const valida = p => {
      if (p === 0) {
        if (!f.titulo.value.trim()) return 'Escreva um título curto.';
        if (!f.problema.value.trim()) return 'Descreva o problema.';
      }
      if (p === 1 && !f.categoria.value) return 'Escolha a categoria.';
      if (p === 2) {
        if (!f.responsavel.value) return 'Escolha o responsável.';
        if (!f.prazo.value) return 'Informe o prazo.';
      }
      return '';
    };
    const montarLinha = () => {
      const row = {
        unidade: f.unidade.value, setor: f.setor.value, categoria: f.categoria.value,
        titulo: f.titulo.value.trim(), problema: f.problema.value.trim(), produto_nome: f.produto.value.trim()
      };
      row.chave_recorrencia = chaveRec(row);
      return row;
    };
    const resumo = () => {
      const r = montarLinha();
      const ant = DB.demandas.filter(x => x.status !== 'cancelada' && (x.chave_recorrencia || chaveRec(x)) === r.chave_recorrencia);
      $('#ndResumo', body).innerHTML = `
        ${ant.length ? `<div class="det-box alerta"><h4>Parece recorrente</h4><p>Um problema parecido já foi registrado ${plural(ant.length, 'vez', 'vezes')}. A última foi ${esc(demNum(ant[ant.length - 1]))}, em ${fmtD(ant[ant.length - 1].data_abertura)}.</p></div>` : ''}
        <dl class="resumo">
          <dt>Título</dt><dd><b>${esc(r.titulo)}</b></dd>
          <dt>Problema</dt><dd>${esc(r.problema)}</dd>
          <dt>Onde</dt><dd>${esc(unNome(r.unidade))}${r.setor ? ', ' + esc(r.setor) : ''}</dd>
          <dt>Categoria</dt><dd>${esc(r.categoria)}</dd>
          ${r.produto_nome ? `<dt>Produto</dt><dd>${esc(r.produto_nome)}</dd>` : ''}
          <dt>Prioridade</dt><dd>${prioPill(f.prioridade.value)}</dd>
          <dt>Impacto</dt><dd>${esc(f.impacto.value)}</dd>
          <dt>Responsável</dt><dd><b>${esc(f.responsavel.value)}</b></dd>
          ${APOIO.size ? `<dt>Apoio</dt><dd>${esc(Array.from(APOIO).join(', '))}</dd>` : ''}
          <dt>Prazo</dt><dd>${fmtD(f.prazo.value)}</dd>
          ${f.acao.value.trim() ? `<dt>Ação proposta</dt><dd>${esc(f.acao.value.trim())}</dd>` : ''}
          ${f.inv.value === 'Sim' ? `<dt>Investimento</dt><dd>Sim${f.decisor.value.trim() ? ', decisão com ' + esc(f.decisor.value.trim()) : ''}</dd>` : ''}
          <dt>Foto</dt><dd>${f.evidencia.value ? 'Anexada' : 'Sem foto'}</dd>
        </dl>`;
    };
    const irPara = p => {
      passo = p;
      $$('[data-passo]', body).forEach(el => { el.hidden = Number(el.dataset.passo) !== p; });
      $$('.passos i', body).forEach((el, i) => el.classList.toggle('on', i <= Math.min(p, 2)));
      $('#ndT', body).textContent = p < 3 ? `Etapa ${p + 1} de 3: ${PASSOS[p].t}` : PASSOS[3].t;
      $('#ndS', body).textContent = PASSOS[p].s;
      if (p === 3) resumo();
      foot.innerHTML = `<div class="linha">
        ${p > 0 ? `<button type="button" class="btn ghost" data-nd="voltar">Voltar</button>` : ''}
        ${p < 3 ? `<button type="button" class="btn" data-nd="seguir">Continuar</button>` : `<button type="button" class="btn" data-nd="salvar">Registrar e direcionar</button>`}
      </div>`;
      err.textContent = '';
      $('.sheet-b', $('#modal')).scrollTop = 0;
    };
    foot.addEventListener('click', ev => {
      const b = ev.target.closest('[data-nd]'); if (!b) return;
      if (b.dataset.nd === 'voltar') { irPara(passo - 1); return; }
      if (FOTO_BUSY) { err.textContent = 'Aguarde a foto terminar de carregar.'; return; }
      const e = valida(passo);
      if (e) { err.textContent = e; return; }
      if (b.dataset.nd === 'seguir') { irPara(passo + 1); return; }
      if (b.dataset.nd === 'salvar') salvar();
    });
    $('#fDem', body).addEventListener('submit', ev => ev.preventDefault());

    const salvar = () => {
      for (let p = 0; p < 3; p++) { const e = valida(p); if (e) { irPara(p); err.textContent = e; return; } }
      const base = montarLinha();
      const id = uid('dem');
      const row = {
        id, numero: '', data_abertura: nowISO(), ...base,
        impacto: f.impacto.value, prioridade: f.prioridade.value, prazo: f.prazo.value,
        responsavel: f.responsavel.value, apoio: Array.from(APOIO).join(', '),
        origem_tipo: origem ? origem.tipo : '', origem_id: o ? o.id : '',
        causa: '', acao: f.acao.value.trim(),
        necessita_investimento: f.inv.value, decisor: f.inv.value === 'Sim' ? f.decisor.value.trim() : '',
        status: 'aceite', solucao: '', evidencia: f.evidencia.value,
        validador_indicado: '', validado_por: '', data_conclusao: '', terceiro: '', aceito_em: '',
        criado_por: USER.nome, criado_em: nowISO()
      };
      const anteriores = DB.demandas.filter(x => x.status !== 'cancelada' && (x.chave_recorrencia || chaveRec(x)) === row.chave_recorrencia);
      if (anteriores.length) row.demanda_mae = anteriores[0].id;
      save('demandas', row, true);
      registrarMov(id, 'abertura', { texto: row.problema, evidencia: row.evidencia });
      registrarMov(id, 'direcionamento', { de: USER.nome, para: row.responsavel, prazo_novo: row.prazo });
      render();
      toast(anteriores.length ? `Registrada. Esse problema já ocorreu ${plural(anteriores.length, 'vez', 'vezes')}.` : 'Demanda registrada e direcionada');
      abrirDemanda(id);
    };
    irPara(0);
  }, { foot: ' ' });
}

/* =========================================================================
   LEITURA DO CÓDIGO DE BARRAS
   Usa o leitor nativo do navegador. Onde ele não existe (iPhone), o campo
   para digitar continua do lado, então ninguém fica travado.
   ========================================================================= */
const temLeitor = () => typeof window !== 'undefined' && 'BarcodeDetector' in window;
let CAM = null;
function pararCamera() {
  if (CAM) { CAM.getTracks().forEach(t => t.stop()); CAM = null; }
}
let LEITURA = null, ZX_CTRL = null;

/* No Chrome do Android o navegador já lê código de barras sozinho. No Safari do
   iPhone não existe esse recurso, então carregamos um leitor pela internet só
   nesse caso, e só quando a pessoa toca em Ler código. Se não der, o campo para
   digitar continua ali do lado. */
const ZXING_URL = 'https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/zxing-browser.min.js';
function carregarLeitorExterno() {
  if (window.ZXingBrowser) return Promise.resolve(window.ZXingBrowser);
  return new Promise((res, rej) => {
    const tag = document.createElement('script');
    tag.src = ZXING_URL;
    tag.onload = () => window.ZXingBrowser ? res(window.ZXingBrowser) : rej(new Error('leitor não disponível'));
    tag.onerror = () => rej(new Error('sem internet para baixar o leitor'));
    document.head.appendChild(tag);
  });
}

async function lerCodigo(aoLer) {
  const box = $('#camBox'), video = $('#camVideo'), err = $('#camErr');
  LEITURA = aoLer;
  box.classList.remove('hidden');
  err.textContent = 'Abrindo a câmera…';

  const entregar = valor => {
    const cb = LEITURA;
    fecharCamera();
    if (cb) cb(String(valor || '').trim());
  };

  try {
    CAM = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    video.srcObject = CAM;
    await video.play();
  } catch (e) {
    err.textContent = 'Não consegui abrir a câmera. Libere a permissão no navegador ou digite o número da placa.';
    return;
  }

  if (temLeitor()) {
    err.textContent = 'Aponte para o código de barras da placa. A leitura é automática.';
    const det = new window.BarcodeDetector({ formats: ['code_128', 'code_39', 'ean_13', 'ean_8', 'qr_code', 'itf'] });
    const tick = async () => {
      if (!CAM || box.classList.contains('hidden')) return;
      try {
        const achou = await det.detect(video);
        if (achou && achou.length) { entregar(achou[0].rawValue); return; }
      } catch (e) { /* quadro ruim, tenta o próximo */ }
      setTimeout(tick, 300);
    };
    tick();
    return;
  }

  /* Caminho do iPhone: leitor carregado na hora. */
  err.textContent = 'Preparando o leitor…';
  let Z;
  try {
    Z = await carregarLeitorExterno();
  } catch (e) {
    err.textContent = 'Este aparelho precisa baixar o leitor e não consegui agora. Feche e digite o número da placa.';
    return;
  }
  try {
    err.textContent = 'Aponte para o código de barras da placa. A leitura é automática.';
    const reader = new Z.BrowserMultiFormatReader();
    ZX_CTRL = await reader.decodeFromVideoElement(video, (result, erro, controls) => {
      if (!ZX_CTRL && controls) ZX_CTRL = controls;
      if (result) entregar(result.getText ? result.getText() : result.text);
    });
  } catch (e) {
    err.textContent = 'Não consegui ler pela câmera neste aparelho. Digite o número da placa.';
  }
}

function fecharCamera() {
  if (ZX_CTRL) { try { ZX_CTRL.stop(); } catch (e) { } ZX_CTRL = null; }
  pararCamera();
  LEITURA = null;
  const v = $('#camVideo'); if (v) v.srcObject = null;
  $('#camBox').classList.add('hidden');
}

    modoEquip(!!ativo || !!pre.equipamento);
    mostrarAtivo();

    /* Digitou o patrimônio: acha na hora, ou oferece cadastrar. */

      const cod = f.patrimonio.value.trim();
      if (!cod) return;

    const sugerirPrazo = () => { if (!f.prazo.dataset.mexeu) f.prazo.value = addDays(today(), prazos[f.prioridade.value] || 7); };
    f.prioridade.addEventListener('change', sugerirPrazo);

    };
    const irPara = p => {
      passo = p;
      $$('[data-passo]', body).forEach(el => { el.hidden = Number(el.dataset.passo) !== p; });
      $$('.passos i', body).forEach((el, i) => el.classList.toggle('on', i <= Math.min(p, 2)));
      $('#chT', body).textContent = p < 3 ? `Etapa ${p + 1} de 3: ${PASSOS_CH[p].t}` : PASSOS_CH[3].t;
      $('#chS', body).textContent = PASSOS_CH[p].s;
      if (p === 3) resumo();
      foot.innerHTML = `<div class="linha">
        ${p > 0 ? '<button type="button" class="btn ghost" data-ch="voltar">Voltar</button>' : ''}
        ${p < 3 ? '<button type="button" class="btn" data-ch="seguir">Continuar</button>' : '<button type="button" class="btn" data-ch="salvar">Abrir chamado</button>'}</div>`;
      err.textContent = '';
      $('#mBody').scrollTop = 0;
    };
    foot.addEventListener('click', ev => {
      const b = ev.target.closest('[data-ch]'); if (!b) return;
      if (b.dataset.ch === 'voltar') { irPara(passo - 1); return; }
      if (FOTO_BUSY) { err.textContent = 'Aguarde a foto terminar de carregar.'; return; }
      const e = valida(passo);
      if (e) { err.textContent = e; return; }
      if (b.dataset.ch === 'seguir') irPara(passo + 1); else salvar();
    });
    $('#fCh', body).addEventListener('submit', ev => ev.preventDefault());

    const salvar = () => {
      for (let p = 0; p < 3; p++) { const e = valida(p); if (e) { irPara(p); err.textContent = e; return; } }
      /* Marca e modelo confirmados na hora ficam gravados no ativo. */
      if (ativo && ativoPendente(ativo) && f.marcaPend) {
        const marca = f.marcaPend.value.trim(), modelo = f.modeloPend.value.trim();
        if (marca || modelo) {
          save('ativos', {
            ativo_id: ativo.ativo_id, marca: marca || ativo.marca, modelo: modelo || ativo.modelo,
            dados_pendentes: (marca && modelo) ? 'Não' : 'Sim', observacao: '',
            atualizado_por: USER.nome, atualizado_em: nowISO()
          }, true);
        }
      }
      const id = uid('ch');
      const gar = ativo ? garantiaVigente(ativo.ativo_id) : null;
      const row = {
        chamado_id: id, numero: '', empresa_id: f.empresa.value, unidade_id: f.unidade.value,
        setor_id: '', local: ehEquip ? (ativo.local || '') : f.local.value.trim(),
        ativo_id: ativo ? ativo.ativo_id : '', codigo_patrimonio: ativo ? ativo.codigo_patrimonio || '' : '',
        natureza: f.natureza.value, especialidade: f.especialidade.value.trim(), modalidade: f.modalidade.value,
        titulo: f.titulo.value.trim(), descricao: f.descricao.value.trim(),
        impacto: f.impacto.value, prioridade: f.prioridade.value,
        status: f.orcamento.value === 'Sim' ? 'Aguardando orçamento' : 'Aguardando aceite',
        aberto_por: USER.nome, aberto_em: nowISO(), responsavel: f.responsavel.value, aceito_em: '',
        necessita_orcamento: f.orcamento.value, orcamento_aprovado_id: '', fornecedor_executante_id: '',
        previsao_conclusao: f.prazo.value, inicio_real: '', conclusao_real: '',
        causa: '', solucao: '', valor_aprovado: '', valor_final: '',
        gerou_garantia: 'Não', garantia_id: '', aberto_com_garantia_ativa: gar ? 'Sim' : 'Não',
        validado_por: '', plano_id: plano ? plano.plano_id : '', origem_id: '', atualizado_em: nowISO()
      };
      save('chamados', row, true);
      evento(id, 'CHAMADO_CRIADO', { ativo_id: row.ativo_id, descricao: row.titulo, para: row.responsavel });
      if (f.evidencia.value) anexar('CHAMADO', id, 'Foto do problema', f.evidencia.value);
      render();
      toast(gar ? 'Chamado aberto. Atenção: equipamento em garantia.' : 'Chamado aberto');
      abrirChamado(id);
    };
    irPara(0);
  }, { foot: ' ' });
}

/* =========================================================================
   CADASTRO DE ATIVO
   ========================================================================= */
function abrirCadastroAtivo(pre, aoSalvar) {
  if (faltamCadastros()) { avisarSemCadastros(); return; }
  pre = pre || {};
  const a = pre.ativo_id ? ativoById(pre.ativo_id) : null;
  const L = lista;
  const campoLista = (nome, rotulo, valor, obrig) => `<label class="fld ${obrig ? 'req' : ''}"><span>${rotulo}</span>
    <input type="text" name="${nome}" list="l_${nome}" autocomplete="off" value="${esc(valor || '')}">
    <datalist id="l_${nome}">${L(nome === 'categoria' ? 'categoria_ativo' : nome === 'subcategoria' ? 'subcategoria_ativo' : nome).map(v => `<option value="${esc(v)}"></option>`).join('')}</datalist>
    <span class="hint">Escolha da lista ou escreva um valor novo.</span></label>`;
  openModal(a ? 'Editar ativo' : 'Novo ativo', `<form id="fAt" class="stack" novalidate>
    <label class="fld req"><span>Nome do equipamento</span><input type="text" name="nome" value="${esc(a ? a.nome : '')}" placeholder="Ex.: Freezer horizontal 500L"></label>
    <div class="fld"><span>Tem placa de patrimônio?</span>
      <div class="linha-busca">
        <input type="text" name="patrimonio" inputmode="numeric" value="${esc(a ? a.codigo_patrimonio : pre.patrimonio || '')}" placeholder="Número da placa" ${podePatrimonio() ? '' : 'disabled'}>
        ${podePatrimonio() ? `<button type="button" class="btn ghost" data-act="ler-codigo" data-destino="cadastro">${ic('codigo')}Ler</button>` : ''}
      </div>
      <span class="hint">${podePatrimonio() ? 'Deixe vazio se o equipamento ainda não tem plaqueta.' : 'Só quem tem liberação pode vincular placa. Cadastre sem, e peça para vincularem depois.'}</span>
    </div>
    <div class="grid2">
      <label class="fld req"><span>Empresa</span><select name="empresa">${opts(empresas().map(e => ({ v: e.empresa_id, t: e.nome })), a ? a.empresa_id : pre.empresa)}</select></label>
      <label class="fld req"><span>Unidade</span><select name="unidade"></select></label>
    </div>
    ${campoLista('local', 'Local', a ? a.local : '')}
    <div class="grid2">${campoLista('categoria', 'Categoria', a ? a.categoria : '', true)}${campoLista('subcategoria', 'Tipo', a ? a.subcategoria : '')}</div>
    <div class="grid2">${campoLista('marca', 'Marca', a ? a.marca : '')}
      <label class="fld"><span>Modelo</span><input type="text" name="modelo" value="${esc(a ? a.modelo : '')}"></label></div>
    <div class="grid2">
      <label class="fld"><span>Número de série</span><input type="text" name="serie" value="${esc(a ? a.numero_serie : '')}"></label>
      <label class="fld"><span>Voltagem</span><select name="voltagem">${opts(L('voltagem'), a ? a.voltagem : 'Não possui')}</select></label>
    </div>
    <div class="grid2">
      <label class="fld"><span>Valor de aquisição</span><input type="text" name="valor" inputmode="decimal" value="${esc(a ? a.valor_aquisicao : '')}" placeholder="Ex.: 5200,00"></label>
      <label class="fld"><span>Criticidade</span><select name="criticidade">${opts(L('criticidade'), a ? a.criticidade : 'Média')}</select></label>
    </div>
    ${campoFoto()}
    <div class="err-msg" id="atErr"></div>
  </form>`, (body, foot) => {
    const f = $('#fAt', body).elements, err = $('#atErr', body);
    bindFoto(body);
    const encher = () => {
      const unis = unidadesDe(f.empresa.value);
      f.unidade.innerHTML = opts(unis.map(u => ({ v: u.unidade_id, t: u.nome })), a ? a.unidade_id : pre.unidade);
    };
    f.empresa.addEventListener('change', encher); encher();
    window.__lerCodigoNoCadastro = v => { f.patrimonio.value = v; };
    $('[data-f-acao=ok]', foot).addEventListener('click', () => {
      const nome = f.nome.value.trim();
      if (!nome) { err.textContent = 'Informe o nome do equipamento.'; return; }
      if (!f.categoria.value.trim()) { err.textContent = 'Informe a categoria.'; return; }
      const cod = podePatrimonio() ? f.patrimonio.value.trim() : (a ? a.codigo_patrimonio : '');
      if (cod) {
        const outro = ativoPorPatrimonio(cod);
        if (outro && (!a || outro.ativo_id !== a.ativo_id)) { err.textContent = `Patrimônio ${cod} já está em ${outro.nome}.`; return; }
      }
      const id = a ? a.ativo_id : uid('at');
      const marca = f.marca.value.trim(), modelo = f.modelo.value.trim();
      const row = {
        ativo_id: id, codigo_patrimonio: cod, tem_placa: cod ? 'Sim' : 'Não',
        empresa_id: f.empresa.value, unidade_id: f.unidade.value, setor_id: '', local: f.local.value.trim(),
        categoria: f.categoria.value.trim(), subcategoria: f.subcategoria.value.trim(), nome: nome,
        marca: marca, modelo: modelo, numero_serie: f.serie.value.trim(), voltagem: f.voltagem.value,
        valor_aquisicao: f.valor.value.trim(), criticidade: f.criticidade.value,
        status: a ? a.status : 'Em operação',
        dados_pendentes: (marca && f.subcategoria.value.trim()) ? 'Não' : 'Sim',
        atualizado_por: USER.nome, atualizado_em: nowISO()
      };
      if (!a) { row.criado_por = USER.nome; row.criado_em = nowISO(); row.destinacao = 'Não Movimentar'; }
      /* Quem vinculou a placa fica registrado: é informação de patrimônio. */
      if (cod && (!a || a.codigo_patrimonio !== cod)) { row.placa_registrada_por = USER.nome; row.placa_registrada_em = nowISO(); }
      save('ativos', row, true);
      if (f.evidencia.value) anexar('ATIVO', id, 'Foto do item', f.evidencia.value);
      evento('', a ? 'ATIVO_ALTERADO' : 'ATIVO_CADASTRADO', { ativo_id: id, descricao: nome });
      closeModal();
      toast(a ? 'Ativo atualizado' : 'Ativo cadastrado');
      if (aoSalvar) aoSalvar(row); else abrirAtivo(id);
    });
  }, { foot: `<button type="button" class="btn block" data-f-acao="ok">${a ? 'Salvar alterações' : 'Cadastrar ativo'}</button>` });
}

/* =========================================================================
   DETALHE DO CHAMADO
   ========================================================================= */
function abrirChamado(id) {
  const c = chById(id);
  if (!c) { toast('Chamado não encontrado.', true); return; }
  const a = c.ativo_id ? ativoById(c.ativo_id) : null;
  const evs = eventosDo(id).slice().reverse();
  const rotulo = { CHAMADO_CRIADO: 'Chamado aberto', ACEITE: 'Recebimento confirmado', COMENTARIO: 'Comentário', STATUS_ALTERADO: 'Situação alterada', SERVICO_CONCLUIDO: 'Serviço concluído', GARANTIA_REGISTRADA: 'Garantia registrada', CHAMADO_CANCELADO: 'Chamado cancelado' };
  const html = `
    <div class="det-cab">
      <h2>${esc(c.titulo)}</h2>
      <div class="dem-sts">${chPill(c.status)}
        <span class="st ${c.prioridade === 'Emergencial' ? 'urg' : 'mute'}">${ic('alerta')}${esc(c.prioridade)}</span>
        ${chAtrasado(c) ? `<span class="st bad">${ic('relogio')}Atrasado</span>` : ''}
        ${c.aberto_com_garantia_ativa === 'Sim' ? `<span class="st warn">${ic('escudo')}Aberto com garantia vigente</span>` : ''}</div>
    </div>
    <div class="det-box"><h4>O que está acontecendo</h4><p>${esc(c.descricao || '—')}</p></div>
    ${a ? `<div class="ativo-sel click" data-act="abrir-ativo" data-id="${esc(a.ativo_id)}" role="button" tabindex="0">
      <span class="ativo-foto">${ic('caixa', 'lg')}</span>
      <div><b>${esc(a.nome)}</b><small>${esc(a.codigo_patrimonio ? 'Patrimônio ' + a.codigo_patrimonio : 'Sem placa')}${a.marca ? ', ' + esc(a.marca) : ''}</small></div>${ic('chev')}</div>` : ''}
    ${miniaturas('CHAMADO', id)}
    <dl class="det-kv">
      <dt>Onde</dt><dd>${esc(nomeEmp(c.empresa_id))}, ${esc(nomeUni(c.unidade_id))}${c.local ? ', ' + esc(c.local) : ''}</dd>
      <dt>Classificação</dt><dd>${esc(c.natureza || '—')}, ${esc(c.especialidade || '—')}, ${esc(c.modalidade || '—')}</dd>
      <dt>Responsável</dt><dd><b>${esc(c.responsavel || '—')}</b>${c.aceito_em ? `<br><span class="hint">Confirmou em ${fmtDH(c.aceito_em)}</span>` : c.status === 'Aguardando aceite' ? '<br><span class="hint">Ainda não confirmou o recebimento</span>' : ''}</dd>
      <dt>Prazo</dt><dd>${c.previsao_conclusao ? fmtD(c.previsao_conclusao) : 'Sem prazo'}</dd>
      ${c.plano_id ? `<dt>Preventiva</dt><dd>${esc((planoById(c.plano_id) || {}).nome || c.plano_id)}</dd>` : ''}
      ${c.solucao ? `<dt>Solução</dt><dd>${esc(c.solucao)}</dd>` : ''}
      ${c.valor_final ? `<dt>Valor</dt><dd>${esc(dinheiro(c.valor_final))}</dd>` : ''}
      <dt>Aberto por</dt><dd>${esc(c.aberto_por || '—')} em ${fmtDH(c.aberto_em)}</dd>
    </dl>
    <div class="det-sec">Linha do tempo</div>
    ${evs.length ? `<div class="tl">${evs.map(e => `<div class="tl-item ${e.tipo_evento === 'SERVICO_CONCLUIDO' ? 'ok' : e.tipo_evento === 'CHAMADO_CANCELADO' ? 'bad' : ''}">
      <div class="tl-h">${fmtDH(e.data_hora)}</div>
      <div class="tl-b">${esc(rotulo[e.tipo_evento] || e.tipo_evento)} por ${esc(e.usuario || '—')}</div>
      ${e.para ? `<div class="tl-de">Para <b>${esc(e.para)}</b></div>` : ''}
      ${e.descricao ? `<div class="tl-t">${esc(e.descricao)}</div>` : ''}
      ${e.valor ? `<div class="tl-x">${esc(dinheiro(e.valor))}</div>` : ''}</div>`).join('')}</div>`
      : '<div class="empty">Sem movimentos ainda.</div>'}`;

  const podeMexerCh = souEu(c.responsavel) || ehGestor();
  const b = [];
  if (c.status === 'Aguardando aceite' && podeMexerCh) b.push(['ch-aceitar', 'Aceitar', 'jade']);
  if (chAberto(c.status) && c.status !== 'Aguardando aceite' && podeMexerCh) b.push(['ch-atualizar', 'Atualizar', 'ghost']);
  if (chAberto(c.status) && podeMexerCh) b.push(['ch-concluir', 'Concluir', 'red']);
  if (!b.length) b.push(['ch-comentar', 'Comentar', 'ghost']);
  const rodape = `<div class="linha">${b.map(([act, t, cls]) => `<button type="button" class="btn ${cls}" data-act="${act}" data-id="${esc(id)}">${t}</button>`).join('')}</div>`;
  openModal(chNum(c), html, null, { full: true, foot: rodape });
}

/* ---------- Ações do chamado ---------- */
function mudarCh(c, novo, tipo, patch, texto) {
  save('chamados', Object.assign({ chamado_id: c.chamado_id, status: novo, atualizado_em: nowISO() }, patch || {}), true);
  evento(c.chamado_id, tipo, { ativo_id: c.ativo_id, descricao: texto || '' });
  render();
  abrirChamado(c.chamado_id);
}
function chAceitar(id) {
  const c = chById(id); if (!c) return;
  mudarCh(c, 'Em análise', 'ACEITE', { aceito_em: nowISO(), inicio_real: nowISO() }, 'Recebimento confirmado');
  toast('Recebimento confirmado');
}
function chComentar(id) {
  const c = chById(id); if (!c) return;
  formSimples('Comentar', `${campoTexto('texto', 'Comentário', true)}${campoFoto()}`, f => {
    const t = f.texto.value.trim();
    if (!t) return 'Escreva o comentário.';
    evento(id, 'COMENTARIO', { ativo_id: c.ativo_id, descricao: t });
    if (f.evidencia.value) anexar('CHAMADO', id, 'Foto do problema', f.evidencia.value);
    render(); abrirChamado(id); toast('Comentário registrado');
  }, 'Registrar comentário');
}
function chAtualizar(id) {
  const c = chById(id); if (!c) return;
  const L = lista;
  formSimples('Atualizar chamado', `
    ${campoTexto('texto', 'O que foi feito', true, 'Mesmo que parcial. Ajuda quem continuar depois.')}
    <label class="fld"><span>Situação</span><select name="status">${opts(L('status_chamado').filter(s => s !== 'Concluída' && s !== 'Cancelada'), c.status)}</select></label>
    ${campoFoto()}`, f => {
    const t = f.texto.value.trim();
    if (!t) return 'Descreva o que foi feito.';
    if (f.evidencia.value) anexar('CHAMADO', id, 'Foto do problema', f.evidencia.value);
    mudarCh(c, f.status.value, f.status.value !== c.status ? 'STATUS_ALTERADO' : 'COMENTARIO', {}, t);
    toast('Atualização registrada');
  }, 'Registrar');
}
function chConcluir(id) {
  const c = chById(id); if (!c) return;
  formSimples('Concluir chamado', `
    ${campoTexto('solucao', 'Solução aplicada', true, 'É isso que aparece no histórico do equipamento.')}
    <div class="grid2">
      <label class="fld"><span>Valor gasto</span><input type="text" name="valor" inputmode="decimal" placeholder="Ex.: 850,00"></label>
      <label class="fld"><span>Garantia do serviço (dias)</span><input type="number" name="garantia" min="0" placeholder="0"></label>
    </div>
    ${campoFoto()}`, f => {
    const s = f.solucao.value.trim();
    if (!s) return 'Descreva a solução aplicada.';
    const dias = Number(f.garantia.value) || 0;
    const patch = { solucao: s, conclusao_real: nowISO(), valor_final: f.valor.value.trim() };
    if (dias && c.ativo_id) {
      const gid = uid('gar');
      const fim = addDays(today(), dias);
      save('garantias', {
        garantia_id: gid, chamado_id: id, ativo_id: c.ativo_id, fornecedor_id: c.fornecedor_executante_id || '',
        tipo: 'Serviço', inicio: today(), fim: fim, dias: String(dias),
        descricao: s, status: 'Vigente', acionada_em: '', chamado_acionamento_id: ''
      }, true);
      patch.gerou_garantia = 'Sim'; patch.garantia_id = gid;
      evento(id, 'GARANTIA_REGISTRADA', { ativo_id: c.ativo_id, descricao: `Garantia de ${plural(dias, 'dia')}, até ${fmtD(fim)}` });
    }
    if (f.evidencia.value) anexar('CHAMADO', id, 'Foto da peça', f.evidencia.value);
    mudarCh(c, 'Concluída', 'SERVICO_CONCLUIDO', patch, s);
    toast(dias ? `Concluído. Garantia registrada por ${plural(dias, 'dia')}.` : 'Chamado concluído');
  }, 'Concluir', 'jade');
}
/* Abrir o chamado de uma preventiva: já vem preenchido pelo plano. */
function abrirPreventiva(planoId) {
  const p = planoById(planoId);
  if (!p) { toast('Plano não encontrado.', true); return; }
  abrirNovoChamado({ plano: planoId, ativo: p.ativo_id || '', equipamento: !!p.ativo_id });
}

/* =========================================================
   FOTOS: guarda no aparelho e envia quando houver internet
   ========================================================= */
const FOTO_DB = 'gt_fotos';
let FOTO_FLUSH = false;
function idb() {
  return new Promise((res, rej) => {
    const req = indexedDB.open(FOTO_DB, 1);
    req.onupgradeneeded = () => { if (!req.result.objectStoreNames.contains('fotos')) req.result.createObjectStore('fotos', { keyPath: 'id' }); };
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}
function idbOp(modo, fn) {
  return idb().then(db => new Promise((res, rej) => {
    const tx = db.transaction('fotos', modo);
    const r = fn(tx.objectStore('fotos'));
    tx.oncomplete = () => res(r && r.result !== undefined ? r.result : r);
    tx.onerror = () => rej(tx.error);
  }));
}
const fotoGuardar = f => idbOp('readwrite', st => st.put(f));
const fotoLer = id => idbOp('readonly', st => st.get(id));
const fotoApagar = id => idbOp('readwrite', st => st.delete(id));
const fotoTodas = () => idbOp('readonly', st => st.getAll());

const fotoPendente = v => String(v || '').startsWith('pendente:');
/* Miniatura a partir do link do Drive. Toque abre em tela cheia. */
const driveId = v => { const m = String(v || '').match(/\/d\/([^/?#]+)/) || String(v || '').match(/[?&]id=([^&#]+)/); return m ? m[1] : ''; };
function fotoHTML(v) {
  if (!v) return '';
  if (fotoPendente(v)) return `<span class="st warn">${ic('camera')}Foto guardada, aguardando internet</span>`;
  const id = driveId(v);
  if (!id) return `<a href="${esc(v)}" target="_blank" rel="noopener">Ver foto</a>`;
  return `<button type="button" class="thumb" data-act="foto" data-url="${esc(v)}" data-id="${esc(id)}" aria-label="Ver foto em tela cheia"><img src="https://drive.google.com/thumbnail?id=${esc(id)}&sz=w400" alt="" loading="lazy" onerror="this.replaceWith(document.createTextNode('Ver foto'))"></button>`;
}
function abrirFoto(url, id) {
  $('#lbImg').src = `https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w2000`;
  $('#lbLink').href = url;
  $('#lightbox').classList.remove('hidden');
}
const fecharFoto = () => { $('#lightbox').classList.add('hidden'); $('#lbImg').removeAttribute('src'); };

const CAMPOS_FOTO = [['demandas', 'evidencia'], ['demandas', 'evidencia_solucao'], ['andamento', 'evidencia']];
const fotosNaFila = () => CAMPOS_FOTO.reduce((n, [t, c]) => n + DB[t].filter(r => r.status !== 'cancelado' && fotoPendente(r[c])).length, 0);

async function compressImg(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const max = 1280, s = Math.min(1, max / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.72);
  } finally { URL.revokeObjectURL(url); }
}
async function enviarFoto(foto) {
  const r = await api({ action: 'upload', name: foto.nome, mime: 'image/jpeg', data: foto.data.split(',')[1] });
  if (!r || !r.ok) throw new Error((r && r.error) || 'Falha no envio da foto');
  return r.url;
}
function bindFoto(root) {
  const inp = $('[data-foto]', root);
  if (!inp) return;
  inp.addEventListener('change', async () => {
    const file = inp.files[0];
    if (!file) return;
    const out = $('input[name=evidencia]', root), st = $('.foto-st', root);
    FOTO_BUSY = true;
    st.textContent = 'Preparando a foto…';
    try {
      const data = await compressImg(file);
      const id = uid('ft');
      const nome = `${today()}_${USER.nome.replace(/[^\w]+/g, '_')}_${Date.now()}.jpg`;
      await fotoGuardar({ id, data, nome, criado_em: nowISO() });
      out.value = 'pendente:' + id;
      st.textContent = 'Foto guardada no aparelho.';
      if (CFG.GAS_URL && navigator.onLine) {
        st.textContent = 'Enviando foto…';
        try {
          const url = await enviarFoto({ data, nome });
          await fotoApagar(id);
          out.value = url;
          st.textContent = 'Foto anexada.';
        } catch (e) {
          console.warn(e);
          st.textContent = 'Sem internet agora. A foto fica guardada e sobe sozinha depois.';
        }
      }
    } catch (e) {
      console.warn(e);
      st.textContent = 'Não foi possível ler a foto. Tire de novo.';
      inp.value = '';
    } finally { FOTO_BUSY = false; }
  });
}
async function flushFotos() {
  if (!CFG.GAS_URL || FOTO_FLUSH || !navigator.onLine) return;
  const pendentes = [];
  CAMPOS_FOTO.forEach(([t, c]) => DB[t].forEach(r => { if (r.status !== 'cancelado' && fotoPendente(r[c])) pendentes.push({ tab: t, row: r, campo: c }); }));
  if (!pendentes.length) { limparFotosOrfas(); return; }
  FOTO_FLUSH = true;
  let enviadas = 0;
  try {
    for (const { tab, row, campo } of pendentes.slice(0, 5)) {
      const id = String(row[campo]).slice(9);
      const foto = await fotoLer(id);
      if (!foto) { save(tab, { id: row.id, [campo]: '' }, true); continue; }
      const url = await enviarFoto(foto);
      save(tab, { id: row.id, [campo]: url }, true);
      await fotoApagar(id);
      enviadas++;
    }
  } catch (e) {
    console.warn('Envio de foto adiado', e);
  } finally { FOTO_FLUSH = false; }
  if (enviadas) {
    persist();
    if (!modalAberto() && !isTyping()) render();
    if (fotosNaFila()) setTimeout(flushFotos, 2000);
  }
}
async function limparFotosOrfas() {
  try {
    const usadas = new Set();
    CAMPOS_FOTO.forEach(([t, c]) => DB[t].forEach(r => { if (fotoPendente(r[c])) usadas.add(String(r[c]).slice(9)); }));
    const limite = Date.now() - 48 * 3600e3;
    for (const f of await fotoTodas()) {
      if (usadas.has(f.id)) continue;
      if (new Date(String(f.criado_em).replace(' ', 'T')).getTime() < limite) await fotoApagar(f.id);
    }
  } catch (e) { /* silencioso */ }
}
function iniciarFotos() {
  flushFotos();
  setInterval(() => { if (!document.hidden) flushFotos(); }, 60000);
  window.addEventListener('online', () => setTimeout(flushFotos, 1500));
}

/* =========================================================
   ATUALIZAÇÃO AUTOMÁTICA DO SISTEMA
   ========================================================= */
let VERSAO_ASSINATURA = null, NOVA_VERSAO = false, ULTIMO_TOQUE = Date.now(), CHECANDO = false;
const hashTexto = t => { let h = 5381; for (let i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) | 0; return String(h); };
const trabalhoEmAndamento = () => modalAberto() || isTyping() || OUTBOX.length > 0;
const recarregar = () => location.replace(location.pathname + '?v=' + Date.now() + location.hash);
function avisarNovaVersao() {
  if ($('#avisoVersao')) return;
  const el = document.createElement('div');
  el.id = 'avisoVersao';
  el.className = 'aviso-versao';
  el.innerHTML = '<span>Nova versão disponível</span><button type="button" data-act="atualizar">Atualizar agora</button>';
  document.body.appendChild(el);
}
async function checarVersao() {
  if (CHECANDO) return;
  CHECANDO = true;
  try {
    const url = location.pathname + '?checagem=' + Date.now();
    let assinatura = null;
    try {
      const h = await fetch(url, { method: 'HEAD', cache: 'no-store' });
      if (h.ok) assinatura = h.headers.get('etag') || h.headers.get('last-modified');
    } catch (e) { /* alguns servidores não respondem HEAD */ }
    if (!assinatura) {
      const r = await fetch(url, { cache: 'no-store' });
      if (!r.ok) return;
      const t = await r.text();
      assinatura = t.length + ':' + hashTexto(t);
    }
    if (!VERSAO_ASSINATURA) { VERSAO_ASSINATURA = assinatura; return; }
    if (assinatura !== VERSAO_ASSINATURA) {
      NOVA_VERSAO = true;
      avisarNovaVersao();
      if (!trabalhoEmAndamento() && Date.now() - ULTIMO_TOQUE > CFG.OCIOSO_MS) recarregar();
    }
  } catch (e) {
    console.warn('Checagem de versão falhou', e);
  } finally { CHECANDO = false; }
}
function iniciarChecagemVersao() {
  checarVersao();
  setInterval(() => { if (!document.hidden) checarVersao(); }, CFG.VERSAO_MS);
  setInterval(() => { if (NOVA_VERSAO && !document.hidden && !trabalhoEmAndamento() && Date.now() - ULTIMO_TOQUE > CFG.OCIOSO_MS) recarregar(); }, 20000);
  ['pointerdown', 'keydown', 'touchstart'].forEach(ev => document.addEventListener(ev, () => { ULTIMO_TOQUE = Date.now(); }, { passive: true }));
}

const VIEWS = {

  inicio: vInicio, chamados: vChamados, ativos: vAtivos, preventivas: vPreventivas, cadastros: vCadastrosNovo,
  /* Módulo de demandas, que continua como estava */
  hoje: vHoje, minhas: vMinhas, todas: vTodas, entrada: vEntrada, recorrencias: vRecorrencias,
  relatorios: vRelatorios, demandas: vDemandas, mais: vMais
};
const irPara = v => { VIEW = v; if (modalAberto()) closeModal(); else render(); window.scrollTo(0, 0); };
const ACOES_DEM = {
  aceitar: aceitarJa, comentar: acaoComentar, acao: acaoAtualizar, transferir: acaoTransferir,
  bloquear: acaoBloquear, desbloquear: acaoDesbloquear, prazo: acaoPrazo, concluir: acaoConcluir,
  validar: acaoValidar, devolver: acaoDevolver, reabrir: acaoReabrir, cancelar: acaoCancelar
};

document.addEventListener('click', ev => {
  /* Menu da conta fecha ao clicar fora dele */
  const conta = $('#conta');
  if (!conta.classList.contains('hidden') && !ev.target.closest('#conta') && !ev.target.closest('[data-act=conta]')) conta.classList.add('hidden');
  if (ev.target.closest('#conta [data-act], #conta [data-view]')) conta.classList.add('hidden');
  if (ev.target === $('#modal')) { closeModal(); return; }
  if (ev.target === $('#lightbox')) { fecharFoto(); return; }
  /* Ações têm prioridade sobre navegação: um botão dentro de um cartão
     não deve abrir o cartão. */
  const el = ev.target.closest('[data-act]');
  const nv = ev.target.closest('[data-view]');
  const acaoDentroDaNav = el && nv && nv !== el && nv.contains(el);
  if (nv && !acaoDentroDaNav) { irPara(nv.dataset.view); return; }
  if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  if (a.startsWith('dem-') && ACOES_DEM[a.slice(4)]) { ev.stopPropagation(); ACOES_DEM[a.slice(4)](id); return; }
  switch (a) {
    case 'menu': ev.preventDefault(); window.location.href = CFG.MENU_URL; break;
    case 'logout': window.location.href = CFG.MENU_URL; break;
    case 'atualizar': recarregar(); break;
    case 'close': closeModal(); break;
    case 'goto': irPara(el.dataset.v); break;
    case 'unidade': F.un = el.dataset.u; render(); break;
    case 'periodo': F.per = el.dataset.p; render(); break;
    case 'ir-todas':
      Object.assign(F, { st: el.dataset.st || 'abertas', prio: el.dataset.prio || 'todas', resp: el.dataset.meu ? USER.nome : 'todos', q: '' });
      if (el.dataset.un) F.un = el.dataset.un;
      if (F.st === 'concluidas' && F.per === 'hoje') F.per = 'semana';
      irPara('todas'); break;
    case 'filtrar': abrirFiltros(); break;
    case 'tira-filtro': {
      const k = el.dataset.k;
      F[k] = VAZIO_FILTRO[k];
      render(); break;
    }
    case 'limpa-filtros': Object.assign(F, VAZIO_FILTRO); render(); break;
    case 'notif': abrirAvisos(); break;
    case 'conta': $('#conta').classList.toggle('hidden'); break;
    case 'abrir-dem': abrirDemanda(id); break;
    case 'historico': $('#tlBox').innerHTML = linhaDoTempo(id, true); break;
    case 'mais-acoes': {
      const box = $('#maisAcoes');
      if (box) { box.classList.toggle('hidden'); el.setAttribute('aria-expanded', String(!box.classList.contains('hidden'))); }
      break;
    }
    case 'origem': abrirOrigem(el.dataset.k); break;
    case 'nova-dem': abrirNovaDemanda(null); break;
    /* ---------- módulo de ativos e chamados ---------- */
    case 'seletor': abrirSeletor(); break;
    case 'ctx':
      definirContexto(el.dataset.e, el.dataset.u);
      closeModal();
      break;
    case 'novo-ch': abrirNovoChamado({ ativo: el.dataset.ativo || '', equipamento: !!el.dataset.ativo }); break;
    case 'abrir-ch': abrirChamado(id); break;
    case 'abrir-ativo': abrirAtivo(id); break;
    case 'novo-ativo': abrirCadastroAtivo({ empresa: CTX.empresa !== 'todas' ? CTX.empresa : '', unidade: CTX.unidade !== 'todas' ? CTX.unidade : '' }); break;
    case 'editar-ativo': abrirCadastroAtivo({ ativo_id: id }); break;
    case 'prev-abrir': abrirPreventiva(id); break;
    case 'ch-filtro': F_CH.filtro = el.dataset.f; render(); break;
    case 'sub-dem': SUB_DEM = el.dataset.s; render(); break;
    case 'ir-ch': F_CH.filtro = el.dataset.f || 'abertos'; F_CH.q = ''; irPara('chamados'); break;
    case 'ch-aceitar': chAceitar(id); break;
    case 'ch-atualizar': chAtualizar(id); break;
    case 'ch-concluir': chConcluir(id); break;
    case 'ch-comentar': chComentar(id); break;
    case 'nova-empresa': novaEmpresa(); break;
    case 'nova-unidade': novaUnidade(); break;
    case 'novo-setor': novoSetor(); break;
    case 'novo-fornecedor': novoFornecedor(); break;
    case 'edit-empresa': novaEmpresa(id); break;
    case 'edit-unidade': novaUnidade(id); break;
    case 'edit-setor': novoSetor(id); break;
    case 'edit-fornecedor': novoFornecedor(id); break;
    case 'cad-aba': CAD2.aba = el.dataset.a; CAD2.q = ''; render(); break;
    case 'ler-codigo': {
      const destino = el.dataset.destino;
      lerCodigo(valor => {
        if (destino === 'form' && window.__lerCodigoNoForm) window.__lerCodigoNoForm(valor);
        else if (destino === 'cadastro' && window.__lerCodigoNoCadastro) window.__lerCodigoNoCadastro(valor);
        else { F_AT.q = valor; irPara('ativos'); }
      });
      break;
    }
    case 'dem-de-origem': {
      const o = origensPendentes().find(x => x.r.id === id);
      if (o) abrirNovaDemanda(o); else toast('Registro não encontrado.', true);
      break;
    }
    case 'sincronizar': load(); flush(); toast('Sincronizando'); break;
    case 'foto': ev.stopPropagation(); abrirFoto(el.dataset.url, el.dataset.id); break;
    case 'lb-fechar': fecharFoto(); break;
    case 'cam-fechar': fecharCamera(); break;
    case 'exp-xlsx': exportarPlanilha(); break;
    case 'exp-pdf': exportarPDF(); break;
    case 'cad-tab': CAD_TAB = el.dataset.t; render(); break;
    case 'nova-cat': abrirCategoria(null); break;
    case 'edit-cat': abrirCategoria(DB.categorias.find(c => c.id === id)); break;
  }
});
/* Teclado: cartões e linhas clicáveis respondem a Enter e espaço. */
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') {
    if (!$('#camBox').classList.contains('hidden')) { fecharCamera(); return; }
    if (!$('#conta').classList.contains('hidden')) { $('#conta').classList.add('hidden'); return; }
    if (!$('#lightbox').classList.contains('hidden')) { fecharFoto(); return; }
    if (modalAberto()) { closeModal(); return; }
  }
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches('[role=button]:not(button)')) {
    ev.preventDefault(); ev.target.click();
  }
});
/* Seletor de unidade */
document.addEventListener('change', ev => {
  if (!ev.target.classList.contains('js-unit')) return;
  F.un = ev.target.value;
  render();
});
document.addEventListener('input', ev => {
  if (ev.target.id === 'chBusca' || ev.target.id === 'atBusca' || ev.target.id === 'cadBusca') {
    const alvo = ev.target.id, pos = ev.target.selectionStart;
    if (alvo === 'chBusca') F_CH.q = ev.target.value;
    else if (alvo === 'cadBusca') CAD2.q = ev.target.value;
    else F_AT.q = ev.target.value;
    render();
    const novo = $('#' + alvo);
    if (novo) { novo.focus(); novo.setSelectionRange(pos, pos); }
    return;
  }
  if (ev.target.id !== 'gtBusca') return;
  F.q = ev.target.value;
  const pos = ev.target.selectionStart;
  render();
  const nb = $('#gtBusca');
  if (nb) { nb.focus(); nb.setSelectionRange(pos, pos); }
});
window.addEventListener('online', () => { flush(); load(); updSync(); });
window.addEventListener('offline', () => updSync());
window.matchMedia('(min-width:900px)').addEventListener('change', () => { if (USER && !modalAberto()) render(); });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) return;
  ULTIMO_TOQUE = Date.now();
  load(); flushFotos(); checarVersao();
});

/* =========================================================
   INÍCIO
   ========================================================= */
(function init() {
  restore();
  if (!definirUsuario()) { renderPortaria(); return; }
  restaurarContexto();
  render();
  carregarRoster();
  if (CFG.GAS_URL) {
    load();
    setInterval(() => { if (!document.hidden) load(); }, CFG.REFRESH_MS);
    setInterval(carregarRoster, CFG.ROSTER_TTL_MIN * 60000);
  }
  iniciarChecagemVersao();
  iniciarFotos();
})();

</script>
</body>
