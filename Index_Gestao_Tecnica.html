<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Gestão Técnica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Paleta medida no mockup de referência */
:root{
  --red:#C8161F; --red-q:#D8161F; --red-ink:#B3121C; --red-soft:#FCECEE; --red-line:#F4D2D6; --red-pill:#FBDDE1;
  --amber:#D0880A; --amber-ink:#7A3E08; --amber-soft:#FDF4E3; --amber-line:#F2E0BD; --amber-pill:#FCEAD2;
  --slate:#4B5258; --slate-ink:#2F3437; --slate-soft:#F1F1F3; --slate-line:#E2E3E6; --slate-pill:#E9EAEC;
  --green:#24963F; --green-ink:#1F6B2A; --green-soft:#EAF8ED; --green-line:#CDEBD4; --green-pill:#D9F1DF;
  --blue:#2563EB; --blue-soft:#E8F0FE;
  --purple:#6D4BC4; --purple-soft:#F0EBFB;
  --side:#141919; --side-ativo:#421313; --side-txt:#E8EAEA;
  --paper:#F6F6F7; --card:#FFFFFF; --line:#E6E7EA; --text:#161819; --mute:#6B7075;
  --r:10px; --r-lg:14px;
  --side-w:236px; --nav-h:68px;
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  /* nomes usados em trechos de estilo dentro do JavaScript */
  --chili:var(--red); --brand:var(--red); --accent:var(--red); --sky:var(--blue); --jade:var(--green); --yuzu:var(--amber-ink); --roxo:var(--purple); --chip:var(--slate-soft);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);background:var(--paper);color:var(--text);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden,[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid #93B4F5;outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;display:inline-block;vertical-align:middle}
.ic.sm{width:15px;height:15px}
.ic.lg{width:22px;height:22px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Marca Q Food ---------- */
.wm{display:flex;align-items:flex-end;gap:3px;line-height:1;font-weight:800;letter-spacing:-.03em}
.wm .q{color:var(--red-q);font-size:1.4em;line-height:.78;font-weight:900}
.wm-sub{font-size:12.5px;font-weight:500;margin-top:4px}

/* =========================================================
   ESTRUTURA
   ========================================================= */
.side{display:none}
.main{min-width:0}

/* Cabeçalho do celular: branco, marca à esquerda, sino e avatar */
.top{background:var(--card);position:sticky;top:0;z-index:30;padding:calc(12px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:8px}
.top .wm{font-size:24px}
.top .wm-sub{padding-left:32px;margin-top:3px}
.top .grow{flex:1}
.icon-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;border:0;background:transparent;color:var(--text)}
.icon-btn:hover{background:var(--slate-soft)}
.bell-dot{position:absolute;top:8px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--red-q);box-shadow:0 0 0 2px var(--card)}
.avatar{width:36px;height:36px;border-radius:50%;background:#3B3F42;color:#fff;font-weight:600;display:inline-flex;align-items:center;justify-content:center;border:0;font-size:15px;flex:none}

/* Seletor de unidade */
.unit-sel{position:relative;display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:8px;height:42px}
.unit-sel .ic{position:absolute;pointer-events:none;color:var(--text)}
.unit-sel .ic.a{left:12px}
.unit-sel .ic.b{right:12px;width:16px;height:16px}
.unit-sel select{appearance:none;-webkit-appearance:none;border:0;background:transparent;height:100%;min-height:0;width:100%;padding:0 38px 0 40px;font-size:14px;cursor:pointer;border-radius:8px}
.unit-m{background:var(--card);padding:2px 16px 12px}

.content{padding:16px 16px calc(var(--nav-h) + 44px + env(safe-area-inset-bottom));max-width:1180px;margin:0 auto}

/* Navegação inferior */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:35;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);align-items:end;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding:0 4px env(safe-area-inset-bottom)}
.bnav.sem-fab{grid-template-columns:repeat(4,1fr)}
.bnav button{position:relative;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:var(--nav-h);color:#555A5E;font-size:11.5px;font-weight:500}
.bnav button .ic{width:22px;height:22px}
.bnav button.on{color:var(--red)}
.bnav .bdg{position:absolute;top:9px;left:calc(50% + 5px);min-width:16px;height:16px;line-height:16px;padding:0 4px;border-radius:999px;background:var(--red-q);color:#fff;font-size:10px;font-weight:700}
.fab-wrap{display:flex;justify-content:center}
.bnav .fab{width:58px;height:58px;border-radius:50%;border:0;background:var(--red);color:#fff;display:inline-flex;flex-direction:row;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(200,22,31,.35);margin-bottom:14px}
.bnav .fab .ic{width:28px;height:28px;stroke-width:2.4}
.sync-line{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));z-index:34;height:28px;display:flex;align-items:center;justify-content:center;background:var(--paper)}

/* Sincronização: texto discreto com ponto colorido */
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mute)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--green)}
.sync.warn i{background:var(--amber)}
.sync.bad i{background:var(--red-q)}
.sync.mute i{background:#A3A8AC}
.sync.bad{color:var(--red-ink);font-weight:600}

/* ---------- Computador ---------- */
@media (min-width:900px){
  .app{display:grid;grid-template-columns:var(--side-w) 1fr}
  .side{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;background:var(--side);color:var(--side-txt);padding:26px 0 26px;overflow-y:auto}
  .top,.bnav,.sync-line,.unit-m{display:none}
  .content{padding:28px 30px 48px}
}
.side-brand{padding:0 24px 34px;color:#fff}
.side-brand .wm{font-size:27px}
.side-brand .wm-sub{color:var(--side-txt);padding-left:30px;margin-top:6px}
.side-nav{display:flex;flex-direction:column;gap:6px;padding:0 10px}
.side-nav button{white-space:nowrap;display:flex;align-items:center;gap:14px;width:100%;border:0;background:none;color:var(--side-txt);padding:11px 14px;border-radius:6px;font-weight:500;font-size:14px;text-align:left}
.side-nav button .ic{width:19px;height:19px}
.side-nav button:hover{background:rgba(255,255,255,.06)}
.side-nav button.on{background:var(--side-ativo);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 var(--red-q)}
.side-nav .n{margin-left:auto;min-width:20px;height:20px;line-height:20px;padding:0 6px;border-radius:999px;background:var(--red-q);color:#fff;font-size:11px;font-weight:700;text-align:center}
.side-tag{margin-top:auto;padding:24px 24px 18px 34px;font-size:14px;line-height:1.4;color:var(--side-txt)}
.side-tag i{display:block;width:34px;height:3px;border-radius:2px;background:var(--red-q);margin-top:16px}
/* Rodapé da lateral: usuário, menu principal e sair */
.side-foot{padding:0 12px;display:flex;flex-direction:column;gap:2px}
.side-user{display:flex;align-items:center;gap:12px;padding:12px;margin-bottom:8px;border:1px solid rgba(255,255,255,.08);border-radius:12px;background:rgba(255,255,255,.04);min-width:0}
.side-user .avatar{width:40px;height:40px;background:#27303A;border:1px solid rgba(255,255,255,.14);font-size:16px}
.side-user div{min-width:0}
.side-user b{display:block;color:#fff;font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-user small{display:block;color:var(--side-txt);opacity:.65;font-size:12.5px}
.side-foot a,.side-foot button{display:flex;align-items:center;gap:14px;width:100%;border:0;background:none;color:var(--side-txt);padding:10px 12px;border-radius:6px;font-size:14px;font-weight:500;text-decoration:none;text-align:left}
.side-foot a:hover,.side-foot button:hover{background:rgba(255,255,255,.06);color:#fff}
.side-foot .ic{width:19px;height:19px;opacity:.85}
.side-rod{display:flex;justify-content:space-between;gap:12px;padding:14px 12px 0;font-size:11px;color:var(--side-txt);opacity:.45;white-space:nowrap}

/* Cabeçalho do computador */
.dtop{display:none}
@media (min-width:900px){
  .dtop{display:flex;align-items:flex-start;gap:20px;margin:0 0 24px}
  .dtop h1{font-size:34px;font-weight:800;letter-spacing:-.03em;margin:0;line-height:1.1}
  .dtop .ola{font-size:19px;font-weight:500;margin-top:12px}
  .dtop .ola-s{font-size:14px;color:var(--mute);margin-top:6px}
  .dtop .grow{flex:1}
  .dtop-r{display:flex;flex-direction:column;align-items:flex-end;gap:16px}
  .dtop-row{display:flex;align-items:center;gap:14px}
  .dtop .unit-sel{width:222px}
  .dtop .icon-btn{background:var(--card);border:1px solid var(--line)}
}
/* Menu da conta (avatar no computador) */
.conta{position:fixed;top:78px;right:30px;z-index:60;width:280px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 40px rgba(0,0,0,.14);padding:8px}
.conta-u{display:flex;gap:10px;align-items:center;padding:10px 10px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.conta-u b{display:block;font-size:14.5px}
.conta-u small{display:block;color:var(--mute);font-size:12.5px;overflow:hidden;text-overflow:ellipsis}
.conta .js-sync{padding:6px 10px 10px}
.conta button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:10px;border-radius:8px;text-align:left;font-size:14px}
.conta button:hover{background:var(--slate-soft)}

/* =========================================================
   COMPONENTES
   ========================================================= */
h2.view{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:2px 0 4px}
p.lead{color:var(--mute);margin:0 0 18px;max-width:64ch}
h3.sec{font-size:18px;font-weight:700;margin:26px 0 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;letter-spacing:-.01em}
h3.sec .count{font-size:13px;color:var(--mute);font-weight:500}
h3.sec .grow{flex:1}
.link{background:none;border:0;color:var(--red);font-weight:500;padding:4px 0;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
/* Seção em cartão branco, como no mockup */
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 16px 18px;margin-top:14px}
.box-h{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.box-h h3{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em;flex:1}
.sec-solta{font-size:18px;font-weight:700;margin:22px 0 12px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.sec-solta span{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:6px;padding:0 18px;min-height:42px;background:var(--red);color:#fff;font-weight:600;font-size:14.5px;white-space:nowrap}
.btn:hover{filter:brightness(1.06)}
.btn.ghost{background:var(--slate-soft);color:var(--text);border:1px solid var(--slate-line)}
.btn.danger{background:var(--card);color:var(--red-ink);border:1px solid var(--red-line)}
.btn.jade{background:var(--green);color:#fff}
.btn.red{background:var(--red);color:#fff}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;gap:10px;flex-wrap:wrap}

/* Etiquetas: sempre texto + ícone + cor */
.st{display:inline-flex;align-items:center;gap:5px;border-radius:5px;padding:3px 8px;font-size:12px;font-weight:500;white-space:nowrap;line-height:1.35}
.st .ic{width:13px;height:13px;stroke-width:2.2}
.st.ok{background:var(--green-pill);color:var(--green-ink)}
.st.warn{background:var(--amber-pill);color:var(--amber-ink)}
.st.bad,.st.urg{background:var(--red-pill);color:var(--red-ink)}
.st.info{background:var(--blue-soft);color:#1D4FC4}
.st.roxo{background:var(--purple-soft);color:var(--purple)}
.st.mute{background:var(--slate-pill);color:var(--slate-ink)}
.st.urg .ic,.st.bad .ic{color:var(--red-q)}
.st.warn .ic{color:var(--amber)}
.empty{color:var(--mute);padding:22px 18px;text-align:center;border:1px dashed #D5D7DB;border-radius:var(--r);background:var(--card)}
.empty b{display:block;color:var(--text);margin-bottom:4px}
.banner{background:var(--amber-soft);color:var(--amber-ink);border-radius:var(--r);padding:10px 14px;font-size:13.5px;margin-bottom:14px}

.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>span:first-child{font-size:13.5px;font-weight:600;color:#3F4448}
.fld.req>span:first-child::after{content:" *";color:var(--red)}
input[type=text],input[type=date],input[type=search],input[type=number],select,textarea{width:100%;border:1px solid #D5D7DB;border-radius:8px;padding:10px 12px;background:#fff;min-height:44px}
textarea{min-height:88px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:#7A9CE8;outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:620px){.grid2{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:14px}
.hint{font-size:12.5px;color:var(--mute)}
.err-msg{color:var(--red);font-size:13.5px;font-weight:600}
.err-msg:empty{display:none}
.seg{display:inline-flex;background:var(--slate-soft);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:5px 11px;border-radius:6px;font-weight:500;color:var(--mute);font-size:13px}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.seg button .conta{display:inline-block;margin-left:5px;padding:0 6px;border-radius:999px;background:rgba(0,0,0,.08);font-size:11.5px;font-weight:700}
.seg button.on .conta{background:var(--red-pill);color:var(--red-ink)}

.fbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 16px}
.fbar .busca{flex:1;min-width:200px;position:relative}
.fbar .busca .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mute)}
.fbar .busca input[type=search]{padding-left:38px}
.fchip{display:inline-flex;align-items:center;gap:6px;background:var(--text);color:#fff;border:0;border-radius:999px;padding:6px 8px 6px 12px;font-size:13px;font-weight:500}
.fchip .ic{width:13px;height:13px;opacity:.7}

/* =========================================================
   OS QUATRO INDICADORES
   ========================================================= */
.kpi4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:899px){.kpi4{grid-template-columns:1fr 1fr;gap:10px}}
.k4{display:flex;align-items:center;gap:12px;border-radius:var(--r);padding:18px 16px;text-align:left;border:1px solid;min-height:88px;min-width:0}
.k4 .circ{width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;flex:none}
.k4 .circ .ic{width:20px;height:20px;stroke-width:2.1}
.k4 .t{flex:1;min-width:0}
.k4 .t span{display:block;font-size:13.5px;font-weight:500;color:var(--text)}
.k4 .t b{display:block;font-size:30px;font-weight:700;line-height:1.1;margin-top:3px;letter-spacing:-.02em}
.k4>.ic{color:var(--text);opacity:.75}
.k4.emerg{background:var(--red-soft);border-color:var(--red-line)} .k4.emerg .circ{background:var(--red-q)} .k4.emerg b{color:var(--red-ink)}
.k4.atras{background:var(--amber-soft);border-color:var(--amber-line)} .k4.atras .circ{background:var(--amber)} .k4.atras b{color:var(--amber-ink)}
.k4.aceite{background:var(--slate-soft);border-color:var(--slate-line)} .k4.aceite .circ{background:var(--slate)} .k4.aceite b{color:var(--slate-ink)}
.k4.valid{background:var(--green-soft);border-color:var(--green-line)} .k4.valid .circ{background:var(--green)} .k4.valid b{color:var(--green-ink)}
.k4:hover{filter:brightness(.98)}
@media (max-width:899px){
  .k4{padding:12px;gap:10px;min-height:74px}
  .k4 .circ{width:34px;height:34px}
  .k4 .t span{font-size:12px}
  .k4 .t b{font-size:22px}
  .k4>.ic{display:none}
}

/* =========================================================
   CARTÃO DE DEMANDA
   ========================================================= */
.dem-grid{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:700px){.dem-grid{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1100px){.dem-grid{grid-template-columns:repeat(3,1fr)}}
.box .dem-grid{gap:10px}
.dem{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 12px 12px 14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;min-width:0}
.dem:hover{border-color:#C9CCD1}
.dem-top{display:flex;align-items:center;gap:6px}
.dem-top .grow{flex:1}
.dem-num{font-size:12px;color:var(--mute);font-weight:500}
.dem-top>.ic{color:var(--text)}
.dem-tit{font-weight:600;font-size:15px;line-height:1.3;overflow-wrap:anywhere}
.dem-l{display:flex;align-items:center;gap:9px;font-size:13.5px;color:#3F4448;min-width:0}
.dem-l .ic{color:#4B5258}
.dem-l>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.dem-l.red{color:var(--red-ink)} .dem-l.red .ic{color:var(--red-q)}
.dem-l.warn{color:var(--amber-ink)} .dem-l.warn .ic{color:var(--amber)}
.dem-l.fraco{color:var(--mute);font-size:12.5px}
.dem-duo{display:flex;gap:14px;flex-wrap:wrap}
.dem-duo .dem-l:last-child{margin-left:auto}
/* No computador, como no mockup: unidade, responsável e prazo empilhados */
@media (min-width:900px){.dem-duo{flex-direction:column;gap:8px}.dem-duo .dem-l:last-child{margin-left:0}}
.dem-acoes{display:flex;gap:6px;margin-top:4px}
.dem-acoes .btn{flex:1 1 0;min-width:0;padding:0 6px;font-size:12.5px;min-height:34px;font-weight:500}
.dem-acoes .btn .ic{width:14px;height:14px}
.meta{display:inline-flex;flex-wrap:wrap;align-items:center;gap:0}
.meta>span+span::before{content:"";display:inline-block;width:1px;height:11px;background:#CFD2D6;margin:0 8px;vertical-align:-1px}

/* =========================================================
   LISTAS
   ========================================================= */
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row-main{flex:1;min-width:0}
.row-main b{display:block;font-weight:600;overflow-wrap:anywhere}
.row-main small{display:block;color:var(--mute);font-size:12.5px}
.row-num{text-align:right;white-space:nowrap}
.row-num b{font-weight:700;display:block}
.row-num small{color:var(--mute);font-size:12px}
.row.click{cursor:pointer}
.row.click:hover{background:var(--slate-soft)}

/* Visão por unidade: foto redonda, nome, total e três pontos */
.unis{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:760px){.unis{grid-template-columns:repeat(3,1fr)}}
.uni{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;display:flex;align-items:center;gap:14px;min-width:0}
.uni:hover{border-color:#C9CCD1}
.uni.on{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.uni-foto{width:66px;height:66px;border-radius:50%;overflow:hidden;flex:none;background:#2B2F31;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:20px}

  chamados: 'chamado_id', eventos: 'evento_id', orcamentos: 'orcamento_id',

  const k = chaveTab(tab);

  const i = row[k] ? arr.findIndex(r => r[k] && String(r[k]) === String(row[k])) : -1;
  if (i >= 0) arr[i] = { ...arr[i], ...row }; else arr.push({ ...row });
  return i >= 0 ? arr[i] : arr[arr.length - 1];
}

async function api(body) {

  const res = await fetch(CFG.GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ app: 'gt', ...body }) });
  return res.json();

async function flush() {
  if (!CFG.GAS_URL || flushing || !OUTBOX.length) { updSync(); return; }

  setSync('sync');
  const batch = OUTBOX.slice(0, 40);
  let ok = false;
  try {
    const r = await api({ action: 'upsert', items: batch });
    if (!r || !r.ok) throw new Error((r && r.error) || 'Falha no envio');
    OUTBOX.splice(0, batch.length);

    /* O número vem do servidor. Pode ser de uma demanda (DEM-) ou de um chamado (CH-). */
    if (r.numeros) Object.keys(r.numeros).forEach(id => {
      if (DB.demandas.some(d => d.id === id)) upsertLocal('demandas', { id: id, numero: r.numeros[id] });

    persist();
    ok = true;
    setSync('ok');
  } catch (e) {
    console.warn(e);
    setSync('err');

  const abas = String(s.abas || '').split(',').map(x => x.trim());
  /* Qualquer valor na coluna Gestao_Tecnica libera o acesso — 'X', 'gestor',
     'tecnico' ou o que estiver escrito lá. Só 'executor' restringe. */
  if (!bruto && abas.indexOf('gestaotecnica') < 0) { USER = null; return false; }
  USER = {

    nome: s.nome || s.email,

  };

}
const ehGestor = () => !!USER && USER.nivel !== 'executor';
const souEu = nome => !!USER && !!nome && normal(nome) === normal(USER.nome);

/* Lista de responsáveis: quem tem a coluna Gestao_Tecnica preenchida na USRR. */
function parseCSV(text) {
  const rows = [];
  let cur = [], field = '', inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQ = false; }
      else field += c;
    } else if (c === '"') inQ = true;
    else if (c === ',') { cur.push(field); field = ''; }
    else if (c === '\n') { cur.push(field); rows.push(cur); cur = []; field = ''; }
    else if (c !== '\r') field += c;
  }
  if (field || cur.length) { cur.push(field); rows.push(cur); }
  return rows;
}
function rosterDoCSV(txt) {
  const rows = parseCSV(txt);
  if (!rows.length) return [];
  const head = rows[0].map(h => String(h || '').trim());
  const col = n => head.findIndex(h => h.toLowerCase() === n.toLowerCase());
  const iEmail = col('email'), iNome = col('nome'), iNivel = col(CFG.COL_NIVEL);
  const iPerfil = col('perfil'), iPat = col('Patrimonio');
  if (iEmail < 0 || iNivel < 0) return [];
  const out = [];
  for (let r = 1; r < rows.length; r++) {
    const row = rows[r];
    if (!row || !row.length) continue;
    const email = String(row[iEmail] || '').trim().toLowerCase();
    const bruto = String(row[iNivel] || '').trim().toLowerCase();
    if (!email || !bruto) continue;
    out.push({
      email, nome: String(iNome >= 0 ? row[iNome] : '').trim() || email,
      nivel: bruto === 'executor' ? 'executor' : 'gestor',
      /* perfil manda no direito de cadastrar; a coluna Patrimonio, no de vincular placa */
      perfil: String(iPerfil >= 0 ? row[iPerfil] : '').trim(),
      patrimonio: String(iPat >= 0 ? row[iPat] : '').trim()
    });
  }
  return out.sort(byNome);
}
function guardarRoster(lista) {
  ROSTER = lista;
  try { localStorage.setItem(CFG.ROSTER_KEY, JSON.stringify({ lista, ts: Date.now() })); } catch (e) { }
}
function rosterDoCache(ignorarPrazo) {
  try {
    const c = JSON.parse(localStorage.getItem(CFG.ROSTER_KEY) || 'null');
    if (!c || !Array.isArray(c.lista)) return null;
    if (!ignorarPrazo && Date.now() - (c.ts || 0) > CFG.ROSTER_TTL_MIN * 60000) return null;
    return c.lista;
  } catch (e) { return null; }
}
async function carregarRoster() {
  const cache = rosterDoCache(false);
  if (cache && cache.length) { ROSTER = cache; return; }
  try {
    const r = await fetch(CFG.USRR_URL + '&t=' + Date.now());
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const lista = rosterDoCSV(await r.text());
    if (!lista.length) throw new Error('USRR sem pessoas com acesso');
    guardarRoster(lista);
    if (!modalAberto() && !isTyping()) render();
  } catch (e) {
    console.warn('Não foi possível ler a USRR', e);
    const velho = rosterDoCache(true);
    ROSTER = velho && velho.length ? velho : (USER ? [{ email: USER.email, nome: USER.nome, nivel: USER.nivel }] : []);
  }
}
const responsaveis = () => (ROSTER.length ? ROSTER : (USER ? [{ email: USER.email, nome: USER.nome, nivel: USER.nivel }] : []));

const venceHoje = d => stAberto(d.status) && String(d.prazo || '').slice(0, 10) === today();

/* Última vez que alguém mexeu na demanda. É o que revela bola parada. */
function ultimaMov(d) {
  const m = andamentoDe(d.id);
  return m.length ? m[m.length - 1].data_hora : (d.atualizado_em || d.data_abertura || '');

function paradoHTML(d) {

  const txt = h < 1 ? 'Atualizada há menos de 1 hora' : `Sem atualização há ${tempoHumano(h)}`;
  return `<div class="dem-parado${alerta ? ' alerta' : ''}">${ic('relogio', 'sm')}${esc(txt)}</div>`;
}
function prazoPill(d) {
  if (!stAberto(d.status)) return '';
  if (!d.prazo) return `<span class="st mute">${ic('relogio')}Sem prazo</span>`;
  const dias = diasDePrazo(d);
  if (dias < 0) return `<span class="st bad">${ic('alerta')}Atrasada ${plural(Math.abs(dias), 'dia')}</span>`;
  if (dias === 0) return `<span class="st warn">${ic('relogio')}Vence hoje</span>`;
  if (dias <= 2) return `<span class="st warn">${ic('relogio')}Vence em ${plural(dias, 'dia')}</span>`;
  return `<span class="st mute">${ic('relogio')}Prazo ${fmtD(d.prazo)}</span>`;
}

/* Chave de recorrência: é ela que permite dizer "esse problema já aconteceu 4 vezes". */
function chaveRec(d) {
  return [d.unidade, normal(d.setor), normal(d.categoria), normal(d.produto_nome || d.titulo)].join('|');
}
function ocorrencias(d) {
  const k = d.chave_recorrencia || chaveRec(d);
  return DB.demandas.filter(x => x.status !== 'cancelada' && (x.chave_recorrencia || chaveRec(x)) === k)
    .sort((a, b) => String(a.data_abertura).localeCompare(String(b.data_abertura)));

function gruposRecorrentes() {

    .filter(g => g.itens.length > 1)

const voltouDepoisDeResolvido = itens => itens.some((d, i) => d.status === 'concluida' && i < itens.length - 1);

/* Tempos que respondem "em quanto tempo foi resolvida". */
function tempos(d) {
  const mov = andamentoDe(d.id);
  const aceite = d.aceito_em || (mov.find(m => m.tipo === 'aceite') || {}).data_hora || '';
  const ini = d.criado_em || d.data_abertura;

  return {
    ateAceite: aceite && ini ? horasEntre(ini, aceite) : null,
    execucao: aceite && fim ? horasEntre(aceite, fim) : null,

  };
}
function noPrazo(d) {
  if (d.status !== 'concluida' || !d.prazo || !d.data_conclusao) return null;
  return String(d.data_conclusao).slice(0, 10) <= String(d.prazo).slice(0, 10);
}
const media = arr => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : null;

/* Entrada: observações e desperdícios marcados como "precisa de demanda técnica"
   no Controle de Produção que ainda não viraram demanda aqui. */
function origensPendentes() {
  const usadas = new Set(DB.demandas.filter(d => d.origem_id).map(d => d.origem_id));
  const out = [];
  DB.observacoes.forEach(o => { if (o.demanda_tecnica === 'Sim' && o.status !== 'cancelado' && !usadas.has(o.id)) out.push({ tipo: 'observacao', r: o }); });
  DB.desperdicios.forEach(o => { if (o.demanda_tecnica === 'Sim' && o.status !== 'cancelado' && !usadas.has(o.id)) out.push({ tipo: 'desperdicio', r: o }); });
  return out.sort((a, b) => String(b.r.data_hora).localeCompare(String(a.r.data_hora)));
}

/* ---------- Período ---------- */
function periodo() {
  const t = today();
  if (F.per === 'hoje') return [t, t];
  if (F.per === 'semana') return [addDays(t, -6), t];
  if (F.per === 'mes') return [t.slice(0, 8) + '01', t];
  if (F.per === 'tudo') return ['0000-01-01', '9999-12-31'];
  const a = F.de || t, b = F.ate || t;
  return a <= b ? [a, b] : [b, a];
}
/* Período imediatamente anterior, do mesmo tamanho — base da tendência. */
function periodoAnterior() {
  if (F.per === 'tudo') return null;
  const [a, b] = periodo();
  const dias = daysBetween(a, b) + 1;
  return [addDays(a, -dias), addDays(a, -1)];
}
const inPer = (d, per) => { const x = String(d || '').slice(0, 10); return x >= per[0] && x <= per[1]; };
const PER_TXT = { hoje: 'hoje', semana: 'nos últimos 7 dias', mes: 'neste mês', tudo: 'em todo o histórico', custom: 'no período escolhido' };

/* ---------- Filtros ---------- */
const naUnidade = d => F.un === 'todas' || d.unidade === F.un;
function filtrar(lista) {
  const per = periodo();
  const q = normal(F.q);
  return lista.filter(d => {
    if (!naUnidade(d)) return false;
    if (F.prio !== 'todas' && d.prioridade !== F.prio) return false;
    if (F.resp !== 'todos' && normal(d.responsavel) !== normal(F.resp)) return false;
    if (F.st === 'abertas' && !stAberto(d.status)) return false;
    if (F.st === 'atrasadas' && !atrasada(d)) return false;
    if (F.st === 'emergenciais' && !(stAberto(d.status) && d.prioridade === 'Emergencial')) return false;
    if (F.st === 'concluidas' && d.status !== 'concluida') return false;
    if (ST_IDS.includes(F.st) && d.status !== F.st) return false;
    if (F.st === 'concluidas' && !inPer(d.data_conclusao || d.data_abertura, per)) return false;
    if (F.st !== 'concluidas' && F.per !== 'tudo' && !stAberto(d.status) && !inPer(d.data_abertura, per)) return false;
    if (q && !normal([d.numero, d.titulo, d.problema, d.responsavel, d.produto_nome, d.categoria, d.setor, unNome(d.unidade)].join(' ')).includes(q)) return false;
    return true;
  }).sort(ordenar);
}
/* Emergencial primeiro, depois atrasada, depois prazo mais curto. */
function ordenar(a, b) {
  const pa = prioOrdem(a.prioridade), pb = prioOrdem(b.prioridade);
  if (pa !== pb) return pa - pb;
  const aa = atrasada(a) ? 0 : 1, ab = atrasada(b) ? 0 : 1;
  if (aa !== ab) return aa - ab;
  const za = a.prazo || '9999-12-31', zb = b.prazo || '9999-12-31';
  if (za !== zb) return String(za).localeCompare(String(zb));
  return String(b.data_abertura).localeCompare(String(a.data_abertura));
}
/* Fila do gestor, na ordem que o documento pede: emergenciais, atrasadas,
   sem aceite, bloqueadas, aguardando decisão, em validação e o resto por prazo. */
function rankAtencao(d) {
  if (d.prioridade === 'Emergencial') return 0;
  if (atrasada(d)) return 1;
  if (d.status === 'aceite') return 2;
  if (d.status === 'bloqueada') return 3;
  if (d.status === 'decisao' || d.status === 'terceiro') return 4;
  if (d.status === 'validacao') return 5;
  return 6;
}
function ordenarAtencao(a, b) {
  const r = rankAtencao(a) - rankAtencao(b);
  if (r) return r;
  const za = a.prazo || '9999-12-31', zb = b.prazo || '9999-12-31';
  return String(za).localeCompare(String(zb));
}

const ST_FILTRO = [

/* =========================================================
   AVISOS
   Sem notificação externa: os avisos nascem dos próprios dados e o sino
   mostra o que é novo desde a última vez que a pessoa olhou.
   ========================================================= */
function notificacoes() {
  if (!USER) return [];
  const out = [];
  const ultimoMov = (movs, fn) => { for (let i = movs.length - 1; i >= 0; i--) if (fn(movs[i])) return movs[i]; return null; };
  DB.demandas.forEach(d => {
    if (!stAberto(d.status)) return;
    const movs = andamentoDe(d.id);
    const meu = souEu(d.responsavel);
    if (d.status === 'aceite' && meu) {
      const tr = ultimoMov(movs, m => m.tipo === 'transferencia' && souEu(m.para));
      const dir = ultimoMov(movs, m => m.tipo === 'direcionamento' && souEu(m.para));
      if (tr && (!dir || tr.data_hora >= dir.data_hora)) {
        out.push({ k: 'mv:' + tr.id, t: 'Transferência recebida', s: `de ${tr.de || '—'}`, d, quando: tr.data_hora });
      } else {
        out.push({ k: 'rec:' + d.id + ':' + (dir ? dir.id : ''), t: 'Nova demanda recebida', s: `de ${d.criado_por || '—'}`, d, quando: dir ? dir.data_hora : d.data_abertura });
      }
    }
    if (d.prioridade === 'Emergencial' && minhaDemanda(d)) out.push({ k: 'emg:' + d.id, t: 'Demanda emergencial', s: '', d, quando: d.data_abertura });
    if (atrasada(d) && minhaDemanda(d)) out.push({ k: 'atr:' + d.id + ':' + d.prazo, t: 'Prazo vencido', s: `era ${fmtD(d.prazo)}`, d, quando: d.prazo + ' 23:59:59' });
    if (d.status === 'validacao' && d.validador_indicado && souEu(d.validador_indicado)) {
      const c = ultimoMov(movs, m => m.tipo === 'conclusao');
      out.push({ k: 'val:' + d.id + ':' + (c ? c.id : ''), t: 'Validação solicitada', s: `por ${d.responsavel || '—'}`, d, quando: c ? c.data_hora : d.atualizado_em });
    }
    const rb = ultimoMov(movs, m => m.tipo === 'reabertura');
    if (rb && meu) out.push({ k: 'mv:' + rb.id, t: 'Demanda devolvida ou reaberta', s: `por ${rb.autor || '—'}`, d, quando: rb.data_hora });
  });
  return out.sort((a, b) => String(b.quando).localeCompare(String(a.quando)));
}

/* A cor da empresa entra como acento. Vermelho, âmbar e verde continuam
   significando urgência, atenção e concluído — identidade não vira semáforo. */
function aplicarAcento() {
  const cor = CTX.empresa === 'todas' ? '#C8161F' : corDaEmpresa(CTX.empresa);
  document.documentElement.style.setProperty('--brand', cor);
  document.documentElement.style.setProperty('--red-q', cor);

  if (meta) meta.setAttribute('content', '#FFFFFF');

}
function definirContexto(empresa, unidade) {
  CTX.empresa = empresa || 'todas';
  CTX.unidade = unidade || 'todas';
  try { localStorage.setItem('gt_ctx_v1', JSON.stringify(CTX)); } catch (e) { }
  aplicarAcento();
}
function restaurarContexto() {
  try {
    const c = JSON.parse(localStorage.getItem('gt_ctx_v1') || 'null');
    if (c) { CTX.empresa = c.empresa || 'todas'; CTX.unidade = c.unidade || 'todas'; }

/* Um registro entra no contexto atual? */
function noCtx(r) {
  if (!r) return false;
  if (CTX.unidade !== 'todas') return r.unidade_id === CTX.unidade;
  if (CTX.empresa !== 'todas') return r.empresa_id === CTX.empresa;

/* ---------- Permissões ----------

function euNoRoster() {

const ativos = () => DB.ativos.filter(a => a.status !== 'Baixado' && a.status !== 'Descartado');

function buscarAtivos(q) {

  const lista = ativos().filter(noCtx);

/* Tudo o que já se gastou com o equipamento, e o que isso representa. */
function custoDoAtivo(id) {
  const chs = chamadosDoAtivo(id);
  const gasto = chs.reduce((s, c) => s + (Number(String(c.valor_final || c.valor_aprovado || '0').replace(',', '.')) || 0), 0);

}
const LIMITE_TROCA = () => Number(param('indice_troca_alerta', '70')) || 70;

/* =========================================================================
   CHAMADOS
   ========================================================================= */
const ST_CH = {
  'Aguardando aceite': { c: 'warn', i: 'entrada', aberto: true },
  'Em análise': { c: 'info', i: 'lupa', aberto: true },
  'Aguardando orçamento': { c: 'roxo', i: 'doc', aberto: true },
  'Aguardando aprovação': { c: 'roxo', i: 'relogio', aberto: true },
  'Aprovado': { c: 'ok', i: 'check', aberto: true },
  'Em execução': { c: 'info', i: 'ferramenta', aberto: true },
  'Bloqueada': { c: 'bad', i: 'cadeado', aberto: true },
  'Aguardando terceiro': { c: 'roxo', i: 'relogio', aberto: true },
  'Aguardando validação': { c: 'warn', i: 'bandeira', aberto: true },
  'Concluída': { c: 'ok', i: 'check', aberto: false },
  'Cancelada': { c: 'mute', i: 'x', aberto: false }
};
const chAberto = s => !!(ST_CH[s] && ST_CH[s].aberto);
const chPill = s => { const x = ST_CH[s] || { c: 'mute', i: 'traco' }; return `<span class="st ${x.c}">${ic(x.i)}${esc(s || '—')}</span>`; };
const chamados = () => DB.chamados.filter(c => c.status !== 'Cancelada' || ehGestor());
const chById = id => DB.chamados.find(c => c.chamado_id === id);
const chNum = c => c && c.numero ? c.numero : 'Aguardando número';
const chamadosDoAtivo = id => DB.chamados.filter(c => c.ativo_id === id && c.status !== 'Cancelada')
  .sort((a, b) => String(b.aberto_em).localeCompare(String(a.aberto_em)));
const eventosDo = id => DB.eventos.filter(e => e.chamado_id === id)
  .sort((a, b) => String(a.data_hora).localeCompare(String(b.data_hora)));
const chAtrasado = c => chAberto(c.status) && c.previsao_conclusao && String(c.previsao_conclusao).slice(0, 10) < today();
const chUrgente = c => chAberto(c.status) && (c.prioridade === 'Emergencial' || c.impacto === 'Crítico');

function rankCh(c) {
  if (c.prioridade === 'Emergencial') return 0;
  if (chAtrasado(c)) return 1;
  if (c.status === 'Aguardando aceite') return 2;
  if (c.status === 'Aguardando aprovação') return 3;
  if (c.status === 'Bloqueada' || c.status === 'Aguardando terceiro') return 4;
  if (c.status === 'Aguardando orçamento') return 5;
  return 6;
}
const ordenarCh = (a, b) => (rankCh(a) - rankCh(b)) ||
  String(a.previsao_conclusao || '9999').localeCompare(String(b.previsao_conclusao || '9999'));

   GARANTIAS E PREVENTIVAS
   ========================================================================= */
const garantiasDo = id => DB.garantias.filter(g => g.ativo_id === id);
function garantiaVigente(ativoId) {
  const hoje = today();
  return garantiasDo(ativoId).find(g => g.status !== 'Cancelada' && g.fim && String(g.fim).slice(0, 10) >= hoje) || null;
}
const planos = () => DB.planos.filter(p => p.ativo !== 'Não');
const planoById = id => DB.planos.find(p => p.plano_id === id);
/* Quantos dias faltam. Negativo é atraso. Plano sem data entra como vencido. */
function diasDaPreventiva(p) {
  if (!p.proxima_execucao) return 0;
  return daysBetween(today(), String(p.proxima_execucao).slice(0, 10));
}
function situacaoPreventiva(p) {
  const d = diasDaPreventiva(p);
  const tol = Number(p.tolerancia_dias) || 0;
  if (d < 0) return { t: `Vencida há ${plural(-d, 'dia')}`, c: 'bad', i: 'alerta', ordem: 0 };
  if (d === 0) return { t: 'Vence hoje', c: 'bad', i: 'alerta', ordem: 1 };
  if (d <= tol) return { t: `Faltam ${plural(d, 'dia')}`, c: 'warn', i: 'relogio', ordem: 2 };
  return { t: `Em ${plural(d, 'dia')}`, c: 'mute', i: 'cal', ordem: 3 };
}
const planosNoCtx = () => planos().filter(p => !p.unidade_id || noCtx(p));
const preventivasVencidas = () => planosNoCtx().filter(p => diasDaPreventiva(p) <= 0);

/* Frase abaixo da saudação: honesta com o que está acontecendo. */
function fraseDoDia() {
  const abertos = chamados().filter(c => noCtx(c) && chAberto(c.status));
  const urg = abertos.filter(c => chUrgente(c) || chAtrasado(c)).length;
  const prev = preventivasVencidas().length;
  if (urg || prev) {
    const partes = [];
    if (urg) partes.push(plural(urg, 'chamado urgente ou atrasado', 'chamados urgentes ou atrasados'));
    if (prev) partes.push(plural(prev, 'preventiva vencida', 'preventivas vencidas'));
    return `Aqui está o resumo de ${tituloContexto()}: ${partes.join(' e ')}.`;
  }
  return `Aqui está o resumo da gestão técnica de ${tituloContexto()}.`;
}
function atualizarSino(n) {
  $$('.js-bell').forEach(el => el.classList.toggle('hidden', !n));
  $$('[data-act=notif]').forEach(el => el.setAttribute('aria-label', n ? `Avisos, ${n} novos` : 'Avisos'));
}

/* =========================================================
   CARTÃO DE DEMANDA (formato do mockup)
   Etiqueta do motivo, título, unidade, responsável e prazo.
   ========================================================= */
function motivo(d) {
  if (stAberto(d.status) && d.prioridade === 'Emergencial') return { t: 'Emergencial', c: 'urg', i: 'alerta' };
  if (atrasada(d)) return { t: 'Atrasada', c: 'warn', i: 'relogio' };
  if (d.status === 'aceite') return { t: 'Sem aceite', c: 'mute', i: 'doc' };
  const s = ST[d.status] || { t: d.status, c: 'mute', i: 'traco' };
  return { t: s.t, c: s.c, i: s.i };
}
function motivoPill(d) { const m = motivo(d); return `<span class="st ${m.c}">${ic(m.i)}${esc(m.t)}</span>`; }
/* O motivo esconde a situação quando é "Emergencial" ou "Atrasada":
   nesses casos a situação aparece numa segunda etiqueta. */
function situacaoExtra(d) {
  const m = motivo(d);
  return (m.t === 'Emergencial' || m.t === 'Atrasada') ? stPill(d.status) : '';
}
function prazoLinha(d) {
  if (d.status === 'concluida') return { t: `Concluída em ${fmtD(d.data_conclusao)}`, c: '' };
  if (d.status === 'cancelada') return { t: 'Cancelada', c: '' };
  if (!d.prazo) return { t: 'Sem prazo', c: '' };
  const n = diasDePrazo(d);
  if (n === 0) return { t: 'Hoje', c: 'red' };
  if (n === -1) return { t: 'Ontem', c: 'red' };
  if (n < -1) return { t: `${fmtD(d.prazo).slice(0, 5)}, há ${plural(-n, 'dia')}`, c: 'red' };
  if (n === 1) return { t: 'Amanhã', c: 'warn' };
  return { t: fmtD(d.prazo), c: '' };
}
function acoesRapidas(d) {
  if (!podeMexer(d)) return [];
  if (d.status === 'aceite') return [['aceitar', 'Aceitar', 'jade', 'check'], ['abrir-dem', 'Abrir', 'ghost', 'chev']];
  if (d.status === 'analise' || d.status === 'andamento') return [['acao', 'Atualizar', 'ghost', 'lapis'], ['bloquear', 'Bloquear', 'ghost', 'cadeado'], ['concluir', 'Concluir', 'red', 'check']];
  if (['bloqueada', 'terceiro', 'decisao'].includes(d.status)) return [['desbloquear', 'Desbloquear', 'ghost', 'cadeado'], ['acao', 'Atualizar', 'ghost', 'lapis']];
  if (d.status === 'validacao' && aguardaMinhaValidacao(d)) return [['validar', 'Validar', 'jade', 'check'], ['devolver', 'Devolver', 'danger', 'voltar']];
  return [];
}
function cartao(d, comAcoes) {
  const pz = prazoLinha(d);
  const rec = ocorrencias(d).length;
  const parado = stAberto(d.status) ? horasEntre(ultimaMov(d), nowISO()) : 0;
  const acoes = comAcoes ? acoesRapidas(d) : [];
  return `<article class="dem" data-act="abrir-dem" data-id="${esc(d.id)}" tabindex="0" role="button" aria-label="${esc(demNum(d) + ', ' + d.titulo)}">
    <div class="dem-top">${motivoPill(d)}<span class="grow"></span><span class="dem-num">${esc(demNum(d))}</span>${ic('chev')}</div>
    <div class="dem-tit">${esc(d.titulo)}</div>
    <div class="dem-l">${ic('loja')}<span>${esc(unNome(d.unidade))}${d.setor ? `, ${esc(d.setor)}` : ''}</span></div>
    <div class="dem-duo">
      <div class="dem-l">${ic('pessoa')}<span>${esc(d.responsavel || '—')}</span></div>
      <div class="dem-l ${pz.c}">${ic('cal')}<span>${esc(pz.t)}</span></div>
    </div>
    ${rec > 1 ? `<div class="dem-l fraco">${ic('recorr', 'sm')}<span>Já aconteceu ${rec} vezes</span></div>` : ''}
    ${parado >= CFG.PARADO_ALERTA_H ? `<div class="dem-l fraco">${ic('relogio', 'sm')}<span>Sem atualização há ${esc(tempoHumano(parado))}</span></div>` : ''}
    ${acoes.length ? `<div class="dem-acoes">${acoes.map(([a, t, c, i]) => `<button type="button" class="btn sm ${c}" data-act="${a === 'abrir-dem' ? 'abrir-dem' : 'dem-' + a}" data-id="${esc(d.id)}">${ic(i)}${t}</button>`).join('')}</div>` : ''}
  </article>`;
}
function grade(lista, vazio, comAcoes) {
  if (!lista.length) return `<div class="empty">${vazio}</div>`;
  return `<div class="dem-grid">${lista.map(d => cartao(d, comAcoes)).join('')}</div>`;
}
function secao(titulo, lista, vazio, comAcoes, extra) {
  if (!lista.length && vazio === null) return '';
  return `<h3 class="sec">${titulo} <span class="count">${plural(lista.length, 'demanda')}</span>${extra || ''}</h3>${grade(lista, vazio || '', comAcoes)}`;
}
function caixa(titulo, corpo, direita) {
  return `<section class="box"><div class="box-h"><h3>${titulo}</h3>${direita || ''}</div>${corpo}</section>`;
}
const verTodas = (act, extra) => `<button type="button" class="link" data-act="${act}"${extra || ''}>Ver todas</button>`;

/* =========================================================
   TELA INICIAL
   ========================================================= */
/* Os quatro indicadores coloridos. Gestor vê a operação; executor, o que é dele. */
function quatroIndicadores(lista, meu) {
  const ab = lista.filter(d => stAberto(d.status));
  const k = (cls, icone, rotulo, n, st) => `
    <button type="button" class="k4 ${cls}" data-act="ir-todas" data-st="${st}"${meu ? ' data-meu="1"' : ''}>
      <span class="circ">${ic(icone)}</span>
      <span class="t"><span>${rotulo}</span><b class="num">${n}</b></span>
      ${ic('chev')}
    </button>`;
  return `<div class="kpi4">
    ${k('emerg', 'alerta', 'Emergenciais', ab.filter(d => d.prioridade === 'Emergencial').length, 'emergenciais')}
    ${k('atras', 'relogio', 'Atrasadas', ab.filter(atrasada).length, 'atrasadas')}
    ${k('aceite', 'doc', 'Sem aceite', ab.filter(d => d.status === 'aceite').length, 'aceite')}
    ${k('valid', 'check', 'Em validação', ab.filter(d => d.status === 'validacao').length, 'validacao')}
  </div>`;
}
/* O que está com a pessoa logada, na ordem de urgência. */
function comigo() {
  const minhas = DB.demandas.filter(d => stAberto(d.status) && minhaDemanda(d) && naUnidade(d));
  const validar = DB.demandas.filter(d => aguardaMinhaValidacao(d) && souEu(d.validador_indicado) && !minhas.includes(d) && naUnidade(d));
  return minhas.concat(validar).sort(ordenarAtencao);
}

function vHoje() { return ehGestor() ? vPainelGestor() : vHojeExecutor(); }

/* O módulo de demandas continua inteiro, agora dentro de uma tela só, com as
   suas telas antigas como abas. Nada mudou no funcionamento dele. */
let SUB_DEM = 'hoje';
function vDemandas() {
  const abas = [['hoje', ehGestor() ? 'Painel' : 'Hoje'], ['minhas', 'Minhas'], ['todas', 'Todas']]
    .concat(ehGestor() ? [['entrada', 'Entrada'], ['recorrencias', 'Recorrências'], ['relatorios', 'Relatórios']] : [['recorrencias', 'Recorrências']]);
  const corpo = { hoje: vHoje, minhas: vMinhas, todas: vTodas, entrada: vEntrada, recorrencias: vRecorrencias, relatorios: vRelatorios };
  return `<h2 class="view">Demandas técnicas</h2>
    <p class="lead">Processo, pessoas e boas práticas. Equipamento e estrutura ficam em Chamados.</p>
    <div class="seg" style="margin-bottom:16px;flex-wrap:wrap">${abas.map(([v, t]) =>
      `<button type="button" data-act="sub-dem" data-s="${v}" class="${SUB_DEM === v ? 'on' : ''}">${t}</button>`).join('')}</div>
    ${(corpo[SUB_DEM] || vHoje)()}`;
}

function vHojeExecutor() {
  const lista = comigo();
  const todasMinhas = DB.demandas.filter(d => minhaDemanda(d) && naUnidade(d));
  return `
    ${quatroIndicadores(todasMinhas, true)}
    <div class="sec-solta"><span>O que precisa de você agora</span></div>
    ${lista.length ? grade(lista, '', true) : '<div class="empty"><b>Tudo em dia</b>Quando alguém passar uma demanda para você, ela aparece aqui.</div>'}`;
}

function vPainelGestor() {
  const per = periodo();
  const escopo = DB.demandas.filter(d => d.status !== 'cancelada' && naUnidade(d));
  const fila = escopo.filter(d => stAberto(d.status)).sort(ordenarAtencao);
  const meu = comigo();
  return `
    ${quatroIndicadores(escopo, false)}
    ${meu.length ? `<div class="sec-solta"><span>O que precisa de você agora</span>${meu.length > 3 ? `<button type="button" class="link" data-view="minhas">Ver todas</button>` : ''}</div>
      ${grade(meu.slice(0, 3), '', true)}` : ''}
    ${caixa('Precisa de atenção agora',
      grade(fila.slice(0, 6), '<b>Nenhuma demanda aberta</b>Quando algo for registrado, aparece aqui na ordem de urgência.'),
      fila.length ? verTodas('ir-todas', ' data-st="abertas"') : '')}
    ${caixa('Visão por unidade', visaoUnidades(), `<button type="button" class="link" data-act="ir-todas" data-st="abertas" data-un="todas">Ver todas</button>`)}
    ${caixa(`Desempenho ${F.per === 'semana' ? 'da semana' : F.per === 'mes' ? 'do mês' : 'geral'}`, desempenho(escopo, per),
      `<span class="seg" role="group" aria-label="Período">${[['semana', 'Semana'], ['mes', 'Mês'], ['tudo', 'Tudo']].map(([v, t]) => `<button type="button" data-act="periodo" data-p="${v}" class="${F.per === v ? 'on' : ''}">${t}</button>`).join('')}</span>`)}`;
}

/* Visão por unidade: foto, total ativo e três pontos.
   Vermelho: emergencial ou atrasada. Âmbar: sem aceite, travada, em validação
   ou vencendo hoje. Verde: andando dentro do prazo. */
function farol(d) {
  if (d.prioridade === 'Emergencial' || atrasada(d)) return 'r';
  if (['aceite', 'bloqueada', 'terceiro', 'decisao', 'validacao'].includes(d.status) || venceHoje(d)) return 'a';
  return 'g';
}
/* Se o GitHub Pages ainda não publicou a foto, tenta a cópia direta do
   repositório. Só se as duas falharem é que entra a inicial da unidade. */
const ASSETS_RESERVA = 'https://raw.githubusercontent.com/rodsilveira-rs/qfood-dashboard/main/assets/';
function fotoUnidade(u) {
  const f = UN[u].foto;
  return `<span class="uni-foto"><img src="${ASSETS_URL + f}" alt="" data-reserva="${ASSETS_RESERVA + f}" onerror="if(this.dataset.reserva){this.src=this.dataset.reserva;this.removeAttribute('data-reserva')}else{this.replaceWith(document.createTextNode('${inicial(UN[u].nome)}'))}"></span>`;
}
function pontos(n) {
  return `<span class="dots"><span class="r" title="Críticas"><i></i>${n.r}</span><span class="a" title="Pedem atenção"><i></i>${n.a}</span><span class="g" title="Em dia"><i></i>${n.g}</span></span>`;
}
function visaoUnidades() {
  return `<div class="unis">${UN_IDS.map(u => {
    const ab = DB.demandas.filter(d => d.unidade === u && stAberto(d.status));
    const n = { r: 0, a: 0, g: 0 };
    ab.forEach(d => { n[farol(d)]++; });
    return `<button type="button" class="uni${F.un === u ? ' on' : ''}" data-act="unidade" data-u="${F.un === u ? 'todas' : u}" aria-pressed="${F.un === u}"
      aria-label="${esc(UN[u].nome)}: ${ab.length} ativas, ${n.r} críticas, ${n.a} pedem atenção, ${n.g} em dia">
      ${fotoUnidade(u)}
      <span class="uni-t"><b>${esc(UN[u].nome)}</b><small>${plural(ab.length, 'demanda ativa', 'demandas ativas')}</small>${pontos(n)}</span>
      ${ic('chev')}
    </button>`;
  }).join('')}</div>
  <div class="legenda"><span class="dots"><span class="r"><i></i>Emergencial ou atrasada</span><span class="a"><i></i>Sem aceite, travada ou vencendo</span><span class="g"><i></i>Em dia</span></span></div>`;
}

/* ---------- Desempenho: quatro caixas, cada uma abre a própria origem ---------- */
function anel(pct) {
  const p = pct === null ? 0 : Math.max(0, Math.min(100, pct));
  const cor = pct === null ? '#C9CCD1' : p >= 80 ? '#1D9D42' : p >= 60 ? '#DA8D03' : '#D1111E';
  const r = 20, c = 2 * Math.PI * r;
  return `<svg viewBox="0 0 52 52" width="52" height="52" aria-hidden="true">
    <circle cx="26" cy="26" r="${r}" fill="none" stroke="#E6E7EA" stroke-width="6"/>
    <circle cx="26" cy="26" r="${r}" fill="none" stroke="${cor}" stroke-width="6" stroke-linecap="round"
      stroke-dasharray="${(c * p / 100).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 26 26)"/></svg>`;
}
function dadosDesempenho(escopo, per) {
  const concl = escopo.filter(d => d.status === 'concluida' && inPer(d.data_conclusao || d.data_abertura, per));
  const comPrazo = concl.filter(d => noPrazo(d) !== null);
  const pct = comPrazo.length ? Math.round(comPrazo.filter(noPrazo).length / comPrazo.length * 100) : null;
  const aceitas = escopo.filter(d => inPer(d.data_abertura, per) && tempos(d).ateAceite !== null);
  const recs = gruposRecorrentes().filter(g => g.itens.some(d => naUnidade(d) && inPer(d.data_abertura, per)));
  return {
    concl, comPrazo, pct, aceitas, recs,
    mAceite: media(aceitas.map(d => tempos(d).ateAceite)),
    mResol: media(concl.map(d => tempos(d).total).filter(t => t !== null))
  };
}
function desempenho(escopo, per) {
  const x = dadosDesempenho(escopo, per);
  const caixa4 = (act, k, ico, valor, rotulo) => `<button type="button" class="p4" data-act="${act}" ${k}>
    <span class="ico">${ico}</span><span><b class="num">${esc(valor)}</b><span>${rotulo}</span></span></button>`;
  return `<div class="perf4">
    ${caixa4('origem', 'data-k="prazo"', anel(x.pct), x.pct === null ? '—' : x.pct + '%', 'no prazo')}
    ${caixa4('origem', 'data-k="aceite"', ic('relogio'), tempoHumano(x.mAceite), 'até o aceite')}
    ${caixa4('origem', 'data-k="resol"', ic('barras'), tempoHumano(x.mResol), 'para resolver')}
    ${caixa4('goto', 'data-v="recorrencias"', ic('sync'), String(x.recs.length), x.recs.length === 1 ? 'recorrência' : 'recorrências')}
  </div>`;
}
/* Mostra quais demandas entraram em cada número. */
function abrirOrigem(k) {
  const escopo = DB.demandas.filter(d => d.status !== 'cancelada' && naUnidade(d));
  const x = dadosDesempenho(escopo, periodo());
  let titulo, lista, lado;
  if (k === 'prazo') {
    titulo = 'Concluídas no prazo';
    lista = x.comPrazo.slice().sort((a, b) => (noPrazo(a) ? 1 : 0) - (noPrazo(b) ? 1 : 0));
    lado = d => noPrazo(d) ? `<span class="st ok">${ic('check')}No prazo</span>` : `<span class="st bad">${ic('alerta')}Fora do prazo</span>`;
  } else if (k === 'aceite') {
    titulo = 'Tempo até o aceite';
    lista = x.aceitas.slice().sort((a, b) => tempos(b).ateAceite - tempos(a).ateAceite);
    lado = d => `<div class="row-num"><b>${esc(tempoHumano(tempos(d).ateAceite))}</b><small>${esc(d.responsavel || '—')}</small></div>`;
  } else {
    titulo = 'Tempo para resolver';
    lista = x.concl.filter(d => tempos(d).total !== null).sort((a, b) => tempos(b).total - tempos(a).total);
    lado = d => `<div class="row-num"><b>${esc(tempoHumano(tempos(d).total))}</b><small>${esc(d.responsavel || '—')}</small></div>`;
  }
  openModal(titulo, `
    <p class="hint" style="margin:0 0 12px">${plural(lista.length, 'demanda')} ${esc(PER_TXT[F.per] || '')}${F.un !== 'todas' ? ', em ' + esc(unNome(F.un)) : ''}. Toque para abrir.</p>
    ${lista.length ? `<div class="list">${lista.map(d => `<div class="row click" data-act="abrir-dem" data-id="${esc(d.id)}">
      <div class="row-main"><b>${esc(d.titulo)}</b><small>${meta(esc(demNum(d)), esc(unCurto(d.unidade)), 'Prazo ' + fmtD(d.prazo))}</small></div>${lado(d)}</div>`).join('')}</div>`
      : '<div class="empty">Nenhuma demanda entrou neste cálculo.</div>'}`);
}

/* =========================================================
   MINHAS
   ========================================================= */
function vMinhas() {
  const minhas = DB.demandas.filter(d => minhaDemanda(d));
  const ab = minhas.filter(d => stAberto(d.status)).sort(ordenar);
  const g = s => ab.filter(d => d.status === s);
  const validarEu = DB.demandas.filter(d => d.status === 'validacao' && souEu(d.validador_indicado) && !minhaDemanda(d)).sort(ordenar);
  const concl = minhas.filter(d => d.status === 'concluida').sort((a, b) => String(b.data_conclusao).localeCompare(String(a.data_conclusao))).slice(0, 6);
  const vazio = !ab.length && !validarEu.length && !concl.length;
  return `
  <h2 class="view">Minhas demandas</h2>
  <p class="lead">Tudo o que passa por você, como responsável ou apoio.</p>
  ${vazio ? '<div class="empty"><b>Nenhuma demanda com você</b>Quando alguém direcionar algo para você, aparece aqui.</div>' : ''}
  ${secao('Recebidas, confirmar', g('aceite'), null, true)}
  ${secao('Em análise', g('analise'), null, true)}
  ${secao('Em andamento', g('andamento'), null, true)}
  ${secao('Bloqueadas', g('bloqueada'), null, true)}
  ${secao('Aguardando terceiro ou decisão', ab.filter(d => d.status === 'terceiro' || d.status === 'decisao'), null, true)}
  ${secao('Enviadas para validação', g('validacao'), null, false)}
  ${secao('Aguardando sua validação', validarEu, null, true)}
  ${secao('Concluídas recentemente', concl, null, false)}`;
}

/* Linha secundária com separadores discretos, sem pontos soltos no texto. */

/* =========================================================
   ENTRADA — vem do Controle de Produção

      <div class="dem-top"><span class="dem-num">${tipo === 'desperdicio' ? 'Descarte' : 'Observação'}</span>${imp ? `<span class="st ${cls}">${ic('alerta')}Impacto ${esc(imp)}</span>` : ''}</div>
      <div class="dem-tit">${esc(titulo)}</div>
      <div class="meta"><span>${esc(unNome(r.unidade))}</span>${r.setor ? `<span>${esc(r.setor)}</span>` : ''}${r.produto_nome ? `<span>${esc(r.produto_nome)}</span>` : ''}</div>
      ${tipo === 'desperdicio' && r.kg ? `<div class="dem-resp">Peso descartado: <b>${esc(String(r.kg).replace('.', ','))} kg</b>${r.causa ? `, causa: ${esc(r.causa)}` : ''}</div>` : ''}
      <div class="dem-resp">Registrado por <b>${esc(r.responsavel || '—')}</b> em ${fmtDH(r.data_hora)}</div>

      <div class="dem-acoes"><button type="button" class="btn sm" data-act="dem-de-origem" data-tipo="${tipo}" data-id="${esc(r.id)}">Transformar em demanda</button></div>
    </article>`;
  }).join('')}</div>` : '<div class="empty"><b>Nada na entrada</b>Tudo que a produção sinalizou já virou demanda.</div>'}`;

/* =========================================================
   RECORRÊNCIAS
   ========================================================= */
function vRecorrencias() {
  const grupos = gruposRecorrentes().filter(g => g.itens.some(naUnidade));
  return `
  <h2 class="view">Problemas recorrentes</h2>
  <p class="lead">O mesmo problema voltando é sinal de que a solução anterior não segurou. Veja o que já foi tentado antes de tentar de novo.</p>

      <div class="dem-tit" style="font-size:17px">${esc(ult.titulo)}</div>
      <div class="meta" style="margin:4px 0 10px"><span>${esc(unNome(ult.unidade))}</span>${ult.setor ? `<span>${esc(ult.setor)}</span>` : ''}${ult.produto_nome ? `<span>${esc(ult.produto_nome)}</span>` : ''}</div>
      ${voltouDepoisDeResolvido(it) ? `<div class="det-box alerta"><p><b>A solução anterior não evitou que o problema voltasse.</b> Vale buscar a causa, não só corrigir de novo.</p></div>` : ''}
      <dl class="det-kv">

        <dt>Última vez</dt><dd>${fmtD(ult.data_abertura)}</dd>

        : '<div class="row"><div class="row-main"><small>Nenhuma ocorrência foi concluída ainda.</small></div></div>'}</div>
      <details class="mais-ind"><summary>Ver as ${it.length} ocorrências</summary>

      </details>

}

/* =========================================================
   RELATÓRIOS — tabela no computador, cartões no celular
   ========================================================= */
function vRelatorios() {
  const per = periodo(), ant = periodoAnterior();
  const base = demandas().filter(naUnidade);
  const noPer = base.filter(d => inPer(d.data_abertura, per) || (d.data_conclusao && inPer(d.data_conclusao, per)) || stAberto(d.status));
  const pctPrazo = l => { const c = l.filter(d => noPrazo(d) !== null); return c.length ? Math.round(c.filter(noPrazo).length / c.length * 100) + '%' : '—'; };

  /* Por responsável */
  const pp = {};
  noPer.forEach(d => {
    const n = d.responsavel || '—';
    const o = pp[n] = pp[n] || { n, l: [] };
    o.l.push(d);
  });
  const pessoas = Object.values(pp).map(o => ({
    n: o.n, total: o.l.length, abertas: o.l.filter(d => stAberto(d.status)).length, atrasadas: o.l.filter(atrasada).length,
    concluidas: o.l.filter(d => d.status === 'concluida').length, prazo: pctPrazo(o.l),
    aceite: tempoHumano(media(o.l.map(d => tempos(d).ateAceite).filter(t => t !== null))),
    resol: tempoHumano(media(o.l.map(d => tempos(d).total).filter(t => t !== null)))
  })).sort((a, b) => b.total - a.total);

  /* Por categoria, com tendência contra o período anterior */
  const noAnt = ant ? base.filter(d => inPer(d.data_abertura, ant)) : [];
  const abertasPer = base.filter(d => inPer(d.data_abertura, per));
  const pc = {};
  abertasPer.forEach(d => { const k = d.categoria || 'Sem categoria'; (pc[k] = pc[k] || []).push(d); });
  const totalCat = abertasPer.length || 1;
  const cats = Object.keys(pc).map(k => {
    const l = pc[k];
    const porU = {}; l.forEach(d => { porU[d.unidade] = (porU[d.unidade] || 0) + 1; });
    const topU = Object.keys(porU).sort((a, b) => porU[b] - porU[a])[0];
    const antN = noAnt.filter(d => (d.categoria || 'Sem categoria') === k).length;
    const dif = l.length - antN;
    return { k, n: l.length, part: Math.round(l.length / totalCat * 100), topU: unCurto(topU), antN, dif };
  }).sort((a, b) => b.n - a.n);
  const tend = c => !ant ? '—' : c.dif > 0 ? `<span class="tend-up">${ic('cima', 'sm')} +${c.dif}</span>` : c.dif < 0 ? `<span class="tend-down">${ic('baixo', 'sm')} ${c.dif}</span>` : 'Estável';

  /* Por unidade */
  const grupos = gruposRecorrentes();
  const unis = UN_IDS.filter(u => F.un === 'todas' || u === F.un).map(u => {
    const l = noPer.filter(d => d.unidade === u);
    return {
      u, n: l.length, atras: l.filter(atrasada).length, emerg: l.filter(d => stAberto(d.status) && d.prioridade === 'Emergencial').length,
      tempo: tempoHumano(media(l.map(d => tempos(d).total).filter(t => t !== null))),
      rec: grupos.filter(g => g.itens.some(d => d.unidade === u)).length, prazo: pctPrazo(l)
    };
  });

  const sec = (t, n) => `<h3 class="sec">${t}${n !== undefined ? ` <span class="count">${n}</span>` : ''}</h3>`;
  return `
  <h2 class="view">Relatórios</h2>
  <p class="lead">Entregas por pessoa, onde os problemas se concentram e como cada unidade está ${esc(PER_TXT[F.per] || '')}.</p>

/* =========================================================================
   CARTÃO DE CHAMADO
   ========================================================================= */
function motivoCh(c) {
  if (chAberto(c.status) && c.prioridade === 'Emergencial') return { t: 'Urgente', c: 'urg', i: 'alerta' };
  if (chAtrasado(c)) return { t: 'Atrasado', c: 'warn', i: 'relogio' };
  const x = ST_CH[c.status] || { c: 'mute', i: 'traco' };
  return { t: c.status, c: x.c, i: x.i };
}
function cartaoChamado(c) {
  const m = motivoCh(c);
  const a = c.ativo_id ? ativoById(c.ativo_id) : null;
  const valor = c.valor_aprovado || c.valor_final;
  return `<article class="dem" data-act="abrir-ch" data-id="${esc(c.chamado_id)}" tabindex="0" role="button" aria-label="${esc(chNum(c) + ', ' + c.titulo)}">
    <div class="dem-top"><span class="st ${m.c}">${ic(m.i)}${esc(m.t)}</span><span class="grow"></span><span class="dem-num">${esc(chNum(c))}</span>${ic('chev')}</div>
    <div class="dem-tit">${esc(c.titulo)}</div>
    <div class="dem-l">${ic('loja')}<span>${esc(nomeUni(c.unidade_id))}${c.local ? ', ' + esc(c.local) : ''}</span></div>
    ${a ? `<div class="dem-l">${ic('caixa')}<span>${esc(a.codigo_patrimonio ? 'Patrimônio ' + a.codigo_patrimonio + ', ' : '')}${esc(a.nome)}</span></div>` : ''}
    <div class="dem-duo">
      <div class="dem-l">${ic('pessoa')}<span>${esc(c.responsavel || 'Sem responsável')}</span></div>
      <div class="dem-l ${chAtrasado(c) ? 'red' : ''}">${ic('cal')}<span>${c.previsao_conclusao ? fmtD(c.previsao_conclusao) : 'Sem prazo'}</span></div>
    </div>
    ${valor ? `<div class="dem-l fraco">${ic('doc', 'sm')}<span>${esc(dinheiro(valor))}${c.status === 'Aguardando aprovação' ? ', aguardando aprovação' : ''}</span></div>` : ''}
    ${!chAberto(c.status) ? '' : chPill(c.status) === '' ? '' : ''}
  </article>`;
}
const dinheiro = v => {
  const n = Number(String(v || '0').replace(/\./g, '').replace(',', '.')) || 0;
  return 'R$ ' + n.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
};

function ultimasMovimentacoes() {
  const evs = DB.eventos.slice().sort((a, b) => String(b.data_hora).localeCompare(String(a.data_hora))).slice(0, 8);

  const rotulo = { CHAMADO_CRIADO: 'Chamado aberto', SERVICO_CONCLUIDO: 'Serviço concluído', GARANTIA_REGISTRADA: 'Garantia registrada', ORCAMENTO_APROVADO: 'Orçamento aprovado', ACEITE: 'Recebimento confirmado', COMENTARIO: 'Comentário', STATUS_ALTERADO: 'Situação alterada', ATIVO_CADASTRADO: 'Ativo cadastrado' };
  return `<div class="list">${evs.map(e => {
    const c = chById(e.chamado_id);
    return `<div class="row${c ? ' click' : ''}" ${c ? `data-act="abrir-ch" data-id="${esc(e.chamado_id)}"` : ''}>
      <div class="row-main"><b>${esc(rotulo[e.tipo_evento] || e.tipo_evento)}</b><small>${meta(c ? esc(chNum(c)) : '', esc(e.descricao || ''), esc(e.usuario || ''))}</small></div>

  }).join('')}</div>`;
}

let F_CH = { q: '', filtro: 'abertos' };
function vChamados() {
  const base = chamados().filter(noCtx);
  const q = normal(F_CH.q);
  let lista = base.filter(c => {
    if (F_CH.filtro === 'abertos' && !chAberto(c.status)) return false;
    if (F_CH.filtro === 'urgentes' && !chUrgente(c)) return false;
    if (F_CH.filtro === 'aceite' && c.status !== 'Aguardando aceite') return false;
    if (F_CH.filtro === 'concluidos' && c.status !== 'Concluída') return false;
    if (q && !normal([c.numero, c.titulo, c.descricao, c.responsavel, c.local, c.codigo_patrimonio, nomeUni(c.unidade_id)].join(' ')).includes(q)) return false;
    return true;
  }).sort(ordenarCh);
  const aba = (v, t) => `<button type="button" data-act="ch-filtro" data-f="${v}" class="${F_CH.filtro === v ? 'on' : ''}">${t}</button>`;
  return `
    <h2 class="view">Chamados</h2>
    <p class="lead">${esc(tituloContexto())}</p>
    <div class="fbar">
      <label class="busca">${ic('busca', 'sm')}<span class="sr">Buscar</span>

    </div>
    <h3 class="sec" style="margin-top:0">Resultado <span class="count">${plural(lista.length, 'chamado')}</span></h3>
    ${lista.length ? `<div class="dem-grid">${lista.map(cartaoChamado).join('')}</div>`
      : '<div class="empty"><b>Nada por aqui</b>Mude o filtro ou abra um chamado novo.</div>'}`;
}

      id: e.empresa_id, foto: fotoDe(e.empresa_id), titulo: e.nome,
      sub: plural(unidadesDe(e.empresa_id).length, 'unidade'), inativo: e.ativo === 'Não'
    }));

    linhas = DB.unidades.filter(u => filtra(u.nome + ' ' + nomeEmp(u.empresa_id))).map(u => ({

      sub: meta(esc(x.especialidades || ''), esc(x.telefone || x.whatsapp || '')), inativo: x.ativo === 'Não'
    }));

  const conta = k => k === 'empresas' ? DB.empresas.length : k === 'unidades' ? DB.unidades.length

  return `

/* =========================================================
   DETALHE DA DEMANDA
   Ordem do documento: título, prioridade e situação, prazo, responsável,
   problema, local, causa, ação, solução, evidências, histórico.
   ========================================================= */
function linhaDoTempo(id, todas) {
  const mov = andamentoDe(id).slice().reverse();   // mais recente primeiro
  if (!mov.length) return '<div class="empty">Sem movimentos registrados.</div>';
  const vis = todas ? mov : mov.slice(0, 4);
  return `<div class="tl">${vis.map(m => {
    const def = MOV[m.tipo] || { t: m.tipo, c: '' };
    const passe = (m.tipo === 'direcionamento' || m.tipo === 'transferencia') && (m.de || m.para);
    return `<div class="tl-item ${def.c}">
      <div class="tl-h">${fmtDH(m.data_hora)}</div>
      <div class="tl-b">${esc(def.t)} por ${esc(m.autor || '—')}</div>
      ${passe ? `<div class="tl-de">De ${esc(m.de || '—')} para <b>${esc(m.para || '—')}</b></div>` : ''}
      ${m.texto ? `<div class="tl-t">${esc(m.texto)}</div>` : ''}
      ${m.prazo_novo ? `<div class="tl-x">Novo prazo: <b>${fmtD(m.prazo_novo)}</b></div>` : ''}
      ${m.evidencia ? `<div class="tl-x thumbs">${fotoHTML(m.evidencia)}</div>` : ''}
    </div>`;
  }).join('')}</div>${!todas && mov.length > 4 ? `<button type="button" class="link" data-act="historico" data-id="${esc(id)}">Ver histórico completo (${mov.length} movimentos)</button>` : ''}`;
}

/* Botões principais ficam no rodapé; os menos usados, em "Mais ações".
   Só aparece o que a pessoa pode fazer naquele momento. */
function acoesDetalhe(d) {
  const mexe = podeMexer(d), g = ehGestor();
  const prim = [], mais = [];
  const add = (lista, cond, a, t, c) => { if (cond) lista.push([a, t, c || 'ghost']); };
  switch (d.status) {
    case 'aceite':
      add(prim, mexe, 'aceitar', 'Aceitar', 'jade');
      add(mais, g, 'transferir', 'Transferir');
      add(mais, mexe, 'prazo', 'Alterar prazo');
      add(mais, g, 'cancelar', 'Cancelar', 'danger');
      break;
    case 'analise': case 'andamento':
      add(prim, mexe, 'acao', 'Atualizar');
      add(prim, g, 'transferir', 'Transferir');
      add(prim, mexe, 'concluir', 'Concluir', 'jade');
      add(mais, mexe, 'prazo', 'Alterar prazo');
      add(mais, mexe, 'bloquear', 'Bloquear');
      add(mais, g, 'cancelar', 'Cancelar', 'danger');
      break;
    case 'bloqueada': case 'terceiro': case 'decisao':
      add(prim, mexe, 'desbloquear', 'Desbloquear', '');
      add(prim, mexe, 'acao', 'Atualizar');
      add(mais, g, 'transferir', 'Transferir');
      add(mais, mexe, 'prazo', 'Alterar prazo');
      add(mais, g, 'cancelar', 'Cancelar', 'danger');
      break;
    case 'validacao':
      add(prim, aguardaMinhaValidacao(d), 'devolver', 'Devolver', 'danger');
      add(prim, aguardaMinhaValidacao(d), 'validar', 'Validar', 'jade');
      add(mais, g, 'cancelar', 'Cancelar', 'danger');
      break;
    case 'concluida':
      add(prim, g, 'reabrir', 'Reabrir', 'danger');
      break;
  }
  if (d.status !== 'cancelada') {
    if (prim.length) mais.unshift(['comentar', 'Comentar', 'ghost']);
    else prim.push(['comentar', 'Comentar', 'ghost']);
  }
  return { prim, mais };
}
function rodapeDetalhe(d) {
  const { prim, mais } = acoesDetalhe(d);
  if (!prim.length && !mais.length) return '';
  const b = ([a, t, c]) => `<button type="button" class="btn ${c}" data-act="dem-${a}" data-id="${esc(d.id)}">${t}</button>`;
  return `${mais.length ? `<div class="mais-acoes hidden" id="maisAcoes">${mais.map(b).join('')}</div>` : ''}
    <div class="linha">${mais.length ? `<button type="button" class="btn ghost" data-act="mais-acoes" aria-expanded="false">${ic('mais')}<span class="sr">Mais ações</span></button>` : ''}${prim.map(b).join('')}</div>`;
}

  }, true);

function mudarStatus(d, novo, tipo, dados = {}) {
  const patch = { id: d.id, status: novo };
  Object.assign(patch, dados.patch || {});
  save('demandas', patch, true);
  registrarMov(d.id, tipo, { ...dados, status_novo: novo });
  const estavaAberto = modalAberto();
  render();
  if (estavaAberto) abrirDemanda(d.id);
}

/* Formulário curto de ação: título, campos e um botão no rodapé. */
function formSimples(titulo, campos, onOk, textoBotao, classeBotao) {
  openModal(titulo, `<form id="fMov" class="stack" novalidate>${campos}<div class="err-msg" id="movErr"></div></form>`, (body, foot) => {
    const f = $('#fMov', body), err = $('#movErr', body);
    bindFoto(body);
    const enviar = ev => {
      if (ev) ev.preventDefault();
      if (FOTO_BUSY) { err.textContent = 'Aguarde o envio da foto terminar.'; return; }
      const msg = onOk(f.elements);
      if (msg) err.textContent = msg;
    };
    f.addEventListener('submit', enviar);
    $('[data-f-acao=ok]', foot).addEventListener('click', enviar);
  }, { foot: `<button type="button" class="btn block ${classeBotao || ''}" data-f-acao="ok">${textoBotao || 'Salvar'}</button>` });
}
const campoTexto = (nome, rotulo, obrig, dica, valor) =>
  `<label class="fld ${obrig ? 'req' : ''}"><span>${rotulo}</span><textarea name="${nome}">${esc(valor || '')}</textarea>${dica ? `<span class="hint">${dica}</span>` : ''}</label>`;
const campoFoto = () =>
